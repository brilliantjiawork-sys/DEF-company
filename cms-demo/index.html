function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function note(){return '<div class="readonly-note"><strong>Read-only preview.</strong> All edit fields and publishing controls are disabled. You can open each section and inspect the complete content structure without changing the website.</div>';}
function head(group,title,sub,back){return '<div class="page-head"><div><div class="eyebrow">'+esc(group)+'</div><h1>'+esc(title)+'</h1><p class="subtitle">'+esc(sub)+'</p></div>'+(back||'')+'</div>';}
function navlink(title,desc,action){return '<button class="navlink" data-action="'+action+'"><span><strong>'+esc(title)+'</strong><small>'+esc(desc)+'</small></span><span class="arrow">›</span></button>';}
function dashboard(){return head("CONTENT MANAGEMENT","Content Management","Manage website content, page copy and publishing settings.")+note()+
'<section class="group"><header class="group-head"><div><strong>Stories</strong><small>Editorial articles and industry insights</small></div></header><div class="group-body">'+navlink("New Story","Create a new Story entry","new-story")+navlink("Drafts","Unpublished Story entries","draft-stories")+navlink("Published","Published Stories on the website","published-stories")+navlink("Page Settings","Stories page title and introduction","story-settings")+'</div></section>'+
'<section class="group"><header class="group-head"><div><strong>Trade Shows</strong><small>Upcoming show cards and supporting articles</small></div></header><div class="group-body">'+navlink("Upcoming Shows","Edit the event cards shown on the website","upcoming-shows")+
'<div class="subgroup"><div class="subgroup-title">Trade Show Articles</div><div class="group-body">'+navlink("New Trade Show Article","Create a pre-show, during-show or post-show article","new-trade")+navlink("Drafts","Unpublished Trade Show Articles","draft-trade")+navlink("Published","Published Trade Show Articles","published-trade")+navlink("Page Settings","Trade Shows page title, tabs and introduction","trade-settings")+'</div></div></div></section>'+
'<section class="group"><header class="group-head"><div><strong>Social Media</strong><small>Page copy and social channel cards</small></div></header><div class="group-body">'+navlink("Social Media Page Content","Page title and disclaimer","social-page")+navlink("Social Channel Cards","LinkedIn, YouTube and Facebook cards","social-cards")+'</div></section>'+
'<section class="group"><header class="group-head"><div><strong>Media</strong><small>Media page copy and contacts</small></div></header><div class="group-body">'+navlink("Media Page Content","Page title and introduction","media-page")+navlink("Media Contacts","Contact records and portraits","media-contacts")+'</div></section>'+
'<section class="group"><header class="group-head"><div><strong>Website Basics</strong><small>Shared website content and form copy</small></div></header><div class="group-body">'+navlink("Brand Introduction","Logo, navigation and home hero","brand-intro")+navlink("Newsletter","Subscription content and confirmation","newsletter")+navlink("Contact Content","Contact Sales form labels and messages","contact")+navlink("Cookie & Privacy","Cookie banner and preference copy","cookie")+'</div></section>';}
function library(){return head("ASSET MANAGEMENT","Library","Browse visual assets stored in the website repository.")+note()+'<section class="panel"><div class="toolbar"><input class="search" id="asset-search" placeholder="Search assets by file name…"><button class="filter active">Images</button><button class="filter">PDF</button><button class="filter">Videos</button></div><div class="assets-grid" id="asset-grid">'+assets.map(a=>'<article class="asset-card" data-search="'+esc(a[0].toLowerCase())+'"><img loading="lazy" src="/images/'+esc(a[0])+'" alt=""><div class="asset-info"><strong>'+esc(a[0])+'</strong><small>'+esc(a[1])+' · images/</small></div></article>').join('')+'</div></section>';}
function draftPage(label){return head("CONTENT MANAGEMENT",label,"Unpublished entries are kept separately from published website content.",'<button class="btn" data-action="content">← Content Management</button>')+note()+'<section class="panel"><div class="empty-state"><strong>No draft entries to display</strong>This is the Drafts view in the editorial workflow. New entries can be saved as drafts before being published.</div></section>';}
function listPage(type,records){let title=type==="stories"?"Stories":type==="trade"?"Trade Show Articles":"Upcoming Shows";let rows=records.map((x,i)=>'<tr><td><span class="entry-title">'+esc(x.title)+'</span></td><td>'+esc(x.category||x.stage||x.theme||"—")+'</td><td>'+esc(x.date||x.start||"—")+'</td><td><span class="pill '+(type==="shows"?"amber":"green")+'">'+(type==="shows"?"Upcoming":"Published")+'</span></td><td><button class="open-link" data-record="'+type+'" data-index="'+i+'">Open entry →</button></td></tr>').join("");return head(type==="shows"?"TRADE SHOWS":"CONTENT MANAGEMENT",title,"Select an entry to inspect its configured fields.",'<button class="btn" data-action="content">← Content Management</button>')+note()+'<section class="panel"><div class="toolbar"><input class="search" data-filter="'+type+'" placeholder="Search title, date or category…"></div><div class="table-wrap"><table><thead><tr><th>Title</th><th>Category / Topic</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody id="rows">'+rows+'</tbody></table></div></section>'+
'<div class="card-grid">'+records.map((x,i)=>'<article class="record-card"><img src="/images/'+esc(x.image||"event-1.jpg")+'" alt=""><div class="record-copy"><div class="record-meta">'+esc(x.date||x.start||"")+' · '+esc(x.category||x.stage||x.theme||"")+'</div><strong>'+esc(x.title)+'</strong><p>'+esc(x.summary||x.location||"")+'</p><button class="open-link" data-record="'+type+'" data-index="'+i+'">Open entry →</button></div></article>').join("")+'</div>';}
function input(v,type){return '<input class="control" type="'+(type||"text")+'" value="'+esc(v||"")+'" disabled>';}
function area(v){return '<textarea class="control" disabled>'+esc(v||"")+'</textarea>';}
function selectbox(value,options){return '<div class="select-display"><span>'+esc(value||"Select…")+'</span><span>⌄</span></div><div class="select-options">'+options.map(o=>'<span class="option-chip '+(o===value?'selected':'')+'">'+esc(o)+'</span>').join('')+'</div>';}
function tokens(arr){return '<div class="token-list">'+(arr||[]).map(x=>'<span class="token">'+esc(x)+'</span>').join('')+'</div>';}
function checkbox(on,label){return '<div class="check-row"><input type="checkbox" '+(on?'checked':'')+' disabled><span>'+esc(label)+'</span><span class="switch-pill '+(on?'':'off')+'">'+(on?'Enabled':'Disabled')+'</span></div>';}
function imagefield(file){return '<div class="image-field"><img src="/images/'+esc(file||"story-cover.jpg")+'" alt=""><div><strong>'+esc(file||"")+'</strong><small>Selected from Library</small></div></div>';}
function field(label,control,hint,required){return '<div class="field"><label>'+esc(label)+(required?'<span class="required">*</span>':'')+'</label>'+control+(hint?'<div class="hint">'+esc(hint)+'</div>':'')+'</div>';}
function richtext(text){return '<div class="rich-toolbar">'+["H2","H3","B","I","• List","1. List","Link","Quote"].map(x=>'<span class="rich-tool">'+x+'</span>').join('')+'</div><div class="rich-area">'+esc(text||"")+'</div><div class="rich-modes"><span>Rich Text</span><span>Raw</span></div>';}
function ctaFields(on,label){return field("显示销售 CTA",checkbox(on,"Show sales CTA at the end of this content"))+field("CTA 文案",selectbox(label,ctaOptions),"Fixed choices: Talk to Our Team / Contact Sales / Book a Demo");}
function statusSide(type,status,date){return '<aside class="side-column"><section class="side-box"><header>Publishing</header><div class="inside">'+
'<div class="info-row"><span>Collection</span><b>'+esc(type)+'</b></div><div class="info-row"><span>Status</span><b><span class="pill '+(status==="Published"?"green":"amber")+'">'+esc(status)+'</span></b></div><div class="info-row"><span>Date</span><b>'+esc(date||"—")+'</b></div><div class="info-row"><span>Workflow</span><b>Draft → Publish</b></div></div></section><section class="side-box"><header>Actions</header><div class="inside"><p style="font-size:11px;color:#74818b;margin:0;line-height:1.6">The live CMS uses Save to keep an unpublished draft and Publish to update the website.</p></div></section></aside>';}
function actions(){return '<div class="action-bar"><span class="action-hint">Preview only · Actions disabled</span><button class="btn" disabled>Save</button><button class="btn" disabled>⌄</button><button class="btn primary" disabled>Publish</button></div>';}
function storyEditor(x,isNew){let title=isNew?"New Story":x.title;return head("STORIES / EDITOR","Story Editor",title,'<button class="btn" data-action="published-stories">← Stories</button>')+note()+
'<div class="form-layout"><section class="editor-panel"><div class="editor-header"><div><strong>Content</strong><small>Stories · JSON content entry</small></div><span class="pill '+(isNew?"amber":"green")+'">'+(isNew?"New entry":"Published")+'</span></div><div class="form-body">'+
field("文章标题",input(isNew?"":x.title),"",true)+
field("标题字号（px）",input(x.titleSize||34,"number"),"Controls the main article title on the website detail page. Range: 28–42 px.")+
field("发布日期",input(x.date,"date"),"",true)+
field("Content Category｜内容类别",selectbox(x.category||"Product & Technology",categories),"Required · Single selection",true)+
field("Industry｜行业",tokens(x.industries||[]),"Multiple selection")+
field("Content Topic｜内容话题",tokens(x.tags||[]),"Shared option set with Upcoming Shows and Trade Show Articles.")+
field("卡片摘要（可调整官网字号）",area(x.summary),"Required · Shown in Stories listing and recommendation cards",true)+
field("摘要字号（px）",input(x.summarySize||16,"number"),"Range: 14–18 px")+
field("封面图片",imagefield(x.image),"Select an existing image from Library.")+
field("图片替代文本",input(x.alt))+
field("虚构应用示例",checkbox(!!x.illustrative,"Illustrative example"))+
field("正文",richtext(x.body),"Rich text editor · Markdown format · Rich Text / Raw modes",true)+
field("正文默认字号（px）",input(x.bodySize||17,"number"),"Range: 14–20 px")+
ctaFields(!!x.cta,x.ctaLabel||"Talk to Our Team")+
'</div>'+actions()+'</section>'+statusSide("Stories",isNew?"New":"Published",x.date)+'</div>';}
function tradeEditor(x,isNew){return head("TRADE SHOW ARTICLES / EDITOR","Trade Show Article Editor",isNew?"New Trade Show Article":x.title,'<button class="btn" data-action="published-trade">← Trade Show Articles</button>')+note()+
'<div class="form-layout"><section class="editor-panel"><div class="editor-header"><div><strong>Content</strong><small>Trade Show Articles · JSON content entry</small></div><span class="pill '+(isNew?"amber":"green")+'">'+(isNew?"New entry":"Published")+'</span></div><div class="form-body">'+
field("文章标题",input(isNew?"":x.title),"",true)+field("标题字号（px）",input(x.titleSize||34,"number"),"Range: 28–42 px")+
field("文章阶段标签（官网卡片显示）",selectbox(x.stage||"Pre-show Preview",["Pre-show Preview","During-show Update","Post-show Recap"]),"Displayed before the publication date and article title on the website card.",true)+
field("对应展会名称（可选）",input(x.related||""))+
field("发布日期",input(x.date,"date"),"",true)+
field("Industry｜行业",tokens(x.industries||[]),"Multiple selection")+
field("Content Topic｜内容话题",tokens(x.tags||[]),"Shared topic set with Upcoming Shows and Stories.")+
field("卡片摘要（可调整官网字号）",area(x.summary),"Required",true)+field("摘要字号（px）",input(x.summarySize||16,"number"),"Range: 14–18 px")+
field("封面图片",imagefield(x.image))+field("图片替代文本",input(x.alt||""))+
field("虚构示例标记",checkbox(!!x.illustrative,"Illustrative example"))+
field("正文",richtext(x.body),"Rich text editor · Markdown format · Rich Text / Raw modes",true)+
field("正文默认字号（px）",input(x.bodySize||17,"number"),"Range: 14–20 px")+
ctaFields(!!x.cta,x.ctaLabel||"Talk to Our Team")+
'</div>'+actions()+'</section>'+statusSide("Trade Show Articles",isNew?"New":"Published",x.date)+'</div>';}
function showEditor(x){return head("TRADE SHOWS / UPCOMING SHOWS","Upcoming Show Editor",x.title,'<button class="btn" data-action="upcoming-shows">← Upcoming Shows</button>')+note()+
'<div class="form-layout"><section class="editor-panel"><div class="editor-header"><div><strong>Exhibition</strong><small>Upcoming Shows · exhibitions list item</small></div><span class="pill amber">Upcoming</span></div><div class="form-body">'+
field("展会名称",input(x.title),"",true)+field("展会封面图（卡片顶部图片）",imagefield(x.image),"Uploaded image is displayed at its original aspect ratio without cropping or stretching.",true)+
field("展位号",input(x.booth),"尚未确认时填写 TBC。",true)+field("开始日期",input(x.start,"date"),"",true)+field("结束日期",input(x.end,"date"),"",true)+
field("地点（城市、地区和国家）",input(x.location),"",true)+field("卡片话题标签",tokens(x.tags),"Shared topic options.")+
field("显示预约按钮",checkbox(true,"Show booking CTA on event card"))+
field("预约按钮文案",selectbox("Book a Meeting at This Show",showCtaOptions),"Available options: Book a Meeting at This Show / Talk to Our Team / Contact Sales / Book a Demo")+
'</div>'+actions()+'</section>'+statusSide("Upcoming Shows","Upcoming",x.start)+'</div>';}
function settingEditor(title,rows){return head("CONTENT MANAGEMENT / PAGE SETTINGS",title,"Page content and labels configured for the public website.",'<button class="btn" data-action="content">← Content Management</button>')+note()+'<section class="editor-panel"><div class="editor-header"><div><strong>Page Content</strong><small>File-based settings entry</small></div><span class="pill">Page Settings</span></div><div class="form-body">'+rows.map(r=>field(r[0],r[1].length>68?area(r[1]):input(r[1]),r[2]||"")).join('')+'</div>'+actions()+'</section>';}
function socialCards(){return head("SOCIAL MEDIA","Social Channel Cards","Each channel is configured as a separate item in the CMS.",'<button class="btn" data-action="content">← Content Management</button>')+note()+'<section class="panel">'+socialChannels.map((x,i)=>'<div class="panel-head"><strong>'+esc(x.platform)+'</strong><button class="open-link" data-record="social" data-index="'+i+'">Open channel →</button></div>').join('')+'</section>';}
function socialEditor(x){return head("SOCIAL MEDIA / CHANNEL","Social Channel Editor",x.platform,'<button class="btn" data-action="social-cards">← Social Channel Cards</button>')+note()+'<section class="editor-panel"><div class="editor-header"><strong>Channel</strong><span class="pill">Social Channel</span></div><div class="form-body">'+field("平台名称",selectbox(x.platform,["LinkedIn","YouTube","Facebook","Instagram","X","Other"]))+field("平台简介",area(x.description),"",true)+field("平台主页链接（https://）",input(x.url),"",true)+field("按钮文字",input(x.button),"",true)+field("图片",imagefield(x.image))+field("图片替代文本",input(x.alt))+field("在网站显示",checkbox(x.active,"Display this channel on the website"))+'</div>'+actions()+'</section>';}
function mediaContacts(){return head("MEDIA","Media Contacts","Each contact is configured as a separate item.",'<button class="btn" data-action="content">← Content Management</button>')+note()+'<section class="panel">'+contacts.map((x,i)=>'<div class="panel-head"><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.title)+' · '+esc(x.email)+'</small></div><button class="open-link" data-record="contact" data-index="'+i+'">Open contact →</button></div>').join('')+'</section>';}
function contactEditor(x){return head("MEDIA / CONTACT","Media Contact Editor",x.name,'<button class="btn" data-action="media-contacts">← Media Contacts</button>')+note()+'<section class="editor-panel"><div class="editor-header"><strong>Contact</strong><span class="pill">Media Contact</span></div><div class="form-body">'+field("姓名",input(x.name),"",true)+field("职位",input(x.title),"",true)+field("联系邮箱",input(x.email),"",true)+field("头像（可选）",imagefield(x.portrait))+field("头像替代文本",input(x.alt))+field("在网站显示",checkbox(x.active,"Display this contact on the website"))+'</div>'+actions()+'</section>';}
function drafts(type){let title=type==="story"?"Draft Stories":"Draft Trade Show Articles";return head("CONTENT MANAGEMENT",title,"Unpublished entries in the editorial workflow.",'<button class="btn" data-action="content">← Content Management</button>')+note()+'<section class="panel"><div class="empty-state"><strong>No draft entries available in this public preview</strong>The live CMS separates unpublished drafts from published content. This view is included to show the draft workflow structure.</div></section>';}
function render(page,data){state.page=page;navs();crumb.textContent=page==="library"?"Library":"Content Management";let out="";
if(page==="library")out=library();
else if(page==="content")out=dashboard();
else if(page==="stories")out=listPage("stories",stories);
else if(page==="trade")out=listPage("trade",tradeArticles);
else if(page==="shows")out=listPage("shows",shows);
else if(page==="draft-stories")out=drafts("story");
else if(page==="draft-trade")out=drafts("trade");
else if(page==="story-editor")out=storyEditor(data||stories[0],false);
else if(page==="new-story")out=storyEditor({title:"",date:"",category:"Product & Technology",industries:[],tags:[],summary:"",image:"story-cover.jpg",alt:"",illustrative:false,titleSize:34,summarySize:16,bodySize:17,cta:false,ctaLabel:"Talk to Our Team",body:""},true);
else if(page==="trade-editor")out=tradeEditor(data||tradeArticles[0],false);
else if(page==="new-trade")out=tradeEditor({title:"",date:"",stage:"Pre-show Preview",related:"",industries:[],tags:[],summary:"",image:"story-cover.jpg",alt:"",illustrative:true,titleSize:34,summarySize:16,bodySize:17,cta:false,ctaLabel:"Talk to Our Team",body:""},true);
else if(page==="show-editor")out=showEditor(data||shows[0]);
else if(page==="social-cards")out=socialCards();
else if(page==="social-editor")out=socialEditor(data||socialChannels[0]);
else if(page==="media-contacts")out=mediaContacts();
else if(page==="contact-editor")out=contactEditor(data||contacts[0]);
else if(page==="story-settings")out=settingEditor("Stories Page Settings",settings[page]);
else if(page==="trade-settings")out=settingEditor("Trade Shows Page Settings",settings[page]);
else if(page==="brand-intro")out=settingEditor("Brand Introduction",settings[page]);
else if(page==="newsletter")out=settingEditor("Newsletter",settings[page]);
else if(page==="social-page")out=settingEditor("Social Media Page Content",settings[page]);
else if(page==="media-page")out=settingEditor("Media Page Content",settings[page]);
else if(page==="contact")out=settingEditor("Contact Content",settings[page]);
else if(page==="cookie")out=settingEditor("Cookie & Privacy",settings[page]);
root.innerHTML=out;bind();}
function navs(){document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("active",b.dataset.nav===(state.page==="library"?"library":"content")));}
function go(a){const map={"library":"library","content":"content","new-story":"new-story","draft-stories":"draft-stories","published-stories":"stories","story-settings":"story-settings","upcoming-shows":"shows","new-trade":"new-trade","draft-trade":"draft-trade","published-trade":"trade","trade-settings":"trade-settings","social-page":"social-page","social-cards":"social-cards","media-page":"media-page","media-contacts":"media-contacts","brand-intro":"brand-intro","newsletter":"newsletter","contact":"contact","cookie":"cookie"};render(map[a]||"content");}
function bind(){
root.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.action)));
root.querySelectorAll("[data-record]").forEach(b=>b.addEventListener("click",()=>{const t=b.dataset.record,i=Number(b.dataset.index);if(t==="stories")render("story-editor",stories[i]);if(t==="trade")render("trade-editor",tradeArticles[i]);if(t==="shows")render("show-editor",shows[i]);if(t==="social")render("social-editor",socialChannels[i]);if(t==="contact")render("contact-editor",contacts[i]);}));
const a=$("#asset-search");if(a)a.addEventListener("input",()=>{const q=a.value.toLowerCase();root.querySelectorAll("[data-search]").forEach(el=>el.style.display=el.dataset.search.includes(q)?"":"none");});
const f=root.querySelector("[data-filter]");if(f)f.addEventListener("input",()=>{const q=f.value.toLowerCase();root.querySelectorAll("#rows tr").forEach(row=>row.style.display=row.textContent.toLowerCase().includes(q)?"":"none");});
}
document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>render(b.dataset.nav)));
render("library");
})();
</script>
