<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DEF Company | CMS Read-only Demo</title>
<style>
:root{--ink:#1b2a37;--muted:#788691;--line:#e5e9ed;--soft:#f5f7f9;--blue:#315d79;--bluebg:#edf3f7;--green:#4d8069}
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
.layout{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr)}aside{background:#fff;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:0 9px 21px;border-bottom:1px solid var(--line);margin-bottom:24px}.mark{width:34px;height:34px;border-radius:8px;background:#1d384b;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}.brand b{display:block;font-size:13px;letter-spacing:.05em}.brand small{font-size:10px;color:var(--muted)}
.navlabel{font-size:10px;letter-spacing:.12em;color:#9aa4ac;font-weight:700;padding:0 11px 8px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:7px;color:#596875;font-size:12px}.nav button:hover{background:#f5f7f8}.nav button.active{background:var(--bluebg);color:#234d69;font-weight:700}.nav button span{display:inline-block;width:23px;color:#6d8291}.sidefoot{margin-top:auto;padding:15px 10px 0;border-top:1px solid var(--line);font-size:10px;color:#8b969e;line-height:1.7}
main{min-width:0}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#fff;border-bottom:1px solid var(--line)}.crumb{font-size:11px;color:#87939c}.crumb b{color:#263846}.status{font-size:10px;letter-spacing:.06em;font-weight:750;color:#95622f;border:1px solid #f0dfc9;background:#fff8ef;border-radius:20px;padding:6px 10px}.wrap{max-width:1200px;margin:auto;padding:30px 32px 48px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#91a0aa;font-weight:750;margin-bottom:6px}h1{font-size:25px;letter-spacing:-.03em;margin:0 0 5px;font-weight:720}.sub{margin:0;color:var(--muted);font-size:12px}.notice{border:1px solid #e4ebef;background:#f9fbfc;color:#63717c;padding:10px 13px;border-radius:8px;font-size:11px;margin-bottom:19px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}.stat,.panel,.card,.asset{background:#fff;border:1px solid var(--line);border-radius:9px}.stat{padding:15px 17px}.stat label{font-size:10px;color:#8a969f}.stat strong{display:block;font-size:24px;margin:5px 0 1px;letter-spacing:-.04em}.stat small{font-size:10px;color:#97a1a9}
.panel{overflow:hidden}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line)}.panelhead b{font-size:12px}.panelhead small{display:block;color:#8a969f;font-size:10px;margin-top:2px}.linkbtn,.filter{border:1px solid var(--line);border-radius:6px;background:#fff;color:#536675;padding:7px 10px;font-size:10px;font-weight:650}.linkbtn:hover,.filter:hover{border-color:#9eb7c8;color:#284f69}
.toolbar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{height:34px;max-width:360px;flex:1;min-width:200px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:11px;outline:none}.search:focus{border-color:#9bb4c7}
table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;padding:10px 15px;background:#fafbfc;border-bottom:1px solid var(--line);font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:#89959e}td{padding:12px 15px;border-bottom:1px solid #eef1f3;font-size:11px;color:#566571}tr:last-child td{border-bottom:0}.entry{font-weight:650;color:#2a3b49}.pill{font-size:9px;background:#edf3f6;color:#527187;border-radius:20px;padding:4px 7px;white-space:nowrap}.pill.green{background:#edf6f0;color:#48765e}.pill.amber{background:#fbf3e9;color:#996b38}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{overflow:hidden}.photo{height:125px;background:#edf1f4}.photo img{width:100%;height:100%;object-fit:cover;display:block}.cardbody{padding:13px 14px}.meta{font-size:9px;color:#83909a;margin-bottom:7px;display:flex;gap:8px;flex-wrap:wrap}.title{font-size:12px;font-weight:700;line-height:1.45;margin-bottom:6px}.desc{font-size:10px;line-height:1.6;color:#7a8790;min-height:32px}.cardfoot{border-top:1px solid #edf0f2;margin-top:11px;padding-top:9px;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#909ba3}
.assetgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px}.asset{overflow:hidden}.assetimg{height:100px;background:#eef2f4}.assetimg img{width:100%;height:100%;object-fit:cover}.assettext{padding:9px 10px}.assettext b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.assettext small{font-size:9px;color:#8b969f}
.detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,.6fr);gap:14px}.detailbox{background:#fff;border:1px solid var(--line);border-radius:9px;padding:20px}.detailbox h2{font-size:18px;line-height:1.35;margin:12px 0}.detailbox p{font-size:11px;color:#697782;line-height:1.75}.detailbox h3{font-size:11px;margin:0 0 10px}.metarow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eef1f3;font-size:10px}.metarow span:first-child{color:#8a969f}
footer{text-align:center;color:#a0a9b0;font-size:9px;padding-top:22px}
@media(max-width:850px){.layout{grid-template-columns:190px 1fr}.wrap{padding:24px 18px}.top{padding:0 18px}.grid{grid-template-columns:repeat(2,1fr)}.assetgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.layout{display:block}aside{padding:11px 13px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 4px 10px;margin-bottom:10px}.navlabel,.sidefoot{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px}.top{height:52px;padding:0 14px}.wrap{padding:20px 13px}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.assetgrid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.head{display:block}}
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand"><div class="mark">DEF</div><div><b>DEF COMPANY</b><small>Content Management</small></div></div>
  <div class="navlabel">WORKSPACE</div>
  <nav class="nav">
    <button class="active" data-page="overview"><span>◫</span>Overview</button>
    <button data-page="library"><span>▦</span>Library</button>
    <button data-page="content"><span>▤</span>Content Management</button>
    <button data-page="stories"><span>▧</span>Stories</button>
    <button data-page="shows"><span>▣</span>Trade Shows</button>
    <button data-page="settings"><span>⚙</span>Page Settings</button>
  </nav>
  <div class="sidefoot">Portfolio demonstration<br>Public preview · Read-only access</div>
</aside>
<main>
<header class="top"><div class="crumb">DEF Company&nbsp; / &nbsp;<b id="crumb">Overview</b></div><div class="status">READ-ONLY DEMO</div></header>
<div class="wrap" id="view"></div>
</main>
</div>
<script>
(()=> {
const $=s=>document.querySelector(s), root=$("#view");
const stories=[
{title:"Why Reliable Machine Vision Starts with a Consistent Image",type:"Story",category:"Product & Technology",date:"31 Oct 2026",status:"Published",image:"/images/social-youtube-wide.jpg",summary:"How camera settings, lighting conditions and inspection requirements support repeatable machine vision workflows."},
{title:"How Machine Vision Guides Industrial Robots to Handle Variable Parts",type:"Story",category:"Product & Technology",date:"29 Oct 2026",status:"Published",image:"/images/social-cover.webp",summary:"How machine vision helps industrial robots adapt to variations in workpiece position and orientation."},
{title:"How AI-Powered Vision Is Revolutionizing Automotive Quality Control",type:"Story",category:"Industry Insights",date:"18 Oct 2026",status:"Published",image:"/images/story-cover.jpg",summary:"A look at AI-assisted visual inspection in automotive manufacturing."}
];
const shows=[
{title:"Industrial Vision & Automation Showcase 2026",type:"Upcoming Show",category:"AI & Deep Learning",date:"12–15 Nov 2026",status:"Upcoming",image:"/images/event-1.jpg",summary:"An illustrative event concept focused on inspection, defect detection and automation workflows."},
{title:"Smart Inspection & Vision Forum 2026",type:"Upcoming Show",category:"Machine Vision",date:"05–08 Dec 2026",status:"Upcoming",image:"/images/event-2.jpg",summary:"An illustrative event concept focused on industrial cameras, 3D vision and quality-control applications."},
{title:"Connecting Machine Vision with Production Quality",type:"Trade Show Article",category:"Quality Control",date:"20 Nov 2025",status:"Published",image:"/images/event-3.jpg",summary:"Trade-show coverage connecting machine vision applications with production quality."}
];
const assets=[
["social-linkedin.jpg","Social Media","/images/social-linkedin.jpg"],["social-facebook.jpg","Social Media","/images/social-facebook.jpg"],["social-youtube-wide.jpg","Social Media","/images/social-youtube-wide.jpg"],["story-cover.jpg","Stories","/images/story-cover.jpg"],["event-1.jpg","Trade Shows","/images/event-1.jpg"],["event-2.jpg","Trade Shows","/images/event-2.jpg"],["event-3.jpg","Trade Shows","/images/event-3.jpg"],["team.jpg","Brand Assets","/images/team.jpg"]
];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function head(k,t,s){return '<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="sub">'+s+'</p></div></div>'}
function badge(s){return '<span class="pill '+(s==="Published"?"green":s==="Upcoming"?"amber":"")+'">'+esc(s)+'</span>'}
function table(rows){return '<div style="overflow:auto"><table><thead><tr><th>Title</th><th>Type</th><th>Category</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map((x,i)=>'<tr><td class="entry">'+esc(x.title)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.date)+'</td><td>'+badge(x.status)+'</td><td><button class="filter" data-detail="'+esc(x.title)+'">View</button></td></tr>').join('')+'</tbody></table></div>'}
function cards(rows){return '<div class="grid">'+rows.map(x=>'<article class="card"><div class="photo"><img loading="lazy" src="'+esc(x.image)+'" alt=""></div><div class="cardbody"><div class="meta">'+esc(x.type)+' · '+esc(x.date)+'</div><div class="title">'+esc(x.title)+'</div><div class="desc">'+esc(x.summary)+'</div><div class="cardfoot"><span>'+esc(x.category)+'</span>'+badge(x.status)+'</div></div></article>').join('')+'</div>'}
function overview(){return head("WORKSPACE","Content Management","A structured workspace for managing website content and media assets.")+
'<div class="notice">Read-only portfolio preview. Browse the interface and content examples; editing, saving and publishing are disabled.</div>'+
'<div class="stats"><div class="stat"><label>CONTENT AREAS</label><strong>04</strong><small>Stories · Trade Shows · Library · Page Settings</small></div><div class="stat"><label>CONTENT ENTRIES</label><strong>06</strong><small>Sample entries in this demo</small></div><div class="stat"><label>MEDIA ASSETS</label><strong>08</strong><small>Centralized visual asset collection</small></div></div>'+
'<section class="panel"><div class="panelhead"><div><b>Recent Content</b><small>Latest sample entries</small></div><button class="filter" data-go="stories">View Stories →</button></div>'+table(stories.slice(0,2))+'</section>'+
'<div style="height:14px"></div><section class="panel"><div class="panelhead"><div><b>Workspace Structure</b><small>Two primary work areas</small></div></div><div class="grid" style="padding:15px"><article class="card"><div class="cardbody"><div class="eyebrow">01 · ASSET MANAGEMENT</div><div class="title">Library</div><div class="desc">Centralized images and visual assets, organized for reuse across content.</div><div class="cardfoot"><span>Media library</span><button class="filter" data-go="library">Browse →</button></div></div></article><article class="card"><div class="cardbody"><div class="eyebrow">02 · CONTENT OPERATIONS</div><div class="title">Content Management</div><div class="desc">Stories, trade-show content and website page settings in one workspace.</div><div class="cardfoot"><span>Content workspace</span><button class="filter" data-go="content">Browse →</button></div></div></article></div></section>'}
function listPage(type){let rows=type==="stories"?stories:shows;return head("CONTENT MANAGEMENT",type==="stories"?"Stories":"Trade Shows",type==="stories"?"Company, industry and product stories.":"Upcoming events and supporting trade-show articles.")+'<section class="panel"><div class="toolbar"><input class="search" id="q" placeholder="Search title, category or date…"><span class="filter">Read-only preview</span></div><div id="table">'+table(rows)+'</div></section><div style="height:15px"></div>'+cards(rows)}
function library(){return head("ASSET MANAGEMENT","Library","A centralized collection of visual assets used across website content.")+'<section class="panel"><div class="toolbar"><input class="search" id="assetq" placeholder="Search media assets…"><span class="filter">All types</span><span class="filter">Images</span><span class="filter">PDF</span><span class="filter">Videos</span></div><div class="assetgrid" id="assetlist">'+assets.map(a=>'<div class="asset"><div class="assetimg"><img loading="lazy" src="'+a[2]+'" alt=""></div><div class="assettext"><b>'+a[0]+'</b><small>Image · '+a[1]+'</small></div></div>').join('')+'</div></section>'}
function content(){return head("CONTENT OPERATIONS","Content Management","Separate content types and page-level settings.")+'<div class="grid">'+[['Stories','Editorial content with categories, industries and topic tags.','stories','03 sample entries'],['Trade Shows','Upcoming show listings and supporting event articles.','shows','03 sample entries'],['Page Settings','Page titles, introductions and key website copy.','settings','8 settings groups']].map(x=>'<article class="card"><div class="cardbody"><div class="eyebrow">CONTENT AREA</div><div class="title">'+x[0]+'</div><div class="desc">'+x[1]+'</div><div class="cardfoot"><span>'+x[3]+'</span><button class="filter" data-go="'+x[2]+'">Open →</button></div></div></article>').join('')+'</div>'}
function settings(){return head("WEBSITE CONFIGURATION","Page Settings","Page-level copy and configuration are organized separately from editorial entries.")+'<section class="panel"><div class="panelhead"><b>Available Settings Groups</b><span class="pill">Read-only</span></div>'+["Home & Brand Introduction","Newsletter Section","Stories Page","Trade Shows Page","Social Media Page","Media Page","Contact Sales Form","Cookie & Privacy"].map(x=>'<div class="metarow" style="padding:13px 17px"><span>'+x+'</span><b style="font-weight:600;color:#5a6a76">Configured</b></div>').join('')+'</section>'}
function detail(title){let x=[...stories,...shows].find(a=>a.title===title);if(!x)return overview();return head("CONTENT PREVIEW","Entry Details","Read-only view of a sample content record.")+'<button class="filter" data-go="'+(x.type==="Story"?"stories":"shows")+'">← Back to list</button><div style="height:12px"></div><div class="detail"><section class="detailbox"><img src="'+esc(x.image)+'" alt="" style="width:100%;max-height:240px;object-fit:cover;border-radius:6px"><div style="margin-top:14px">'+badge(x.status)+' <span class="pill">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.summary)+'</p></section><aside class="detailbox"><h3>CONTENT INFORMATION</h3>'+[['Content Type',x.type],['Category / Topic',x.category],['Date',x.date],['Publication Status',x.status],['Editing Access','Disabled']].map(a=>'<div class="metarow"><span>'+a[0]+'</span><b>'+esc(a[1])+'</b></div>').join('')+'</aside></div>'}
function render(page){current=page||current;let labels={overview:"Overview",library:"Library",content:"Content Management",stories:"Stories",shows:"Trade Shows",settings:"Page Settings"};$("#crumb").textContent=labels[current]||"Content Preview";document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===current));let html=current==="overview"?overview():current==="library"?library():current==="content"?content():current==="stories"?listPage("stories"):current==="shows"?listPage("shows"):current==="settings"?settings():detail(current.slice(7));root.innerHTML=html;bind()}
function bind(){root.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>render(b.dataset.go)));root.querySelectorAll("[data-detail]").forEach(b=>b.addEventListener("click",()=>render("detail:"+b.dataset.detail)));let q=$("#q");if(q)q.addEventListener("input",()=>{let rows=(current==="stories"?stories:shows).filter(x=>(x.title+" "+x.category+" "+x.date).toLowerCase().includes(q.value.toLowerCase()));$("#table").innerHTML=table(rows);bindDetails()});let aq=$("#assetq");if(aq)aq.addEventListener("input",()=>{let v=aq.value.toLowerCase();$("#assetlist").innerHTML=assets.filter(a=>(a[0]+" "+a[1]).toLowerCase().includes(v)).map(a=>'<div class="asset"><div class="assetimg"><img loading="lazy" src="'+a[2]+'" alt=""></div><div class="assettext"><b>'+a[0]+'</b><small>Image · '+a[1]+'</small></div></div>').join("")})}
function bindDetails(){root.querySelectorAll("[data-detail]").forEach(b=>b.addEventListener("click",()=>render("detail:"+b.dataset.detail)))}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>render(b.dataset.page)));
render("overview");
})();
</script>
</body></html>
