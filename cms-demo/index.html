E THE STANDARD OF SIGHT.'],['Logo 图片','logo.jpg'],['首页导航文字 Home','Home'],['首页导航文字 Newsroom','Newsroom'],['全局按钮 Contact Sales','Contact Sales'],['首页主标题','Precision Industrial Vision.'],['首页品牌介绍文案','DEF Company designs industrial vision concepts to help manufacturers explore inspection quality, automation and production challenges.'],['首页按钮文字','Book a Demo'],['首页主视觉图片','hero-bg.jpg']]);else if(view==='newsletter')html=simpleForm('Newsletter','Subscription section and confirmation message.',[['订阅区图片','team.jpg'],['图片说明','Illustrative engineering-team imagery for a fictional portfolio project.'],['订阅区标题','Subscribe to our Technical Newsletter'],['订阅区介绍','Receive illustrative product and technology explainers, industry application ideas and machine-vision insights for B2B manufacturers.'],['工作邮箱输入提示','Enter your Work Email'],['订阅按钮文字','Subscribe'],['提交成功标题','Welcome to DEF Insights!'],['提交成功说明','Thank you for subscribing to this portfolio demonstration newsletter.']]);else if(view==='contact')html=simpleForm('Contact Content','B2B lead form field labels and confirmation copy.',[['表单标题','Contact Sales'],['表单说明','Please share your business requirements below. This fictional portfolio site demonstrates the B2B lead-submission flow.'],['Work Email 标签','Work Email *'],['First Name 标签','First Name *'],['Last Name 标签','Last Name *'],['Company 标签','Company *'],['Phone 标签','Phone *'],['Country/Region 标签','Country/Region *'],['Zip Code 标签','Zip Code'],['Industry 标签','Industry'],['Additional Comments 标签','Additional Comments'],['国家下拉提示','Select Country'],['行业下拉提示','Select Industry'],['留言输入提示','Please tell us about your application or requirements...'],['提交按钮文字','Submit Inquiry'],['提交成功标题','Inquiry Received'],['提交成功说明','Thank you for submitting this portfolio demonstration form.'],['返回首页按钮文字','Return to Home']]);else if(view==='cookie')html=simpleForm('Cookie & Privacy','Consent banner, categories and preference controls.',[['标题','Your privacy matters.'],['说明','We use cookies to make this website work and, with your permission, to understand how it is used and measure marketing. You can change your choice at any time.'],['Reject all 按钮','Reject all'],['Customize 按钮','Customize'],['Accept all 按钮','Accept all'],['必要 Cookie 标题','Strictly necessary'],['必要 Cookie 说明','Required for the website to work. Always on.'],['Analytics 标题','Analytics'],['Analytics 说明','Helps us understand which pages and content are useful (Google Analytics).'],['Marketing 标题','Marketing'],['Marketing 说明','Lets us measure advertising performance and show more relevant ads.'],['保存设置按钮','Save my choices'],['重新打开设置按钮','Cookie settings']]);else if(view==='new-story')html=storyForm({...stories[0],title:'New Story · Sample Form',date:'',summary:'',cta:false});else if(view==='new-trade')html=tradeForm({...tradeArticles[0],title:'New Trade Show Article · Sample Form',date:'',summary:'',cta:false});else if(view==='social-page')html=simpleForm('Social Media Page Content','Page title, disclaimer and image-source attribution.',[['页面标题','Social Media'],['免责声明开头','Learning & portfolio notice:'],['免责声明正文','DEF Company is a fictional project created only for learning and portfolio presentation. The social media cards on this page are examples, not official DEF Company accounts. The photos are from'],['图片来源名称','Unsplash'],['图片来源网址','https://unsplash.com/']]);else if(view==='social-cards')html=simpleForm('Social Channel Cards','Channel cards · platform, description, link, button, image and visibility.',[['Platform','LinkedIn'],['平台简介','Our primary B2B channel for networking and technical thought leadership.'],['Platform URL','https://linkedin.com/'],['按钮文字','Follow us'],['图片','social-linkedin.jpg'],['图片替代文本','Social media preview image for the fictional DEF Company LinkedIn channel'],['在网站显示','Enabled'],['Platform','YouTube'],['平台简介','Watch product tutorials and customer case studies.'],['Platform URL','https://youtube.com/'],['按钮文字','Follow'],['图片','social-youtube-wide.jpg'],['在网站显示','Enabled'],['Platform','Facebook'],['平台简介','Join our global community for the latest updates.'],['Platform URL','https://facebook.com/'],['按钮文字','Follow'],['图片','social-facebook.jpg'],['在网站显示','Enabled']]);else if(view==='media-page')html=simpleForm('Media Page Content','Media page title, introduction and portfolio notice.',[['页面标题','Media Contacts'],['页面简介','For press inquiries, please contact the communications team using the details below.'],['免责声明开头','Learning & portfolio notice:'],['免责声明正文','This Media Contacts page is a fictional example for portfolio presentation. Names, titles and email addresses are simulated and do not identify real media contacts. The portraits are from']]);else if(view==='media-contacts')html=simpleForm('Media Contacts','Contact entries with name, title, email, portrait and visibility settings.',[['姓名','Jane Doe'],['职位','Senior PR Manager'],['联系邮箱','pr@defcompany.com'],['头像','media-1.jpg'],['头像替代文本','Fictional portfolio demonstration portrait of Jane Doe'],['在网站显示','Enabled'],['姓名','Sarah Smith'],['职位','Communications Lead'],['联系邮箱','press@defcompany.com'],['头像','media-2.jpg'],['头像替代文本','Fictional portfolio demonstration portrait of Sarah Smith'],['在网站显示','Enabled']]);else html=dashboard();root.innerHTML=html;bind();}

function go(a){if(a==='library'||a==='content'||a==='stories'||a==='trade'||a==='shows'||a==='story-settings'||a==='trade-settings'||a==='brand-intro'||a==='newsletter'||a==='contact'||a==='cookie'||a==='social-page'||a==='social-cards'||a==='media-page'||a==='media-contacts'){render(a);return;}if(a==='draft-stories'){render('draft-stories');return;}if(a==='published-stories'){render('stories');return;}if(a==='draft-trade'){render('draft-trade');return;}if(a==='published-trade'){render('trade');return;}if(a==='new-story'){render('new-story');return;}if(a==='new-trade'){render('new-trade');return;}if(a==='upcoming-shows'){render('shows');return;}}
