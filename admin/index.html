<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DEF Company 内容管理</title>
  <style>
    :root { color-scheme: light; }
    .def-cms-dashboard { max-width: 980px; margin: 0 auto; padding: 28px 26px 44px; color: #1b2733; font-family: Inter, system-ui, sans-serif; }
    .def-cms-dashboard h1 { margin: 0 0 8px; font-size: 28px; font-weight: 650; }
    .def-cms-dashboard h3 { margin: 22px 0 8px; font-size: 15px; font-weight: 650; }
    .def-cms-dashboard .intro { margin: 0 0 20px; color: #586675; line-height: 1.4; }
    .def-cms-group { border-bottom: 1px solid #dce3e9; padding: 0 0 20px; margin: 0 0 20px; }
    .def-cms-group > h2 { margin: 0 0 10px; padding: 0; font-size: 17px; line-height: 1.4; font-weight: 700; color: #172a3a; }
    .def-cms-items { padding: 0; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
    .def-cms-item { display: flex; align-items: center; gap: 11px; min-height: 50px; padding: 10px 12px; border: 1px solid #e0e7ed; border-radius: 8px; text-decoration: none; color: #1f2d3a; background: #fff; }
    .def-cms-item:hover, .def-cms-item:focus-visible { border-color: #93b7d4; background: #f7fbff; outline: none; }
    .def-cms-item strong { display: block; font-size: 14px; font-weight: 650; }
    .def-cms-icon { display: grid; place-items: center; flex: 0 0 28px; width: 28px; height: 28px; border-radius: 7px; background: #eef4f8; color: #234b68; }
    .def-cms-icon svg { width: 18px; height: 18px; display: block; }
    .def-cms-subgroup { margin: 12px 0; padding: 0 0 4px; }
    .def-cms-subgroup > h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: #43596b; }
    .def-cms-subgroup .def-cms-items { padding-top: 0; }
    .def-cms-group-stacked > .def-cms-items { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
    .def-cms-group-stacked > .def-cms-items > .def-cms-subgroup { width: 100%; box-sizing: border-box; }
    .def-cms-dashboard .def-cms-subgroup + .def-cms-item { margin-top: 8px; }
    .def-cms-section-caption { margin: -3px 0 12px; color: #687887; font-size: 13px; line-height: 1.5; }
    @media (max-width: 720px) { .def-cms-items { grid-template-columns: 1fr; } .def-cms-dashboard { padding: 18px; } }
  </style>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <script>
    (() => {
      if (!window.CMS || typeof CMS.registerCustomPage !== 'function' || !CMS.React) return;
      const h = CMS.React.createElement;
      const iconPaths = {
        plus: h('path', { d: 'M12 5v14M5 12h14', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round' }),
        check: h('path', { d: 'm5 12 4 4L19 6', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }),
        draft: h('path', { d: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M8 13h8 M8 17h6', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round' }),
        settings: h('path', { d: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 3.1-.2-.1a1.7 1.7 0 0 0-1.9.2 1.7 1.7 0 0 0-.8 1.5v.3h-3.6v-.3a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.2l-.2.1-1.8-3.1.2-.2a1.7 1.7 0 0 0 .2-1.8A1.7 1.7 0 0 0 5.5 14h-.3v-3.6h.3a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.2-1.8l-.1-.2 3.1-1.8.2.2a1.7 1.7 0 0 0 1.8.2A1.7 1.7 0 0 0 13 4.3V4h3.6v.3a1.7 1.7 0 0 0 1.1 1.6 1.7 1.7 0 0 0 1.8-.2l.2-.1 1.8 3.1-.2.2a1.7 1.7 0 0 0-.2 1.8 1.7 1.7 0 0 0 1.5.8h.3v3.6h-.3a1.7 1.7 0 0 0-1.2.1z', fill: 'none', stroke: 'currentColor', strokeWidth: 1.1, strokeLinejoin: 'round' }),
        image: h('path', { d: 'M4 5h16v14H4z M8 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z M4 16l5-5 4 4 3-3 4 4', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinejoin: 'round' }),
        home: h('path', { d: 'm3 10 9-7 9 7 M5 9v11h14V9 M9 20v-7h6v7', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinejoin: 'round' }),
        social: h('path', { d: 'M7 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M17 14a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M7 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M9.5 6.5l5 3 M9.5 17.5l5-3', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round' }),
        media: h('path', { d: 'M4 4h16v16H4z M8 9h8 M8 13h8 M8 17h5', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round' })
      };
      const icon = (name) => h('span', { className: 'def-cms-icon', 'aria-hidden': 'true' }, h('svg', { viewBox: '0 0 24 24', fill: 'none' }, iconPaths[name] || iconPaths.draft));
      const link = (title, route, iconName = 'draft') => h('a', { className: 'def-cms-item', href: route }, icon(iconName), h('strong', null, title));
      const group = (title, children, caption = '', stacked = false) => h('section', { className: 'def-cms-group' + (stacked ? ' def-cms-group-stacked' : '') },
        h('h2', null, title),
        caption ? h('p', { className: 'def-cms-section-caption' }, caption) : null,
        h('div', { className: 'def-cms-items' }, ...children)
      );
      const subgroup = (title, children, caption = '') => h('div', { className: 'def-cms-subgroup' },
        h('h3', null, title),
        caption ? h('p', { className: 'def-cms-section-caption' }, caption) : null,
        h('div', { className: 'def-cms-items' }, ...children)
      );

      // Every section and sub-entry is visible at once. There are no accordions here,
      // so high-frequency tasks never require an extra click just to reveal links.
      const ContentManagement = () => h('div', { className: 'def-cms-dashboard' },
        h('h1', null, 'Content Management'),
        h('p', { className: 'intro' }, 'Edit website content and publishing settings. Assets are managed separately in Library.'),
        group('Stories', [
          link('New Story', '#/collections/stories/entries/new', 'plus'),
          link('Draft Stories', '#/workflow', 'draft'),
          link('Published Stories', '#/pages/stories-published', 'check'),
          link('Stories Page Settings', '#/collections/content-management/entries/stories_page_settings', 'settings')
        ]),
        group('Trade Shows', [
          link('Upcoming Shows', '#/collections/content-management/entries/upcoming_shows', 'check'),
          subgroup('Trade Show Articles', [
            link('New Trade Show Article', '#/collections/trade-show-articles/entries/new', 'plus'),
            link('Draft Trade Show Articles', '#/workflow', 'draft'),
            link('Published Trade Show Articles', '#/pages/trade-articles-published', 'check')
          ]),
          link('Trade Shows Page Settings', '#/collections/content-management/entries/events_page_settings', 'settings')
        ], '', true),
        group('Social Media', [
          link('Social Media Page Content', '#/collections/content-management/entries/social_page', 'social'),
          link('Social Channel Cards', '#/collections/content-management/entries/social_media', 'image')
        ]),
        group('Media', [
          link('Media Page Content', '#/collections/content-management/entries/media_page', 'media'),
          link('Media Contacts', '#/collections/content-management/entries/media_contacts', 'plus')
        ]),
        group('Website Basics', [
          link('Brand Introduction', '#/collections/content-management/entries/home_intro', 'home'),
          link('Newsletter', '#/collections/content-management/entries/home_newsletter', 'plus')
        ])
      );

      const PublishedListPage = (title, folder, collection) => {
        const Page = () => {
          const [rows, setRows] = CMS.React.useState([]);
          const [loading, setLoading] = CMS.React.useState(true);
          const [error, setError] = CMS.React.useState('');
          const load = CMS.React.useCallback(async () => {
            setLoading(true); setError('');
            try {
              const repo = 'brilliantjiawork-sys/DEF-company';
              const branch = 'main';
              const indexResponse = await fetch(`https://data.jsdelivr.com/v1/package/gh/${repo}@${branch}/flat`, { cache: 'no-store' });
              if (!indexResponse.ok) throw new Error(`读取失败（${indexResponse.status}）`);
              const index = await indexResponse.json();
              const paths = (index.files || []).map(file => file.name.replace(/^\//, '')).filter(path => path.startsWith(`${folder}/`) && path.toLowerCase().endsWith('.json'));
              const entries = await Promise.all(paths.map(async path => {
                const response = await fetch(`https://raw.githubusercontent.com/${repo}/${branch}/${path}`, { cache: 'no-store' });
                if (!response.ok) return null;
                try { return { slug: path.split('/').pop().replace(/\.json$/i, ''), record: await response.json() }; } catch (_) { return null; }
              }));
              setRows(entries.filter(item => item && item.record && item.record.title).sort((a,b) => String(b.record.date || '').localeCompare(String(a.record.date || ''))));
            } catch (err) { setError(err.message || '读取失败'); }
            finally { setLoading(false); }
          }, []);
          CMS.React.useEffect(() => { load(); }, [load]);
          return h('div', { className: 'def-cms-dashboard' },
            h('h1', null, title),
            h('div', { className: 'def-cms-items' },
              link('新增文章', `#/collections/${collection}/entries/new`, 'plus'),
              link('草稿', '#/workflow', 'draft'),
              link('返回内容列表', collection === 'stories' ? '#/collections/stories' : '#/collections/trade-show-articles', 'home')
            ),
            loading ? h('p', null, '正在读取…') : null,
            error ? h('p', { role: 'alert' }, `文章列表读取失败：${error}`) : null,
            !loading && !error && rows.length === 0 ? h('p', null, '暂无已发布文章。') : null,
            ...rows.map(item => h('a', { key: item.slug, className: 'def-cms-item', href: `#/collections/${collection}/entries/${item.slug}` }, icon('check'), h('strong', null, item.record.title)))
          );
        };
        return Page;
      };
      const StoriesManager = () => h('div', { className: 'def-cms-dashboard' },
        h('h1', null, 'Stories'),
        h('div', { className: 'def-cms-items' },
          link('新增文章', '#/collections/stories/entries/new', 'plus'),
          link('已发布', '#/pages/stories-published', 'check'),
          link('草稿', '#/workflow', 'draft'),
          link('页面设置', '#/collections/content-management/entries/stories_page_settings', 'settings')
        )
      );
      const TradeShowManager = () => h('div', { className: 'def-cms-dashboard' },
        h('h1', null, 'Trade Show'),
        h('div', { className: 'def-cms-items' },
          link('Upcoming Shows', '#/collections/content-management/entries/upcoming_shows', 'check')
        ),
        h('h3', null, 'Trade Show Articles'),
        h('div', { className: 'def-cms-items' },
          link('新增文章', '#/collections/trade-show-articles/entries/new', 'plus'),
          link('已发布', '#/pages/trade-articles-published', 'check'),
          link('草稿', '#/workflow', 'draft')
        ),
        h('h3', null, '页面设置'),
        h('div', { className: 'def-cms-items' },
          link('页面设置', '#/collections/content-management/entries/events_page_settings', 'settings')
        )
      );
      const StoriesPublished = PublishedListPage('Stories · 已发布', 'data/stories', 'stories');
      const TradeArticlesPublished = PublishedListPage('Trade Show Articles · 已发布', 'data/trade-show-articles', 'trade-show-articles');
      CMS.registerCustomPage({ id: 'stories-manager', label: 'Stories', icon: 'article', component: StoriesManager });
      CMS.registerCustomPage({ id: 'stories-published', label: 'Stories · 已发布', icon: 'task_alt', component: StoriesPublished });
      CMS.registerCustomPage({ id: 'trade-show-manager', label: 'Trade Show', icon: 'event', component: TradeShowManager });
      CMS.registerCustomPage({ id: 'trade-articles-published', label: 'Trade Show Articles · 已发布', icon: 'task_alt', component: TradeArticlesPublished });

      // Library indexes assets already in the public repository and relates them back
      // to the CMS records that reference them. Uploading/replacing files remains in
      // Sveltia's native Asset Library, reached from the action at the top of this page.
      const MediaLibrary = () => {
        const [items, setItems] = CMS.React.useState([]);
        const [query, setQuery] = CMS.React.useState('');
        const [typeFilter, setTypeFilter] = CMS.React.useState('all');
        const [useFilter, setUseFilter] = CMS.React.useState('all');
        const [loading, setLoading] = CMS.React.useState(true);
        const [error, setError] = CMS.React.useState('');
        const repo = 'brilliantjiawork-sys/DEF-company';
        const branch = 'main';
        const pdfExt = /\.pdf$/i;
        const videoExt = /\.(?:mp4|webm|mov|m4v|ogv|avi|mkv)$/i;
        const assetExt = /\.(?:png|jpe?g|webp|gif|svg|avif|pdf|mp4|webm|mov|m4v|ogv|avi|mkv)$/i;
        const assetRoots = ['images/', 'videos/', 'pdf/', 'documents/', 'downloads/', 'whitepapers/', 'catalogs/', 'assets/'];
        const staticData = [
          ['data/events.json', 'shows'],
          ['data/social-media.json', 'socialMedia'],
          ['data/newsroom-social-media.json', 'socialPage'],
          ['data/media-contacts.json', 'mediaContacts'],
          ['data/newsroom-media.json', 'mediaPage'],
          ['data/site-content.json', 'website'],
          ['data/home-intro.json', 'website'],
          ['data/home-newsletter.json', 'website'],
          ['data/stories-page-settings.json', 'website'],
          ['data/trade-shows-page-settings.json', 'website'],
          ['data/contact-content.json', 'website'],
          ['data/cookie-content.json', 'website']
        ];
        const cleanPath = value => {
          let result = String(value || '').split(/[?#]/)[0].trim().replace(/\\/g, '/').replace(/^\.\//, '').replace(/^\/+/, '');
          try { result = decodeURIComponent(result); } catch (_) {}
          return result;
        };
        const baseName = value => cleanPath(value).split('/').pop().toLowerCase();
        const getType = path => pdfExt.test(path) ? 'pdf' : videoExt.test(path) ? 'video' : 'image';
        const typeLabel = type => type === 'pdf' ? 'PDF' : type === 'video' ? 'Video' : 'Image';
        const categoryForKind = kind => ({
          stories: 'Stories', tradeArticles: 'Trade Shows', shows: 'Trade Shows',
          socialMedia: 'Social Media', socialPage: 'Social Media',
          mediaContacts: 'Media Contacts', mediaPage: 'Media Contacts', website: 'Website & Brand'
        }[kind] || 'Website & Brand');
        const titleForRecord = (record, fallback, kind) => String((kind === 'mediaContacts' ? record?.name : '') || record?.title || record?.name || record?.platform || record?.full_name || record?.contact_name || record?.page_title || fallback || 'Untitled').trim();
        const collectRefs = (value, fieldPath = '', out = []) => {
          if (typeof value === 'string') {
            const matches = value.match(/(?:\/?[A-Za-z0-9_ .@()/-]+\.(?:png|jpe?g|webp|gif|svg|avif|pdf|mp4|webm|mov|m4v|ogv|avi|mkv))(?:[?#][^\s"'<>]*)?/gi) || [];
            matches.forEach(match => out.push({ path: cleanPath(match), field: fieldPath }));
          } else if (Array.isArray(value)) {
            value.forEach((item, index) => collectRefs(item, fieldPath ? `${fieldPath}[${index}]` : `[${index}]`, out));
          } else if (value && typeof value === 'object') {
            Object.entries(value).forEach(([key, item]) => collectRefs(item, fieldPath ? `${fieldPath}.${key}` : key, out));
          }
          return out;
        };
        const getEditUrl = (kind, slug = '') => {
          const encoded = encodeURIComponent(slug);
          if (kind === 'stories' && slug) return `#/collections/stories/entries/${encoded}`;
          if (kind === 'tradeArticles' && slug) return `#/collections/trade-show-articles/entries/${encoded}`;
          if (kind === 'shows') return '#/collections/content-management/entries/upcoming_shows';
          if (kind === 'socialMedia') return '#/collections/content-management/entries/social_media';
          if (kind === 'socialPage') return '#/collections/content-management/entries/social_page';
          if (kind === 'mediaContacts' || kind === 'mediaPage') return `#/collections/content-management/entries/${kind === 'mediaContacts' ? 'media_contacts' : 'media_page'}`;
          if (kind === 'website') {
            if (slug === 'home-intro') return '#/collections/content-management/entries/home_intro';
            if (slug === 'home-newsletter') return '#/collections/content-management/entries/home_newsletter';
            if (slug === 'stories-page-settings') return '#/collections/content-management/entries/stories_page_settings';
            if (slug === 'trade-shows-page-settings') return '#/collections/content-management/entries/events_page_settings';
          }
          return '';
        };
        const recordsFrom = (data, kind, path, explicitSlug = '') => {
          if (!data) return [];
          const toRecord = (record, slug, fallback) => ({
            record, kind, source: path, slug: slug || String(record?.slug || ''),
            title: titleForRecord(record, fallback, kind), category: categoryForKind(kind),
            editUrl: getEditUrl(kind, slug || String(record?.slug || ''), path)
          });
          if (kind === 'stories' && Array.isArray(data.articles)) return data.articles.map(record => toRecord(record, String(record.slug || ''), 'Story'));
          if (kind === 'tradeArticles' && Array.isArray(data.articles)) return data.articles.map(record => toRecord(record, String(record.slug || ''), 'Trade Show Article'));
          if (kind === 'shows' && Array.isArray(data.exhibitions)) return data.exhibitions.map((record, i) => toRecord(record, '', `Trade Show ${i + 1}`));
          if (kind === 'socialMedia' && Array.isArray(data.channels)) return data.channels.map((record, i) => toRecord(record, '', `Social Channel ${i + 1}`));
          if (kind === 'mediaContacts' && Array.isArray(data.contacts)) return data.contacts.map((record, i) => toRecord(record, '', `Media Contact ${i + 1}`));
          if (Array.isArray(data)) return data.map((record, i) => toRecord(record, '', `${kind} ${i + 1}`));
          return [toRecord(data, explicitSlug, path.split('/').pop().replace(/\.json$/i, ''))];
        };

        CMS.React.useEffect(() => {
          let cancelled = false;
          const fetchIndex = async () => {
            try {
              const response = await fetch(`https://data.jsdelivr.com/v1/package/gh/${repo}@${branch}/flat`, { cache: 'no-store' });
              if (!response.ok) throw new Error(`CDN ${response.status}`);
              const data = await response.json();
              return (data.files || []).map(file => ({ path: cleanPath(file.name), size: file.size || 0, url: `https://cdn.jsdelivr.net/gh/${repo}@${branch}/${cleanPath(file.name)}` }));
            } catch (cdnError) {
              const response = await fetch(`https://api.github.com/repos/${repo}/git/trees/${branch}?recursive=1`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
              if (!response.ok) throw new Error(`素材索引暂时不可用（GitHub ${response.status}）。请刷新后重试。`);
              const data = await response.json();
              if (data.truncated) throw new Error('仓库文件列表超过单次索引范围，无法保证素材完整。');
              return (data.tree || []).filter(file => file.type === 'blob').map(file => ({ path: cleanPath(file.path), size: file.size || 0, url: `https://raw.githubusercontent.com/${repo}/${branch}/${cleanPath(file.path)}` }));
            }
          };
          const fetchJson = async path => {
            try {
              const response = await fetch(`https://raw.githubusercontent.com/${repo}/${branch}/${path}`, { cache: 'no-store' });
              if (!response.ok) return null;
              return await response.json();
            } catch (_) { return null; }
          };
          const load = async () => {
            try {
              const repoFiles = await fetchIndex();
              const assets = repoFiles.filter(file => assetRoots.some(root => file.path.startsWith(root)) && assetExt.test(file.path))
                .map(file => ({ ...file, name: file.path.split('/').pop(), type: getType(file.path), usages: [], categories: [] }));
              const hasStoryFiles = repoFiles.some(file => /^data\/stories\/[^/]+\.json$/i.test(file.path));
              const hasTradeArticleFiles = repoFiles.some(file => /^data\/trade-show-articles\/[^/]+\.json$/i.test(file.path));
              const contentSources = [];
              if (hasStoryFiles) {
                repoFiles.filter(file => /^data\/stories\/[^/]+\.json$/i.test(file.path)).forEach(file => contentSources.push({ path: file.path, kind: 'stories', slug: file.path.split('/').pop().replace(/\.json$/i, '') }));
              } else contentSources.push({ path: 'data/database.json', kind: 'stories-index' });
              if (hasTradeArticleFiles) {
                repoFiles.filter(file => /^data\/trade-show-articles\/[^/]+\.json$/i.test(file.path)).forEach(file => contentSources.push({ path: file.path, kind: 'tradeArticles', slug: file.path.split('/').pop().replace(/\.json$/i, '') }));
              } else contentSources.push({ path: 'data/event-coverage.json', kind: 'tradeArticles-index' });
              staticData.forEach(([path, kind]) => contentSources.push({ path, kind, slug: path.split('/').pop().replace(/\.json$/i, '') }));
              const loadedSources = await Promise.all(contentSources.map(async source => ({ ...source, data: await fetchJson(source.path) })));
              const records = [];
              loadedSources.forEach(source => {
                if (!source.data) return;
                let kind = source.kind;
                if (kind === 'stories-index') kind = 'stories';
                if (kind === 'tradeArticles-index') kind = 'tradeArticles';
                if (source.path === 'data/social-media.json') kind = 'socialMedia';
                records.push(...recordsFrom(source.data, kind, source.path, source.slug));
                // Add the real per-file slug to folder-based content so the edit link points at the exact entry.
                if ((kind === 'stories' || kind === 'tradeArticles') && source.path.match(/^data\/(?:stories|trade-show-articles)\/[^/]+\.json$/i) && records.length) {
                  const last = records[records.length - 1];
                  last.slug = source.slug;
                  last.editUrl = getEditUrl(kind, source.slug);
                }
              });

              const usageByExactPath = new Map();
              const usageByBasename = new Map();
              records.forEach(entry => {
                collectRefs(entry.record).forEach(ref => {
                  const refPath = cleanPath(ref.path);
                  const base = baseName(refPath);
                  const fieldLower = ref.field.toLowerCase();
                  let usageLabel = /gallery/.test(fieldLower) ? 'Gallery Image' : /avatar|photo|portrait/.test(fieldLower) ? 'Contact Photo' : /cover/.test(fieldLower) ? 'Cover Image' : /body|content|markdown/.test(fieldLower) ? 'Body Image' : /video/.test(fieldLower) ? 'Video' : /pdf|whitepaper|catalog|brochure|document|file/.test(fieldLower) ? 'PDF File' : /logo/.test(fieldLower) ? 'Brand Logo' : /hero/.test(fieldLower) ? 'Homepage Hero Image' : /image|thumbnail|media|asset/.test(fieldLower) ? 'Image' : 'Page Asset';
                  const usage = {
                    category: entry.category, title: entry.title, kind: entry.kind, source: entry.source,
                    label: usageLabel, editUrl: entry.editUrl, topics: Array.isArray(entry.record?.tags) ? entry.record.tags : [],
                    industries: Array.isArray(entry.record?.industries) ? entry.record.industries : []
                  };
                  const keys = new Set([refPath]);
                  if (refPath.startsWith('images/')) keys.add(refPath.slice('images/'.length));
                  if (refPath.startsWith('/')) keys.add(refPath.slice(1));
                  keys.forEach(key => {
                    if (!usageByExactPath.has(key)) usageByExactPath.set(key, []);
                    usageByExactPath.get(key).push(usage);
                  });
                  if (!usageByBasename.has(base)) usageByBasename.set(base, []);
                  usageByBasename.get(base).push(usage);
                });
              });
              const mapped = assets.map(asset => {
                const exactCandidates = [asset.path, asset.path.startsWith('images/') ? asset.path.slice('images/'.length) : asset.path];
                let usages = [];
                exactCandidates.some(key => {
                  if (usageByExactPath.has(key)) { usages = usageByExactPath.get(key); return true; }
                  return false;
                });
                if (!usages.length) {
                  const byBase = usageByBasename.get(asset.name.toLowerCase()) || [];
                  // Only use filename fallback if the repository contains a single asset with that name.
                  const duplicatePathCount = assets.filter(other => other.name.toLowerCase() === asset.name.toLowerCase()).length;
                  if (duplicatePathCount === 1) usages = byBase;
                }
                const unique = [];
                const seen = new Set();
                usages.forEach(usage => {
                  const key = [usage.category, usage.title, usage.source, usage.label].join('|');
                  if (!seen.has(key)) { seen.add(key); unique.push(usage); }
                });
                const categories = [...new Set(unique.map(usage => usage.category))];
                return { ...asset, usages: unique, categories, category: categories[0] || 'unused' };
              });
              if (!cancelled) { setItems(mapped.sort((a, b) => a.name.localeCompare(b.name))); setError(''); }
            } catch (err) {
              if (!cancelled) setError(err?.message || '读取素材失败。');
            } finally { if (!cancelled) setLoading(false); }
          };
          load();
          return () => { cancelled = true; };
        }, []);

        const useOptions = [
          ['all', 'All scenarios'], ['Stories', 'Stories'], ['Trade Shows', 'Trade Shows'],
          ['Social Media', 'Social Media'], ['Media Contacts', 'Media Contacts'], ['Website & Brand', 'Website & Brand'], ['unused', 'Not currently used']
        ];
        const filtered = items.filter(item => {
          if (typeFilter !== 'all' && item.type !== typeFilter) return false;
          if (useFilter === 'unused' && item.usages.length) return false;
          if (useFilter !== 'all' && useFilter !== 'unused' && !(item.categories || []).includes(useFilter)) return false;
          const searchText = [item.name, item.path, ...(item.categories || []), ...item.usages.flatMap(usage => [usage.title, usage.label, usage.category, ...(usage.topics || []), ...(usage.industries || [])])].join(' ').toLowerCase();
          return !query.trim() || searchText.includes(query.trim().toLowerCase());
        });
        const textFilterStyle = active => ({
          border: 0, borderBottom: active ? '2px solid #234b68' : '2px solid transparent',
          borderRadius: 0, padding: '5px 4px 6px', background: 'transparent', color: active ? '#1b3448' : '#526474',
          fontWeight: active ? 700 : 500, cursor: 'pointer', font: 'inherit', fontSize: 13
        });
        const typeButton = (id, label) => h('button', { type: 'button', key: id, 'aria-pressed': String(typeFilter === id), onClick: () => setTypeFilter(typeFilter === id ? 'all' : id), style: textFilterStyle(typeFilter === id) }, label);
        const useButton = (id, label) => h('button', { type: 'button', key: id, 'aria-pressed': String(useFilter === id), onClick: () => setUseFilter(id), style: textFilterStyle(useFilter === id) }, label);
        const card = item => {
          const preview = item.type === 'image'
            ? h('img', { src: item.url, alt: item.name, loading: 'lazy', style: { width: '100%', height: '100%', objectFit: 'contain', display: 'block' }, onError: event => { event.currentTarget.style.display = 'none'; } })
            : item.type === 'video'
              ? h('video', { controls: true, muted: true, preload: 'metadata', style: { maxWidth: '100%', maxHeight: '100%' } }, h('source', { src: item.url }))
              : h('a', { href: item.url, target: '_blank', rel: 'noreferrer', style: { color: '#234b68', fontSize: 13, textDecoration: 'underline' } }, 'Open PDF');
          return h('article', { key: item.path, style: { border: '1px solid #dce3e9', borderRadius: 8, overflow: 'hidden', background: '#fff', minWidth: 0 } },
            h('div', { style: { aspectRatio: '16/9', background: '#f3f5f7', display: 'grid', placeItems: 'center', overflow: 'hidden', padding: item.type === 'pdf' ? 10 : 0, boxSizing: 'border-box' } }, preview),
            h('div', { style: { padding: 12 } },
              h('strong', { style: { display: 'block', overflowWrap: 'anywhere', marginBottom: 4 } }, item.name),
              h('div', { style: { fontSize: 12, color: '#657381', marginBottom: 8 } }, `${typeLabel(item.type)} · ${item.path}`),
              item.usages.length
                ? h('div', { style: { borderTop: '1px solid #edf0f2', paddingTop: 9 } },
                    ...item.usages.map((usage, index) => h('div', { key: `${usage.source}|${usage.title}|${index}`, style: { fontSize: 12, lineHeight: 1.5, marginBottom: 8 } },
                      h('div', { style: { color: '#53697a', fontSize: 11, marginBottom: 2 } }, `${usage.category} · ${usage.label}`),
                      h('strong', { style: { display: 'block', overflowWrap: 'anywhere' } }, usage.title),
                      (usage.topics.length || usage.industries.length) ? h('div', { style: { color: '#657381', marginTop: 3 } }, [...usage.industries, ...usage.topics].join(' · ')) : null,
                      usage.editUrl ? h('a', { href: usage.editUrl, style: { display: 'inline-block', marginTop: 4, color: '#234b68', textDecoration: 'underline', textUnderlineOffset: 2 } }, 'Open related content') : null
                    ))
                  )
                : h('div', { style: { borderTop: '1px solid #edf0f2', paddingTop: 8, color: '#7b6262', fontSize: 12 } }, 'Not currently referenced by a known CMS entry.'),
              h('button', { type: 'button', onClick: async () => {
                const value = `${window.location.origin}/${item.path}`;
                try { await navigator.clipboard.writeText(value); } catch (_) {}
              }, style: { marginTop: 8, padding: '6px 0', border: 0, background: 'transparent', color: '#234b68', cursor: 'pointer', fontSize: 12, textDecoration: 'underline', textUnderlineOffset: 2 } }, 'Copy public URL')
            )
          );
        };
        return h('main', { style: { maxWidth: 1180, margin: '0 auto', padding: '28px 24px 44px', color: '#1b2733', fontFamily: 'Inter, system-ui, sans-serif' } },
          h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 } },
            h('div', null, h('h1', { style: { margin: '0 0 5px', fontSize: 28, fontWeight: 700 } }, 'Library'), h('p', { style: { margin: 0, color: '#687887', fontSize: 14 } }, 'Find website files and see where each asset is used.')),
            h('a', { href: '#/assets/-/all', style: { display: 'inline-block', color: '#234b68', textDecoration: 'underline', textUnderlineOffset: 3, fontWeight: 600, fontSize: 13 } }, 'Upload / Manage Assets')
          ),
          h('h2', { style: { margin: '24px 0 12px', fontSize: 17, fontWeight: 700 } }, 'All Assets'),
          h('div', { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 8, marginBottom: 10 } },
            h('strong', { style: { fontSize: 13, fontWeight: 650, marginRight: 3 } }, 'All types:'),
            typeButton('image', 'Images'), typeButton('pdf', 'PDF'), typeButton('video', 'Videos')
          ),
          h('input', { value: query, onChange: event => setQuery(event.target.value), placeholder: 'Search file name, Story title, or Trade Show title', 'aria-label': 'Search Library', style: { width: '100%', maxWidth: 680, boxSizing: 'border-box', padding: '11px 12px', border: '1px solid #ccd5dd', borderRadius: 6, font: 'inherit', margin: '4px 0 16px' } }),
          h('div', { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 8, margin: '0 0 18px' } },
            h('strong', { style: { fontSize: 13, fontWeight: 650, marginRight: 3 } }, 'Used in:'),
            ...useOptions.map(([id, label]) => useButton(id, label))
          ),
          loading ? h('p', { style: { color: '#657381' } }, 'Loading assets and usage references…') : null,
          error ? h('p', { role: 'alert', style: { padding: 14, border: '1px solid #e4b5b5', color: '#8b2424', borderRadius: 6 } }, error) : null,
          !loading && !error ? h('p', { style: { color: '#596775', fontSize: 13, margin: '0 0 14px' } }, `${items.length} assets · ${filtered.length} shown`) : null,
          !loading && !error && filtered.length ? h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 14 } }, ...filtered.map(card)) : null,
          !loading && !error && !filtered.length ? h('p', { style: { padding: 18, border: '1px solid #e4e9ed', borderRadius: 8, color: '#657381' } }, 'No matching assets. Try another search term or filter.') : null
        );
      };
      CMS.registerCustomPage({ id: 'media-library', label: 'Library', icon: 'perm_media', component: MediaLibrary });
      CMS.registerCustomPage({ id: 'content-navigator', label: 'Content Management', icon: 'dashboard', component: ContentManagement });

      // Keep the underlying collection available to dashboard links, but hide the duplicate
      // native “All Resources / Contents” navigation from the everyday editor UI.
      // Sveltia renders parts of its interface in Shadow DOM, so document.querySelectorAll()
      // alone does not reach the navigation elements. Walk open shadow roots as well.
      const normalized = (value) => String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
      const resourceRowPattern = /^(?:全部资源|all resources|全局资源|global resources|内部内容资源（系统）|内部内容资源 \(系统\))(?:\s*\d+)?$/i;
      const nativeContentsLabels = new Set([
        'contents', 'content', 'collections', 'collection', 'entries', 'entry',
        'all resources', '全部资源', 'global resources', '全局资源', '内容集合', '内容列表', '集合', '内容'
      ]);
      const validationLabels = new Set(['validation', 'validate', '验证']);
      const hiddenOnce = new WeakSet();
      const observedRoots = new WeakSet();

      const hideElement = (element) => {
        if (!element || hiddenOnce.has(element)) return;
        hiddenOnce.add(element);
        element.style.setProperty('display', 'none', 'important');
        element.setAttribute('aria-hidden', 'true');
        element.setAttribute('data-def-hidden-native-nav', 'true');
      };

      const hideResourceRow = (element) => {
        let target = element;
        // Prefer hiding the row/link/button, not only the text label.
        if (typeof element.closest === 'function') {
          target = element.closest('a, button, [role="button"], [role="treeitem"], [role="link"], [role="listitem"], li') || element;
        }
        if (!resourceRowPattern.test(normalized(target.innerText || target.textContent))) {
          let parent = target.parentElement;
          for (let step = 0; parent && step < 4; step += 1, parent = parent.parentElement) {
            if (resourceRowPattern.test(normalized(parent.innerText || parent.textContent))) target = parent;
            else break;
          }
        }
        hideElement(target);
      };

      const primaryNavigationRoutes = new Set([
        '#/pages/media-library',
        '#/pages/content-navigator'
      ]);
      const normalizeRoute = (href) => {
        const raw = String(href || '').trim().toLowerCase();
        const marker = raw.indexOf('#/');
        return marker >= 0 ? raw.slice(marker) : raw;
      };
      const navItemSelector = 'a, button, [role="button"], [role="treeitem"], [role="link"], [role="menuitem"], li';
      const navLike = (element) => Boolean(element && element.closest && element.closest('nav,[role="navigation"]'));

      const inspectElement = (element) => {
        if (!element || element.nodeType !== 1) return;
        const attrs = [
          element.getAttribute('aria-label'), element.getAttribute('title'),
          element.getAttribute('data-tooltip'), element.getAttribute('data-testid'),
          element.getAttribute('aria-description')
        ].map(normalized);

        // Keep only the two deliberately designed primary destinations in the native
        // Sveltia navigation. All collection shortcuts and utility pages remain available
        // from the expanded Content Management page, so they should not become extra icons.
        const navCandidate = element.closest ? element.closest(navItemSelector) : null;
        if (navCandidate && navLike(navCandidate)) {
          const route = normalizeRoute(navCandidate.getAttribute('href') || element.getAttribute('href'));
          if (route && (route.startsWith('#/collections/') || route === '#/collections' || route.startsWith('#/workflow') || route.startsWith('#/pages/'))) {
            if (!primaryNavigationRoutes.has(route)) hideElement(navCandidate);
          } else {
            const navLabels = [
              navCandidate.getAttribute('aria-label'), navCandidate.getAttribute('title'),
              navCandidate.getAttribute('data-tooltip'), navCandidate.innerText || navCandidate.textContent,
              ...attrs
            ].map(normalized).filter(Boolean);
            const primaryLabel = navLabels.some((label) => label === 'library' || label === 'content management');
            const knownExtraLabel = navLabels.some((label) =>
              ['stories', 'stories · 已发布', 'trade show', 'trade show articles · 已发布',
               'published stories', 'draft stories', 'published trade show articles',
               'all resources', '全部资源', 'global resources', '全局资源',
               'contents', 'content', 'collections', 'collection', 'entries', 'entry',
               'validation', 'validate', '验证'].includes(label)
            );
            if (!primaryLabel && knownExtraLabel) hideElement(navCandidate);
          }
        }

        const tooltipMatch = attrs.some((label) => nativeContentsLabels.has(label) || validationLabels.has(label));
        if (tooltipMatch && navLike(element)) hideElement(element.closest(navItemSelector) || element);

        const text = normalized(element.innerText || element.textContent);
        if (resourceRowPattern.test(text)) hideResourceRow(element);

        // Hide old direct utility links even when the CMS renders absolute URLs such as
        // /admin/#/pages/stories-published rather than a hash-only href.
        const href = normalizeRoute(element.getAttribute('href'));
        const utilityPage = /^#\/(?:collections(?:$|\/)|workflow(?:$|\/)|pages\/(?!media-library(?:$|\/)|content-navigator(?:$|\/)))/.test(href);
        if (utilityPage && navLike(element)) hideElement(element.closest(navItemSelector) || element);

        if (attrs.some((label) => validationLabels.has(label)) && navLike(element)) hideElement(element.closest(navItemSelector) || element);
      };
      const scanTree = (root) => {
        if (!root) return;
        if (root.nodeType === 1) inspectElement(root);
        const descendants = root.querySelectorAll ? root.querySelectorAll('*') : [];
        descendants.forEach((element) => {
          inspectElement(element);
          if (element.shadowRoot) observeAndScanRoot(element.shadowRoot);
        });
      };

      const observeAndScanRoot = (root) => {
        if (!root || observedRoots.has(root)) return;
        observedRoots.add(root);
        scanTree(root);
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              if (node.nodeType === 1) {
                inspectElement(node);
                scanTree(node);
                if (node.shadowRoot) observeAndScanRoot(node.shadowRoot);
              }
            });
            if (mutation.type === 'attributes' && mutation.target) inspectElement(mutation.target);
          });
        });
        observer.observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ['aria-label', 'title', 'data-tooltip', 'data-testid'] });
      };

      observeAndScanRoot(document);
      // Sveltia may attach a shadow root after a host has been inserted.
      const rootObserver = new MutationObserver(() => {
        if (document.documentElement) observeAndScanRoot(document.documentElement);
        scanTree(document);
      });
      rootObserver.observe(document.documentElement, { childList: true, subtree: true });

      if (!window.location.hash || /^#\/collections\/content-management\/?$/.test(window.location.hash)) window.location.hash = '#/pages/content-navigator';
    })();
  </script>
</body>
</html>
