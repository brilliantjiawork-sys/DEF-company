<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DEF Company 内容管理</title>
  <style>
    :root { color-scheme: light; }
    .def-cms-dashboard { max-width: 980px; margin: 0 auto; padding: 28px 26px 44px; color: #1b2733; font-family: Inter, system-ui, sans-serif; }
    .def-cms-dashboard h1 { margin: 0 0 8px; font-size: 28px; font-weight: 650; }
    .def-cms-dashboard h3 { margin: 22px 0 8px; font-size: 15px; font-weight: 650; }
    .def-cms-dashboard .intro { margin: 0 0 20px; color: #586675; line-height: 1.4; }
    .def-cms-group { border-bottom: 1px solid #dce3e9; padding: 0 0 20px; margin: 0 0 20px; }
    .def-cms-group > h2 { margin: 0 0 10px; padding: 0; font-size: 17px; line-height: 1.4; font-weight: 700; color: #172a3a; }
    .def-cms-items { padding: 0; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
    .def-cms-item { display: flex; align-items: center; gap: 11px; min-height: 50px; padding: 10px 12px; border: 1px solid #e0e7ed; border-radius: 8px; text-decoration: none; color: #1f2d3a; background: #fff; }
    .def-cms-item:hover, .def-cms-item:focus-visible { border-color: #93b7d4; background: #f7fbff; outline: none; }
    .def-cms-item strong { display: block; font-size: 14px; font-weight: 650; }
    .def-cms-icon { display: grid; place-items: center; flex: 0 0 28px; width: 28px; height: 28px; border-radius: 7px; background: #eef4f8; color: #234b68; }
    .def-cms-icon svg { width: 18px; height: 18px; display: block; }
    .def-cms-subgroup { margin: 12px 0; padding: 0 0 4px; }
    .def-cms-subgroup > h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: #43596b; }
    .def-cms-subgroup .def-cms-items { padding-top: 0; }
    .def-cms-group-stacked > .def-cms-items { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
    .def-cms-group-stacked > .def-cms-items > .def-cms-subgroup { width: 100%; box-sizing: border-box; }
    .def-cms-dashboard .def-cms-subgroup + .def-cms-item { margin-top: 8px; }
    .def-cms-section-caption { margin: -3px 0 12px; color: #687887; font-size: 13px; line-height: 1.5; }
    @media (max-width: 720px) { .def-cms-items { grid-template-columns: 1fr; } .def-cms-dashboard { padding: 18px; } }
  </style>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms@0.250.2/dist/sveltia-cms.js"></script>
  <script>
    (() => {
      if (!window.CMS || typeof CMS.registerCustomPage !== 'function' || !CMS.React) return;
      const h = CMS.React.createElement;
      const iconPaths = {
        plus: h('path', { d: 'M12 5v14M5 12h14', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round' }),
        check: h('path', { d: 'm5 12 4 4L19 6', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }),
        draft: h('path', { d: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M8 13h8 M8 17h6', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round' }),
        settings: h('path', { d: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 3.1-.2-.1a1.7 1.7 0 0 0-1.9.2 1.7 1.7 0 0 0-.8 1.5v.3h-3.6v-.3a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.2l-.2.1-1.8-3.1.2-.2a1.7 1.7 0 0 0 .2-1.8A1.7 1.7 0 0 0 5.5 14h-.3v-3.6h.3a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.2-1.8l-.1-.2 3.1-1.8.2.2a1.7 1.7 0 0 0 1.8.2A1.7 1.7 0 0 0 13 4.3V4h3.6v.3a1.7 1.7 0 0 0 1.1 1.6 1.7 1.7 0 0 0 1.8-.2l.2-.1 1.8 3.1-.2.2a1.7 1.7 0 0 0-.2 1.8 1.7 1.7 0 0 0 1.5.8h.3v3.6h-.3a1.7 1.7 0 0 0-1.2.1z', fill: 'none', stroke: 'currentColor', strokeWidth: 1.1, strokeLinejoin: 'round' }),
        image: h('path', { d: 'M4 5h16v14H4z M8 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z M4 16l5-5 4 4 3-3 4 4', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinejoin: 'round' }),
        home: h('path', { d: 'm3 10 9-7 9 7 M5 9v11h14V9 M9 20v-7h6v7', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinejoin: 'round' }),
        social: h('path', { d: 'M7 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M17 14a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M7 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M9.5 6.5l5 3 M9.5 17.5l5-3', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round' }),
        media: h('path', { d: 'M4 4h16v16H4z M8 9h8 M8 13h8 M8 17h5', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round' })
      };
      const icon = (name) => h('span', { className: 'def-cms-icon', 'aria-hidden': 'true' }, h('svg', { viewBox: '0 0 24 24', fill: 'none' }, iconPaths[name] || iconPaths.draft));
      const link = (title, route, iconName = 'draft') => h('a', { className: 'def-cms-item', href: route }, icon(iconName), h('strong', null, title));
      const group = (title, children, caption = '', stacked = false) => h('section', { className: 'def-cms-group' + (stacked ? ' def-cms-group-stacked' : '') },
        h('h2', null, title),
        caption ? h('p', { className: 'def-cms-section-caption' }, caption) : null,
        h('div', { className: 'def-cms-items' }, ...children)
      );
      const subgroup = (title, children, caption = '') => h('div', { className: 'def-cms-subgroup' },
        h('h3', null, title),
        caption ? h('p', { className: 'def-cms-section-caption' }, caption) : null,
        h('div', { className: 'def-cms-items' }, ...children)
      );

      // Every section and sub-entry is visible at once. There are no accordions here,
      // so high-frequency tasks never require an extra click just to reveal links.
      const contentViewFromHash = () => {
        const hash = String(window.location.hash || '');
        if (!hash.includes('/pages/content-navigator')) return 'dashboard';
        const query = hash.includes('?') ? hash.slice(hash.indexOf('?') + 1) : '';
        const params = new URLSearchParams(query);
        const requested = params.get('view') || 'dashboard';
        return new Set(['draft-stories', 'published-stories', 'draft-trade-show-articles', 'published-trade-show-articles']).has(requested) ? requested : 'dashboard';
      };

      const ContentEntryListing = ({ view, onBack }) => {
        const [entries, setEntries] = CMS.React.useState([]);
        const [query, setQuery] = CMS.React.useState('');
        const [loading, setLoading] = CMS.React.useState(true);
        const [error, setError] = CMS.React.useState('');
        const repo = 'brilliantjiawork-sys/DEF-company';
        const config = {
          'draft-stories': { collection: 'stories', folder: 'data/stories', label: 'Draft Stories', mode: 'draft' },
          'published-stories': { collection: 'stories', folder: 'data/stories', label: 'Published Stories', mode: 'published' },
          'draft-trade-show-articles': { collection: 'trade-show-articles', folder: 'data/trade-show-articles', label: 'Draft Trade Show Articles', mode: 'draft' },
          'published-trade-show-articles': { collection: 'trade-show-articles', folder: 'data/trade-show-articles', label: 'Published Trade Show Articles', mode: 'published' }
        }[view];

        CMS.React.useEffect(() => {
          let cancelled = false;
          const api = (path, params = {}) => {
            const url = new URL(`https://api.github.com/repos/${repo}/${path}`);
            Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
            return fetch(url.toString(), { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
          };
          const jsonFromResponse = async response => {
            if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
            return response.json();
          };
          const fallbackTitle = slug => String(slug || 'Untitled').replace(/[-_]+/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
          const entryUrl = slug => `#/collections/${config.collection}/entries/${encodeURIComponent(slug)}`;
          const loadPublished = async () => {
            // Read the site's already-generated Story manifest from the same
            // Cloudflare Pages origin. Browser requests to GitHub's API/raw host
            // were failing in production ("Failed to fetch"), even though deploys
            // had succeeded. The sync-content-index workflow updates this file
            // after a Story is merged into main, then Pages deploys the new version.
            const manifestUrl = new URL('/data/database.json', window.location.origin);
            manifestUrl.searchParams.set('_', String(Date.now()));
            const response = await fetch(manifestUrl.toString(), {
              headers: { 'Cache-Control': 'no-cache' },
              cache: 'no-store'
            });
            if (!response.ok) throw new Error(`Story manifest ${response.status}`);
            const manifest = await response.json();
            const records = (Array.isArray(manifest.articles) ? manifest.articles : [])
              .map(record => {
                const slug = String(record.slug || '').trim();
                if (!slug) return null;
                return {
                  slug,
                  title: record.title || record.name || fallbackTitle(slug),
                  date: record.date || record.publish_date || record.published_date || '',
                  category: record.category || '',
                  status: 'Published',
                  url: entryUrl(slug)
                };
              })
              .filter(Boolean);
            const unique = new Map(records.map(record => [record.slug, record]));
            return [...unique.values()].sort((a, b) =>
              String(b.date).localeCompare(String(a.date)) || a.title.localeCompare(b.title)
            );
          };
          const loadDrafts = async () => {
            const response = await api('pulls', { state: 'open', per_page: '100', sort: 'updated', direction: 'desc' });
            const pulls = await jsonFromResponse(response);
            const prefix = `cms/${config.collection}/`;
            const related = (Array.isArray(pulls) ? pulls : []).filter(pr => String(pr.head?.ref || '').startsWith(prefix));
            const records = await Promise.all(related.map(async pr => {
              const slug = String(pr.head.ref).slice(prefix.length).replace(/\/$/, '');
              let title = pr.title || fallbackTitle(slug);
              let date = '';
              let category = '';
              try {
                const branchResponse = await api(`contents/${config.folder}/${encodeURIComponent(slug)}.json`, { ref: pr.head.ref });
                if (branchResponse.ok) {
                  const file = await branchResponse.json();
                  const bytes = Uint8Array.from(atob(String(file.content || '').replace(/\s/g, '')), char => char.charCodeAt(0));
                  const data = JSON.parse(new TextDecoder('utf-8').decode(bytes));
                  title = data.title || title;
                  date = data.date || data.publish_date || '';
                  category = data.category || '';
                }
              } catch (_) { /* Keep the pull-request title when branch content cannot be read. */ }
              const labels = (pr.labels || []).map(label => label.name).filter(Boolean);
              return { slug, title, date, category, status: labels.find(label => label.startsWith('sveltia-cms/'))?.replace('sveltia-cms/', '') || 'Draft', prNumber: pr.number, url: entryUrl(slug), updatedAt: pr.updated_at || '' };
            }));
            return records.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)) || a.title.localeCompare(b.title));
          };
          (async () => {
            setLoading(true); setError(''); setEntries([]);
            try {
              const data = config.mode === 'published' ? await loadPublished() : await loadDrafts();
              if (!cancelled) setEntries(data);
            } catch (err) {
              if (!cancelled) setError(`无法读取${config.label}。请确认 GitHub 仓库公开可读、API 限额未用尽，然后重试。(${err?.message || 'Unknown error'})`);
            } finally { if (!cancelled) setLoading(false); }
          })();
          return () => { cancelled = true; };
        }, [view]);

        const normalizedQuery = query.trim().toLowerCase();
        const shown = entries.filter(entry => [entry.title, entry.date, entry.category, entry.slug, entry.status].join(' ').toLowerCase().includes(normalizedQuery));
        const smallText = { color: '#657381', fontSize: 12, lineHeight: 1.5 };
        return h('div', { className: 'def-cms-dashboard' },
          h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap', marginBottom: 14 } },
            h('div', null, h('h1', null, config.label), h('p', { className: 'intro', style: { marginBottom: 0 } }, config.mode === 'published' ? 'Only entries already merged into main are listed here. This page does not create new content.' : 'Only unpublished entries from this content type are listed here. Select an entry to continue editing it.')),
            h('a', { href: '#/pages/content-navigator', onClick: onBack, style: { color: '#234b68', textDecoration: 'underline', textUnderlineOffset: 3, fontSize: 13, fontWeight: 600, whiteSpace: 'nowrap' } }, '← Content Management')
          ),
          h('input', { value: query, onChange: event => setQuery(event.target.value), placeholder: 'Search title, date, category…', 'aria-label': `Search ${config.label}`, style: { width: '100%', maxWidth: 620, boxSizing: 'border-box', padding: '10px 12px', border: '1px solid #ccd5dd', borderRadius: 7, font: 'inherit', margin: '0 0 16px' } }),
          loading ? h('p', { style: smallText }, 'Loading entries…') : null,
          error ? h('div', { role: 'alert', style: { border: '1px solid #e5c7c7', background: '#fffafa', padding: 14, borderRadius: 8, color: '#8a3434', lineHeight: 1.5 } }, error,
            h('div', { style: { marginTop: 10 } }, h('a', { href: config.mode === 'draft' ? '#/workflow' : `#/collections/${config.collection}`, style: { color: '#234b68', textDecoration: 'underline' } }, config.mode === 'draft' ? 'Open native Editorial Workflow' : 'Open native collection list'))) : null,
          !loading && !error ? h('p', { style: { ...smallText, margin: '0 0 10px' } }, `${shown.length} entries`) : null,
          !loading && !error && shown.length ? h('div', { style: { border: '1px solid #dce3e9', borderRadius: 8, overflow: 'hidden', background: '#fff' } },
            ...shown.map(entry => h('div', { key: entry.slug, style: { display: 'flex', alignItems: 'center', gap: 12, justifyContent: 'space-between', padding: '14px 16px', borderBottom: '1px solid #edf0f2', flexWrap: 'wrap' } },
              h('div', { style: { minWidth: 0, flex: '1 1 280px' } },
                h('strong', { style: { display: 'block', color: '#1d2d3b', fontSize: 14, lineHeight: 1.45, overflowWrap: 'anywhere' } }, entry.title),
                h('div', { style: { ...smallText, marginTop: 4 } }, [entry.date, entry.category, entry.status].filter(Boolean).join(' · ')),
                entry.prNumber ? h('div', { style: { ...smallText, marginTop: 2 } }, `Draft PR #${entry.prNumber}`) : null
              ),
              h('a', { href: entry.url, style: { color: '#234b68', fontSize: 13, fontWeight: 650, textDecoration: 'underline', textUnderlineOffset: 3, whiteSpace: 'nowrap' } }, 'Edit entry →')
            ))
          ) : null,
          !loading && !error && !shown.length ? h('div', { style: { border: '1px solid #e0e7ed', background: '#fff', padding: 18, borderRadius: 8, color: '#657381', lineHeight: 1.5 } }, config.mode === 'draft' ? `No unpublished ${config.collection === 'stories' ? 'Stories' : 'Trade Show Articles'} found.` : `No published ${config.collection === 'stories' ? 'Stories' : 'Trade Show Articles'} found.`) : null
        );
      };

      const ContentManagement = () => {
        const [view, setView] = CMS.React.useState(contentViewFromHash);
        CMS.React.useEffect(() => {
          const onHashChange = () => setView(contentViewFromHash());
          window.addEventListener('hashchange', onHashChange);
          return () => window.removeEventListener('hashchange', onHashChange);
        }, []);
        const openView = viewName => () => setView(viewName);
        if (view !== 'dashboard') return h(ContentEntryListing, { key: view, view, onBack: openView('dashboard') });
        return h('div', { className: 'def-cms-dashboard' },
          h('h1', null, 'Content Management'),
          h('p', { className: 'intro' }, 'Edit website content and publishing settings. Assets are managed separately in Library.'),
          group('Stories', [
            link('New Story', '#/collections/stories/new', 'plus'),
            link('Draft Stories', '#/pages/content-navigator?view=draft-stories', 'draft'),
            link('Published Stories', '#/pages/content-navigator?view=published-stories', 'check'),
            link('Stories Page Settings', '#/collections/content-management/entries/stories_page_settings', 'settings')
          ]),
          group('Trade Shows', [
            link('Upcoming Shows', '#/collections/content-management/entries/upcoming_shows', 'plus'),
            subgroup('Trade Show Articles', [
              link('New Trade Show Article', '#/collections/trade-show-articles/new', 'plus'),
              link('Draft Trade Show Articles', '#/pages/content-navigator?view=draft-trade-show-articles', 'draft'),
              link('Published Trade Show Articles', '#/pages/content-navigator?view=published-trade-show-articles', 'check'),
              link('Trade Shows Page Settings', '#/collections/content-management/entries/events_page_settings', 'settings')
            ])
          ], '', true),
          group('Social Media', [
            link('Social Media Page Content', '#/collections/content-management/entries/social_page', 'social'),
            link('Social Channel Cards', '#/collections/content-management/entries/social_media', 'image')
          ]),
          group('Media', [
            link('Media Page Content', '#/collections/content-management/entries/media_page', 'media'),
            link('Media Contacts', '#/collections/content-management/entries/media_contacts', 'plus')
          ]),
          group('Website Basics', [
            link('Brand Introduction', '#/collections/content-management/entries/home_intro', 'home'),
            link('Newsletter', '#/collections/content-management/entries/home_newsletter', 'plus')
          ])
        );
      };

      // Only Library and Content Management are registered as custom pages.
      // Article management shortcuts live inside Content Management, not as toolbar icons.



      // Brand Hub is a standalone reference area. It is intentionally separate
      // from Library: guidelines define the rules; Library stores the files.
      const BrandHub = () => {
        const [active, setActive] = CMS.React.useState('overview');
        const [guide, setGuide] = CMS.React.useState(null);
        const [loadingGuide, setLoadingGuide] = CMS.React.useState(true);
        const [guideError, setGuideError] = CMS.React.useState('');
        CMS.React.useEffect(() => {
          let cancelled = false;
          fetch('/data/brand-guidelines.json?_=' + Date.now(), { cache: 'no-store' })
            .then(response => { if (!response.ok) throw new Error('Brand guide ' + response.status); return response.json(); })
            .then(data => { if (!cancelled) setGuide(data); })
            .catch(error => { if (!cancelled) setGuideError(error.message || 'Unable to load brand guide.'); })
            .finally(() => { if (!cancelled) setLoadingGuide(false); });
          return () => { cancelled = true; };
        }, []);
        const data = guide || {};
        const colors = Array.isArray(data.colors) ? data.colors : [];
        const types = Array.isArray(data.type_styles) ? data.type_styles : [];
        const imageRules = Array.isArray(data.imagery_categories) ? data.imagery_categories : [];
        const layouts = Array.isArray(data.layout_patterns) ? data.layout_patterns : [];
        const applications = Array.isArray(data.applications) ? data.applications : [];
        const logoDos = Array.isArray(data.logo_dos) ? data.logo_dos : [];
        const logoDonts = Array.isArray(data.logo_donts) ? data.logo_donts : [];
        const nav = [
          ['overview','Brand Foundation','品牌基础'],
          ['logo','Logo System','标志系统'],
          ['color','Color System','色彩系统'],
          ['type','Typography','字体与排版'],
          ['imagery','Imagery','图片语言'],
          ['graphic','Graphic Elements','图形元素'],
          ['layout','Layout System','版式系统'],
          ['voice','Verbal Identity','语言规范'],
          ['applications','Applications','品牌应用']
        ];
        const panel = { background:'#fff', border:'1px solid #e1e7ec', borderRadius:12, padding:18, minWidth:0 };
        const muted = { color:'#667789', fontSize:13, lineHeight:1.65 };
        const heading = { margin:'0 0 8px', color:'#172a3a', fontSize:17, fontWeight:700 };
        const smallLabel = { color:'#6a7b89', fontSize:11, letterSpacing:'.06em', textTransform:'uppercase', fontWeight:700 };
        const pill = text => h('span',{style:{display:'inline-block',padding:'4px 8px',borderRadius:99,background:'#edf4f8',color:'#31536c',fontSize:11,fontWeight:650,margin:'0 6px 6px 0'}},text);
        const bullets = (items) => h('ul',{style:{margin:'8px 0 0',paddingLeft:19,color:'#405365',fontSize:13,lineHeight:1.8}},...(items||[]).map((item,i)=>h('li',{key:i},item)));
        const info = (label,value) => h('div',{style:{marginBottom:14}},h('div',{style:smallLabel},label),h('div',{style:{color:'#263747',fontSize:14,lineHeight:1.65,marginTop:4}},value||'To be defined'));
        const card = (title,desc,children) => h('section',{style:panel},h('h2',{style:heading},title),desc?h('p',{style:{...muted,margin:'0 0 12px'}},desc):null,children);
        const swatch = item => h('div',{key:item.name,style:{border:'1px solid #e2e8ed',borderRadius:9,overflow:'hidden',background:'#fff'}},
          h('div',{style:{height:62,background:item.hex||'#ddd',borderBottom:'1px solid rgba(0,0,0,.06)'}}),
          h('div',{style:{padding:10}},h('strong',{style:{display:'block',fontSize:13,color:'#263747'}},item.name),
            h('div',{style:{fontSize:12,color:'#667789',marginTop:3}},item.hex),
            h('div',{style:{fontSize:11,color:'#667789',marginTop:4,lineHeight:1.4}},item.role||item.group||'')));
        const renderContent = () => {
          if (active === 'overview') return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14}},
            card('Brand Definition','品牌定位是后续内容和视觉决策的依据。',
              h('div',null,info('Positioning',data.positioning),info('Primary audience',data.audience),info('Brand attributes',data.attributes),info('Brand promise',data.promise))),
            card('How to use this hub','每次开始制作内容前，先确认对应的品牌规则。',
              h('ol',{style:{margin:0,paddingLeft:19,color:'#405365',fontSize:13,lineHeight:1.9}},
                h('li',null,'先确认内容目标、受众和传播场景。'),
                h('li',null,'查看 Logo、色彩、字体、图片和版式规则。'),
                h('li',null,'从 Library 选择已存在的品牌素材。'),
                h('li',null,'按对应应用模板制作并检查一致性。'))),
            card('Brand status','当前是 DEF 作品集品牌的第一版工作规范，后续会根据 Figma 实操逐步确认。',
              h('div',null,pill('Working draft'),h('p',{style:muted},'颜色、字体和版式规则是初始建议，不应被当作已经完成的专业品牌定稿。请在 Figma 中验证并迭代。'))));
          if (active === 'logo') return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14}},
            card('Primary logo','当前网站页头使用的组合式标志。',h('div',null,
              h('img',{src:'/images/logo.jpg',alt:'DEF Company current logo artwork',style:{width:'100%',maxHeight:150,objectFit:'contain',background:'#f6f8fa',borderRadius:8}}),
              info('Current source','images/logo.jpg'),

              h('div',null,info('Horizontal lockup','图形在左、字标在右。适合网站页头和横向版面。'),info('Stacked lockup','图形在上、字标在下。仅在确有竖向空间需求时制作。'),info('Symbol only','只使用图形标志。需先确认图形脱离字标后仍清晰、可识别。'))),
            card('Figma practice','用 Frame 练习不同组合，不要拉伸原始 Logo。',bullets(['将原始 Logo 放入一个 Frame，锁定长宽比。','复制 Frame，尝试左右排列与上下排列。','将图形单独放入 Frame，检查小尺寸识别度。','用浅色和深色背景分别测试对比度。','用矩形画出保护区，确保其他元素不进入。'])),
            card('Clear space & misuse','最小尺寸和安全空间必须从实际 Logo 比例推导，暂不凭空写固定毫米数。',h('div',null,info('Clear space','Logo 四周保留空白。可在 Figma 中用外层 Frame 和 Layout Grid 表示。'),info('Minimum size','逐步缩小 Logo，找到文字仍清晰、图形仍可辨认的尺寸，再记录数字。'),h('div',{style:smallLabel},'Do not'),bullets(logoDonts.length?logoDonts:['不要拉伸或压扁。','不要随意改变图形与字标的相对位置。','不要擅自改色、旋转或添加效果。']))));
          if (active === 'color') {

                }))),
              card('Color usage rules','在 Figma 中建议将确认后的颜色保存为 Color Styles 或 Variables，设计时直接调用。',
                bullets(['Primary：建立品牌识别，常用于品牌核心视觉。','Secondary：辅助主色，区分模块和信息层级。','Neutral：背景、正文、边框和留白。','Accent：突出重点、CTA 或关键信息，少量使用。','Functional：成功、警告、错误等状态反馈，不作为装饰色。'])));
          }
          if (active === 'type') return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14}},
            card('Typeface','字体家族可以是一种，也可以是主字体加备用字体。不要假设所有品牌只能使用一种。',
              h('div',null,info('Primary family',data.typography_family),info('Fallback',data.typography_fallback),info('Figma practice','创建 Text Styles：H1、H2、H3、Body、Caption、CTA。统一字体、字号、字重、行高。'))),
            card('Type scale','字体层级决定信息的重要程度。',h('div',null,...types.map((item,i)=>h('div',{key:i,style:{padding:'12px 0',borderBottom:'1px solid #edf0f2'}},
              h('div',{style:smallLabel},item.name+' · '+(item.weight||'')),
              h('div',{style:{fontSize:Math.min(Number(item.size)||16,32),fontWeight:item.weight||500,color:'#1b2d3d',lineHeight:1.35}},item.sample||item.name),
              h('div',{style:muted},(item.size||'')+' px · '+(item.usage||''))))));
          if (active === 'imagery') return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:14}},
            ...imageRules.map((item,i)=>card(item.name,item.description,h('div',null,info('Use for',item.use),info('Selection rules',item.rules),info('Avoid',item.avoid)))));
          if (active === 'graphic') return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14}},
            card('Graphic elements','Logo 之外的辅助视觉元素，用来形成统一的设计语言。',h('div',null,info('Icon style',data.icon_style),info('Shapes & lines',data.graphic_elements),info('Grid & spacing',data.grid_spacing))),
            card('Figma practice','在 Figma 中建立可复用组件。',bullets(['建立统一的图标尺寸和线宽。','建立常用间距值，例如 8 / 16 / 24 / 32。','用 Auto Layout 保持图标、标题和正文的间距一致。','不要为每一张图临时创造新的装饰元素。'])));
          if (active === 'layout') return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:14}},
            ...layouts.map((item,i)=>card(item.name,item.description,h('div',null,info('Structure',item.structure),info('Best for',item.use),info('Figma setup',item.figma)))));
          if (active === 'voice') return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14}},
            card('Brand voice','品牌长期稳定的表达性格。',h('div',null,info('Voice attributes',data.voice_attributes),info('Writing principles',data.writing_principles),info('Terminology',data.terminology))),
            card('Tone by context','不同内容场景可以调整语气，但不能偏离品牌性格。',h('div',null,...(data.tone_examples||[]).map((item,i)=>h('div',{key:i,style:{padding:'10px 0',borderBottom:'1px solid #edf0f2'}},h('strong',{style:{fontSize:13}},item.context),h('p',{style:{...muted,margin:'4px 0 0'}},item.tone))))));
          if (active === 'applications') return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:14}},
            ...applications.map((item,i)=>card(item.name,item.description,h('div',null,info('Information hierarchy',item.hierarchy),info('Key components',item.components),info('Template rule',item.template)))));
          return null;
        };
        return h('main',{style:{maxWidth:1240,margin:'0 auto',padding:'26px 24px 44px',fontFamily:'Inter,system-ui,sans-serif',color:'#1b2733'}},
          h('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:16,flexWrap:'wrap',marginBottom:18}},
            h('div',null,h('div',{style:{fontSize:11,letterSpacing:'.12em',fontWeight:750,color:'#39718f',marginBottom:8}},'DEF COMPANY · BRAND STANDARDS'),
              h('h1',{style:{fontSize:29,margin:'0 0 6px',fontWeight:750}},'Brand Hub'),
              h('p',{style:{margin:0,color:'#657789',fontSize:14,lineHeight:1.6}},'The reference point for every brand communication and content asset.')),
            h('a',{href:'#/collections/content-management/entries/brand_guidelines',style:{padding:'10px 13px',border:'1px solid #cbd7df',borderRadius:8,color:'#234b68',fontWeight:650,fontSize:13,textDecoration:'none',background:'#fff'}},'Edit Brand Guidelines ↗')),
          loadingGuide?h('p',{style:muted},'Loading brand guidelines…'):null,
          guideError?h('p',{role:'alert',style:{...muted,color:'#9a3434'}},'Brand guide could not be loaded: '+guideError):null,
          h('div',{style:{display:'flex',gap:7,overflowX:'auto',padding:'4px 0 13px',marginBottom:16,borderBottom:'1px solid #e1e7ec'}},
            ...nav.map(([id,label,zh])=>h('button',{key:id,type:'button',onClick:()=>setActive(id),style:{flex:'0 0 auto',padding:'9px 12px',border:active===id?'1px solid #8fb4c9':'1px solid transparent',borderRadius:8,background:active===id?'#edf5f9':'transparent',color:active===id?'#1f4c68':'#526474',fontWeight:active===id?700:550,cursor:'pointer',fontSize:12}},label))),
          h('div',{style:{fontSize:11,color:'#788895',marginBottom:12}},nav.find(item=>item[0]===active)?.[2]||''),
          renderContent()
        );
      };

      // Library indexes assets already in the public repository and relates them back
      // to the CMS records that reference them. Uploading/replacing files remains in
      // Sveltia's native Asset Library, reached from the action at the top of this page.
      const MediaLibrary = () => {
        const [items, setItems] = CMS.React.useState([]);
        const [query, setQuery] = CMS.React.useState('');
        const [typeFilter, setTypeFilter] = CMS.React.useState('all');
        const [useFilter, setUseFilter] = CMS.React.useState('all');
        const [loading, setLoading] = CMS.React.useState(true);
        const [error, setError] = CMS.React.useState('');
        const repo = 'brilliantjiawork-sys/DEF-company';
        const branch = 'main';
        const pdfExt = /\.pdf$/i;
        const videoExt = /\.(?:mp4|webm|mov|m4v|ogv|avi|mkv)$/i;
        const assetExt = /\.(?:png|jpe?g|webp|gif|svg|avif|pdf|mp4|webm|mov|m4v|ogv|avi|mkv)$/i;
        const assetRoots = ['images/', 'videos/', 'pdf/', 'documents/', 'downloads/', 'whitepapers/', 'catalogs/', 'assets/'];
        const staticData = [
          ['data/events.json', 'shows'],
          ['data/social-media.json', 'socialMedia'],
          ['data/newsroom-social-media.json', 'socialPage'],
          ['data/media-contacts.json', 'mediaContacts'],
          ['data/newsroom-media.json', 'mediaPage'],
          ['data/site-content.json', 'website'],
          ['data/home-intro.json', 'website'],
          ['data/home-newsletter.json', 'website'],
          ['data/stories-page-settings.json', 'website'],
          ['data/trade-shows-page-settings.json', 'website'],
          ['data/brand-guidelines.json', 'brandIdentity'],
          ['data/contact-content.json', 'website'],
          ['data/cookie-content.json', 'website']
        ];
        const cleanPath = value => {
          let result = String(value || '').split(/[?#]/)[0].trim().replace(/\\/g, '/').replace(/^\.\//, '').replace(/^\/+/, '');
          try { result = decodeURIComponent(result); } catch (_) {}
          return result;
        };
        const baseName = value => cleanPath(value).split('/').pop().toLowerCase();
        const getType = path => pdfExt.test(path) ? 'pdf' : videoExt.test(path) ? 'video' : 'image';
        const typeLabel = type => type === 'pdf' ? 'PDF' : type === 'video' ? 'Video' : 'Image';
        const categoryForKind = kind => ({
          stories: 'Stories', tradeArticles: 'Trade Shows', shows: 'Trade Shows',
          socialMedia: 'Website & Shared', socialPage: 'Website & Shared',
          mediaContacts: 'Website & Shared', mediaPage: 'Website & Shared', website: 'Website & Shared', brandIdentity: 'Brand Identity'
        }[kind] || 'Website & Brand');
        const titleForRecord = (record, fallback, kind) => String((kind === 'mediaContacts' ? record?.name : '') || record?.title || record?.name || record?.platform || record?.full_name || record?.contact_name || record?.page_title || fallback || 'Untitled').trim();
        const collectRefs = (value, fieldPath = '', out = []) => {
          if (typeof value === 'string') {
            const matches = value.match(/(?:\/?[A-Za-z0-9_ .@()/-]+\.(?:png|jpe?g|webp|gif|svg|avif|pdf|mp4|webm|mov|m4v|ogv|avi|mkv))(?:[?#][^\s"'<>]*)?/gi) || [];
            matches.forEach((match, index) => out.push({ path: cleanPath(match), field: fieldPath, occurrence: index + 1 }));
          } else if (Array.isArray(value)) {
            value.forEach((item, index) => collectRefs(item, fieldPath ? `${fieldPath}[${index}]` : `[${index}]`, out));
          } else if (value && typeof value === 'object') {
            Object.entries(value).forEach(([key, item]) => collectRefs(item, fieldPath ? `${fieldPath}.${key}` : key, out));
          }
          return out;
        };
        const fieldLocationFor = (field, occurrence = 1, kind = '') => {
          const raw = String(field || '').trim();
          const normalizedField = raw.toLowerCase();
          if (!raw) return 'Page content';
          if (/gallery/.test(normalizedField)) {
            const item = raw.match(/\[(\d+)\]/);
            return 'Gallery image ' + (item ? Number(item[1]) + 1 : occurrence);
          }
          if (/cover/.test(normalizedField) || ((kind === 'stories' || kind === 'tradeArticles') && /^(?:image|thumbnail)$/i.test(raw))) return 'Cover image';
          if (/hero/.test(normalizedField)) return 'Hero image';
          if (/avatar|photo|portrait/.test(normalizedField)) return 'Contact photo';
          if (/logo/.test(normalizedField)) return 'Logo';
          if (/^(?:body|content|markdown)$/i.test(raw)) return 'Article body · image ' + occurrence;
          return raw
            .replace(/\[(\d+)\]/g, (_, index) => 'item ' + (Number(index) + 1))
            .replace(/\./g, ' › ')
            .replace(/_/g, ' ')
            .replace(/^./, char => char.toUpperCase());
        };
        const getEditUrl = (kind, slug = '') => {
          const encoded = encodeURIComponent(slug);
          if (kind === 'stories' && slug) return `#/collections/stories/entries/${encoded}`;
          if (kind === 'tradeArticles' && slug) return `#/collections/trade-show-articles/entries/${encoded}`;
          if (kind === 'shows') return '#/collections/content-management/entries/upcoming_shows';
          if (kind === 'socialMedia') return '#/collections/content-management/entries/social_media';
          if (kind === 'socialPage') return '#/collections/content-management/entries/social_page';
          if (kind === 'mediaContacts' || kind === 'mediaPage') return `#/collections/content-management/entries/${kind === 'mediaContacts' ? 'media_contacts' : 'media_page'}`;
          if (kind === 'website') {
            if (slug === 'home-intro') return '#/collections/content-management/entries/home_intro';
            if (slug === 'home-newsletter') return '#/collections/content-management/entries/home_newsletter';
            if (slug === 'stories-page-settings') return '#/collections/content-management/entries/stories_page_settings';
            if (slug === 'trade-shows-page-settings') return '#/collections/content-management/entries/events_page_settings';
            if (slug === 'brand-guidelines') return '#/collections/content-management/entries/brand_guidelines';
          }
          return '';
        };
        const recordsFrom = (data, kind, path, explicitSlug = '') => {
          if (!data) return [];
          const toRecord = (record, slug, fallback) => ({
            record, kind, source: path, slug: slug || String(record?.slug || ''),
            title: titleForRecord(record, fallback, kind), category: categoryForKind(kind),
            editUrl: getEditUrl(kind, slug || String(record?.slug || ''), path)
          });
          if (kind === 'stories' && Array.isArray(data.articles)) return data.articles.map(record => toRecord(record, String(record.slug || ''), 'Story'));
          if (kind === 'tradeArticles' && Array.isArray(data.articles)) return data.articles.map(record => toRecord(record, String(record.slug || ''), 'Trade Show Article'));
          if (kind === 'shows' && Array.isArray(data.exhibitions)) return data.exhibitions.map((record, i) => toRecord(record, '', `Trade Show ${i + 1}`));
          if (kind === 'socialMedia' && Array.isArray(data.channels)) return data.channels.map((record, i) => toRecord(record, '', `Social Channel ${i + 1}`));
          if (kind === 'mediaContacts' && Array.isArray(data.contacts)) return data.contacts.map((record, i) => toRecord(record, '', `Media Contact ${i + 1}`));
          if (Array.isArray(data)) return data.map((record, i) => toRecord(record, '', `${kind} ${i + 1}`));
          return [toRecord(data, explicitSlug, path.split('/').pop().replace(/\.json$/i, ''))];
        };

        CMS.React.useEffect(() => {
          let cancelled = false;
          const fetchIndex = async () => {
            try {
              const response = await fetch(`https://data.jsdelivr.com/v1/package/gh/${repo}@${branch}/flat`, { cache: 'no-store' });
              if (!response.ok) throw new Error(`CDN ${response.status}`);
              const data = await response.json();
              return (data.files || []).map(file => ({ path: cleanPath(file.name), size: file.size || 0, url: `https://cdn.jsdelivr.net/gh/${repo}@${branch}/${cleanPath(file.name)}` }));
            } catch (cdnError) {
              const response = await fetch(`https://api.github.com/repos/${repo}/git/trees/${branch}?recursive=1`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
              if (!response.ok) throw new Error(`素材索引暂时不可用（GitHub ${response.status}）。请刷新后重试。`);
              const data = await response.json();
              if (data.truncated) throw new Error('仓库文件列表超过单次索引范围，无法保证素材完整。');
              return (data.tree || []).filter(file => file.type === 'blob').map(file => ({ path: cleanPath(file.path), size: file.size || 0, url: `https://raw.githubusercontent.com/${repo}/${branch}/${cleanPath(file.path)}` }));
            }
          };
          const fetchJson = async path => {
            try {
              const response = await fetch(`https://raw.githubusercontent.com/${repo}/${branch}/${path}`, { cache: 'no-store' });
              if (!response.ok) return null;
              return await response.json();
            } catch (_) { return null; }
          };
          const load = async () => {
            try {
              const repoFiles = await fetchIndex();
              const assets = repoFiles.filter(file => assetRoots.some(root => file.path.startsWith(root)) && assetExt.test(file.path))
                .map(file => ({ ...file, name: file.path.split('/').pop(), type: getType(file.path), usages: [], categories: [] }));
              const hasStoryFiles = repoFiles.some(file => /^data\/stories\/[^/]+\.json$/i.test(file.path));
              const hasTradeArticleFiles = repoFiles.some(file => /^data\/trade-show-articles\/[^/]+\.json$/i.test(file.path));
              const contentSources = [];
              if (hasStoryFiles) {
                repoFiles.filter(file => /^data\/stories\/[^/]+\.json$/i.test(file.path)).forEach(file => contentSources.push({ path: file.path, kind: 'stories', slug: file.path.split('/').pop().replace(/\.json$/i, '') }));
              } else contentSources.push({ path: 'data/database.json', kind: 'stories-index' });
              if (hasTradeArticleFiles) {
                repoFiles.filter(file => /^data\/trade-show-articles\/[^/]+\.json$/i.test(file.path)).forEach(file => contentSources.push({ path: file.path, kind: 'tradeArticles', slug: file.path.split('/').pop().replace(/\.json$/i, '') }));
              } else contentSources.push({ path: 'data/event-coverage.json', kind: 'tradeArticles-index' });
              staticData.forEach(([path, kind]) => contentSources.push({ path, kind, slug: path.split('/').pop().replace(/\.json$/i, '') }));
              const loadedSources = await Promise.all(contentSources.map(async source => ({ ...source, data: await fetchJson(source.path) })));
              const records = [];
              loadedSources.forEach(source => {
                if (!source.data) return;
                let kind = source.kind;
                if (kind === 'stories-index') kind = 'stories';
                if (kind === 'tradeArticles-index') kind = 'tradeArticles';
                if (source.path === 'data/social-media.json') kind = 'socialMedia';
                records.push(...recordsFrom(source.data, kind, source.path, source.slug));
                // Add the real per-file slug to folder-based content so the edit link points at the exact entry.
                if ((kind === 'stories' || kind === 'tradeArticles') && source.path.match(/^data\/(?:stories|trade-show-articles)\/[^/]+\.json$/i) && records.length) {
                  const last = records[records.length - 1];
                  last.slug = source.slug;
                  last.editUrl = getEditUrl(kind, source.slug);
                }
              });

              const usageByExactPath = new Map();
              const usageByBasename = new Map();
              records.forEach(entry => {
                collectRefs(entry.record).forEach(ref => {
                  const refPath = cleanPath(ref.path);
                  const base = baseName(refPath);
                  const fieldLower = ref.field.toLowerCase();
                  const storyCoverField = (entry.kind === 'stories' || entry.kind === 'tradeArticles') && /^(?:image|thumbnail)$/i.test(ref.field);
                  let usageLabel = /gallery/.test(fieldLower) ? 'Gallery Image' : /avatar|photo|portrait/.test(fieldLower) ? 'Contact Photo' : (/cover/.test(fieldLower) || storyCoverField) ? 'Cover Image' : /body|content|markdown/.test(fieldLower) ? 'Body Image' : /video/.test(fieldLower) ? 'Video' : /pdf|whitepaper|catalog|brochure|document|file/.test(fieldLower) ? 'PDF File' : /logo/.test(fieldLower) ? 'Brand Logo' : /hero/.test(fieldLower) ? 'Homepage Hero Image' : /image|thumbnail|media|asset/.test(fieldLower) ? 'Image' : 'Page Asset';
                  const usage = {
                    category: entry.category, title: entry.title, kind: entry.kind, source: entry.source,
                    label: usageLabel, location: fieldLocationFor(ref.field, ref.occurrence, entry.kind), editUrl: entry.editUrl,
                    topics: Array.isArray(entry.record?.tags) ? entry.record.tags : [],
                    industries: Array.isArray(entry.record?.industries) ? entry.record.industries : []
                  };
                  const keys = new Set([refPath]);
                  if (refPath.startsWith('images/')) keys.add(refPath.slice('images/'.length));
                  if (refPath.startsWith('/')) keys.add(refPath.slice(1));
                  keys.forEach(key => {
                    if (!usageByExactPath.has(key)) usageByExactPath.set(key, []);
                    usageByExactPath.get(key).push(usage);
                  });
                  if (!usageByBasename.has(base)) usageByBasename.set(base, []);
                  usageByBasename.get(base).push(usage);
                });
              });
              const mapped = assets.map(asset => {
                const exactCandidates = [asset.path, asset.path.startsWith('images/') ? asset.path.slice('images/'.length) : asset.path];
                let usages = [];
                exactCandidates.some(key => {
                  if (usageByExactPath.has(key)) { usages = usageByExactPath.get(key); return true; }
                  return false;
                });
                if (!usages.length) {
                  const byBase = usageByBasename.get(asset.name.toLowerCase()) || [];
                  // Only use filename fallback if the repository contains a single asset with that name.
                  const duplicatePathCount = assets.filter(other => other.name.toLowerCase() === asset.name.toLowerCase()).length;
                  if (duplicatePathCount === 1) usages = byBase;
                }
                const unique = [];
                const seen = new Set();
                usages.forEach(usage => {
                  const key = [usage.category, usage.title, usage.source, usage.label, usage.location].join('|');
                  if (!seen.has(key)) { seen.add(key); unique.push(usage); }
                });
                const categories = [...new Set(unique.map(usage => usage.category))];
                return { ...asset, usages: unique, categories, category: categories[0] || 'unused' };
              });
              if (!cancelled) { setItems(mapped.sort((a, b) => a.name.localeCompare(b.name))); setError(''); }
            } catch (err) {
              if (!cancelled) setError(err?.message || '读取素材失败。');
            } finally { if (!cancelled) setLoading(false); }
          };
          load();
          return () => { cancelled = true; };
        }, []);

        const useOptions = [
          ['all', 'All files'], ['Brand Identity', 'Brand Identity'], ['Stories', 'Stories'], ['Trade Shows', 'Trade Shows'], ['Website & Shared', 'Website & Shared'], ['unused', 'Not currently used']
        ];
        const filtered = items.filter(item => {
          if (typeFilter !== 'all' && item.type !== typeFilter) return false;
          if (useFilter === 'unused' && item.usages.length) return false;
          if (useFilter !== 'all' && useFilter !== 'unused' && !(item.categories || []).includes(useFilter)) return false;
          const searchText = [item.name, item.path, ...(item.categories || []), ...item.usages.flatMap(usage => [usage.title, usage.label, usage.category, ...(usage.topics || []), ...(usage.industries || [])])].join(' ').toLowerCase();
          return !query.trim() || searchText.includes(query.trim().toLowerCase());
        });
        const textFilterStyle = active => ({
          border: 0, borderBottom: active ? '2px solid #234b68' : '2px solid transparent',
          borderRadius: 0, padding: '5px 4px 6px', background: 'transparent', color: active ? '#1b3448' : '#526474',
          fontWeight: active ? 700 : 500, cursor: 'pointer', font: 'inherit', fontSize: 13
        });
        const typeButton = (id, label) => h('button', { type: 'button', key: id, 'aria-pressed': String(typeFilter === id), onClick: () => setTypeFilter(typeFilter === id ? 'all' : id), style: textFilterStyle(typeFilter === id) }, label);
        const useButton = (id, label) => h('button', { type: 'button', key: id, 'aria-pressed': String(useFilter === id), onClick: () => setUseFilter(id), style: textFilterStyle(useFilter === id) }, label);
        const card = item => {
          const preview = item.type === 'image'
            ? h('img', { src: item.url, alt: item.name, loading: 'lazy', style: { width: '100%', height: '100%', objectFit: 'contain', display: 'block' }, onError: event => { event.currentTarget.style.display = 'none'; } })
            : item.type === 'video'
              ? h('video', { controls: true, muted: true, preload: 'metadata', style: { maxWidth: '100%', maxHeight: '100%' } }, h('source', { src: item.url }))
              : h('a', { href: item.url, target: '_blank', rel: 'noreferrer', style: { color: '#234b68', fontSize: 13, textDecoration: 'underline' } }, 'Open PDF');
          return h('article', { key: item.path, style: { border: '1px solid #dce3e9', borderRadius: 8, overflow: 'hidden', background: '#fff', minWidth: 0 } },
            h('div', { style: { aspectRatio: '16/9', background: '#f3f5f7', display: 'grid', placeItems: 'center', overflow: 'hidden', padding: item.type === 'pdf' ? 10 : 0, boxSizing: 'border-box' } }, preview),
            h('div', { style: { padding: 12 } },
              h('strong', { style: { display: 'block', overflowWrap: 'anywhere', marginBottom: 4 } }, item.name),
              h('div', { style: { fontSize: 12, color: '#657381', marginBottom: 8 } }, `${typeLabel(item.type)} · ${item.path}`),
              item.usages.length
                ? h('div', { style: { borderTop: '1px solid #edf0f2', paddingTop: 9 } },
                    ...[...new Map(item.usages.map(usage => [usage.category, item.usages.filter(entry => entry.category === usage.category)])).entries()].map(([category, usages]) =>
                      h('div', { key: category, style: { fontSize: 12, lineHeight: 1.5, marginBottom: 8 } },
                        h('div', { style: { color: '#53697a', fontSize: 11, marginBottom: 4, fontWeight: 650 } }, category + ' · ' + usages.length + (usages.length === 1 ? ' item' : ' items')),
                        ...usages.map((usage, index) => h('div', { key: `${usage.source}|${usage.title}|${index}`, style: { display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 8, padding: '3px 0' } },
                          h('span', { style: { minWidth: 0, overflowWrap: 'anywhere', color: '#263747' } }, usage.title),
                          usage.editUrl ? h('a', { href: usage.editUrl, style: { flex: '0 0 auto', color: '#234b68', textDecoration: 'underline', textUnderlineOffset: 2, fontSize: 11 } }, 'Open') : null
                        ))
                      )
                    )
                  )
                : h('div', { style: { borderTop: '1px solid #edf0f2', paddingTop: 8, color: '#7b6262', fontSize: 12 } }, 'Not currently used'),
            )
          );
        };
        return h('main', { style: { maxWidth: 1180, margin: '0 auto', padding: '28px 24px 44px', color: '#1b2733', fontFamily: 'Inter, system-ui, sans-serif' } },
          h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 } },
            h('div', null, h('h1', { style: { margin: '0 0 5px', fontSize: 28, fontWeight: 700 } }, 'Library'), h('p', { style: { margin: 0, color: '#687887', fontSize: 14 } }, 'Find brand and website files, then see where each asset is used.')),
            h('a', { href: '#/assets/-/all', style: { display: 'inline-block', color: '#234b68', textDecoration: 'underline', textUnderlineOffset: 3, fontWeight: 600, fontSize: 13 } }, 'Upload / Manage Assets')
          ),
          h('h2', { style: { margin: '24px 0 12px', fontSize: 17, fontWeight: 700 } }, 'All Assets'),
          h('div', { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 8, marginBottom: 10 } },
            h('strong', { style: { fontSize: 13, fontWeight: 650, marginRight: 3 } }, 'All types:'),
            typeButton('image', 'Images'), typeButton('pdf', 'PDF'), typeButton('video', 'Videos')
          ),
          h('input', { value: query, onChange: event => setQuery(event.target.value), placeholder: 'Search file name, Story title, or Trade Show title', 'aria-label': 'Search Library', style: { width: '100%', maxWidth: 680, boxSizing: 'border-box', padding: '11px 12px', border: '1px solid #ccd5dd', borderRadius: 6, font: 'inherit', margin: '4px 0 16px' } }),
          h('div', { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 8, margin: '0 0 18px' } },
            h('strong', { style: { fontSize: 13, fontWeight: 650, marginRight: 3 } }, 'Used in:'),
            ...useOptions.map(([id, label]) => useButton(id, label))
          ),
          loading ? h('p', { style: { color: '#657381' } }, 'Loading assets and usage references…') : null,
          error ? h('p', { role: 'alert', style: { padding: 14, border: '1px solid #e4b5b5', color: '#8b2424', borderRadius: 6 } }, error) : null,
          !loading && !error ? h('p', { style: { color: '#596775', fontSize: 13, margin: '0 0 14px' } }, `${items.length} assets · ${filtered.length} shown`) : null,
          !loading && !error && filtered.length ? h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 14 } }, ...filtered.map(card)) : null,
          !loading && !error && !filtered.length ? h('p', { style: { padding: 18, border: '1px solid #e4e9ed', borderRadius: 8, color: '#657381' } }, 'No matching assets. Try another search term or filter.') : null
        );
      };
      CMS.registerCustomPage({ id: 'brand-hub', label: 'Brand Hub', icon: 'palette', component: BrandHub });
      CMS.registerCustomPage({ id: 'media-library', label: 'Library', icon: 'library_books', component: MediaLibrary });
      CMS.registerCustomPage({ id: 'content-navigator', label: 'Content Management', icon: 'dashboard_customize', component: ContentManagement });

      // Reduce Sveltia's global page toolbar to the two custom entry points only.
      // Previous versions relied on tooltip text or exact routes for native controls;
      // several native icons have neither, so those selectors could not hide them.
      // This version keeps the two named custom pages by route/label and hides every
      // other compact icon control in the top-left toolbar area, including unlabeled icons.
      const normalized = (value) => String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
      const primaryRoutes = new Set(['#/pages/brand-hub', '#/pages/media-library', '#/pages/content-navigator']);
      const primaryLabels = new Set(['brand hub', 'library', 'content management']);
      const primaryIconTokens = new Set(['palette', 'library_books', 'dashboard_customize']);
      const resourceRowPattern = /^(?:all resources|global resources|internal content resources\s*\(system\)|全部资源|全局资源|内部内容资源（系统）|内部内容资源 \(系统\))(?:\s*\d+)?$/i;
      const navItemSelector = 'a, button, [role="button"], [role="link"], [role="menuitem"], [role="treeitem"], li';
      const observedRoots = new WeakSet();

      const normalizeRoute = (href) => {
        const raw = String(href || '').trim().toLowerCase();
        const marker = raw.indexOf('#/');
        return marker >= 0 ? raw.slice(marker).split(/[?&]/)[0] : raw.split(/[?&]/)[0];
      };

      const nodeLabels = (node) => {
        if (!node || node.nodeType !== 1) return [];
        return [
          node.getAttribute('aria-label'), node.getAttribute('title'),
          node.getAttribute('data-tooltip'), node.getAttribute('data-testid'),
          node.getAttribute('aria-description'), node.getAttribute('data-label'),
          node.getAttribute('data-page'), node.innerText || node.textContent
        ].map(normalized).filter(Boolean);
      };

      const routeOf = (node) => normalizeRoute(
        node && (node.getAttribute('href') || node.getAttribute('data-href') || node.getAttribute('data-route') || node.getAttribute('data-page')) || ''
      );

      // Only evaluate the actionable item itself (or its own compact list-item wrapper).
      // Never let a shared toolbar/nav parent preserve every sibling icon just because
      // that parent also contains Library or Content Management.
      const hasPrimaryIdentity = (node) => {
        if (!node || node.nodeType !== 1) return false;
        if (primaryRoutes.has(routeOf(node))) return true;
        const labels = nodeLabels(node);
        if (labels.some(label => primaryLabels.has(label) || primaryIconTokens.has(label) || [...primaryIconTokens].some(token => label.split(/[\s·|]+/).includes(token)))) return true;
        const iconNode = node.querySelector ? node.querySelector('.material-symbols-rounded, .material-symbols-outlined, [class*="material-symbols"]') : null;
        const iconToken = normalized(iconNode && iconNode.textContent);
        return primaryIconTokens.has(iconToken);
      };

      const isPrimaryItem = (node) => {
        if (!node || node.nodeType !== 1) return false;
        if (hasPrimaryIdentity(node)) return true;
        const tag = (node.tagName || '').toLowerCase();
        const isItemWrapper = tag === 'li' || /^(listitem|menuitem|treeitem)$/.test(node.getAttribute('role') || '');
        if (isItemWrapper) {
          const children = node.querySelectorAll ? node.querySelectorAll('a, button, [role="button"], [role="link"], [role="menuitem"], [role="treeitem"]') : [];
          if (children.length === 1) return hasPrimaryIdentity(children[0]);
        }
        return false;
      };

      const getRect = (node) => {
        try { return node.getBoundingClientRect(); } catch (_) { return null; }
      };

      const isTopLeftToolbarIcon = (node) => {
        const rect = getRect(node);
        if (!rect || rect.width <= 0 || rect.height <= 0) return false;
        // The icon row in this site sits before the search input; the input itself is not a nav item.
        return rect.top >= -4 && rect.top <= 62 && rect.bottom <= 72 &&
          rect.left >= -4 && rect.left <= 470 && rect.width <= 92 && rect.height <= 72;
      };

      const toolbarItemContainer = (control) => {
        // Choose the outermost compact wrapper around this one icon. Prefer the wrapper
        // over the button itself so hiding an item also removes its empty flex/grid slot.
        // Stop naturally before the shared toolbar because its width is much larger.
        let current = control;
        let candidate = control;
        const interactiveSelector = 'a, button, [role="button"], [role="link"], [role="menuitem"], [role="treeitem"]';
        for (let depth = 0; current && depth < 4; depth += 1) {
          const tag = (current.tagName || '').toLowerCase();
          const role = current.getAttribute && current.getAttribute('role') || '';
          const rect = getRect(current);
          const compact = rect && rect.width > 0 && rect.width <= 100 && rect.height > 0 && rect.height <= 76 && rect.top <= 62;
          if (compact) {
            const descendants = current.querySelectorAll ? current.querySelectorAll(interactiveSelector) : [];
            const isItemWrapper = tag === 'li' || /^(listitem|menuitem|treeitem)$/.test(role);
            if (current === control || isItemWrapper || descendants.length === 1) candidate = current;
          }
          current = current.parentElement;
        }
        return candidate;
      };

      const hideElement = (element) => {
        if (!element || element.getAttribute('data-def-hidden-native-nav') === 'true') return;
        element.style.setProperty('display', 'none', 'important');
        element.setAttribute('aria-hidden', 'true');
        element.setAttribute('data-def-hidden-native-nav', 'true');
      };

      // Hide only Sveltia's Validation tab/panel. Keep publishing-time required-field checks.
      const validationLabelPattern = /^(?:validation|field validation|validate(?:\s+(?:entry|content|all))?|验证|校验)$/i;
      const isValidationLabel = value => validationLabelPattern.test(normalized(value));
      const validationControlSelector = 'button, [role="button"], [role="radio"], [role="tab"], [role="menuitem"]';
      const hideValidationElement = element => {
        if (!element || element.getAttribute('data-def-hidden-validation') === 'true') return;
        element.style.setProperty('display', 'none', 'important');
        element.setAttribute('aria-hidden', 'true');
        element.setAttribute('data-def-hidden-validation', 'true');
      };
      const restoreValidationElement = element => {
        if (!element || element.getAttribute('data-def-hidden-validation') !== 'true') return;
        element.style.removeProperty('display');
        element.removeAttribute('aria-hidden');
        element.removeAttribute('data-def-hidden-validation');
      };
      const hideValidationUi = element => {
        if (!element || element.nodeType !== 1) return;
        const tag = String(element.tagName || '').toLowerCase();
        const visibleLabel = normalized(element.getAttribute('aria-label') || element.getAttribute('title') || element.innerText || element.textContent);
        if (element.matches && element.matches(validationControlSelector) && isValidationLabel(visibleLabel)) {
          hideValidationElement(element);
        }

        // Sveltia keeps the active sidebar content in #entry-sidebar-content and labels its
        // panel with an h3 (the Chinese locale calls this panel “验证”).
        const sidebarContent = element.closest ? element.closest('#entry-sidebar-content') : null;
        if (sidebarContent) {
          const heading = sidebarContent.querySelector('h3');
          if (heading && isValidationLabel(heading.innerText || heading.textContent)) {
            hideValidationElement(sidebarContent);
          } else {
            restoreValidationElement(sidebarContent);
          }
        } else if (/^h[1-6]$/.test(tag) && isValidationLabel(visibleLabel)) {
          const panel = element.closest('[role="group"][aria-labelledby]');
          const sidebar = panel && panel.closest('#entry-sidebar-content');
          if (sidebar) hideValidationElement(sidebar);
        }

        // Hide the manual Validate action wherever Sveltia exposes it.
        if (tag === 'button' && isValidationLabel(visibleLabel)) hideValidationElement(element);
      };

      // Sveltia v0.250.2 renders the native Save/Save and Publish split control as
      // .sui.split-button > button + button.menu-button. Add a clearly labelled Publish
      // button beside that native control, but delegate the actual publish action to Sveltia.
      const allOpenDomRoots = () => {
        const roots = [document];
        for (let index = 0; index < roots.length; index += 1) {
          const root = roots[index];
          if (!root || !root.querySelectorAll) continue;
          root.querySelectorAll('*').forEach(node => {
            if (node.shadowRoot && !roots.includes(node.shadowRoot)) roots.push(node.shadowRoot);
          });
        }
        return roots;
      };
      const queryAllOpenRoots = selector => {
        const found = [];
        allOpenDomRoots().forEach(root => {
          if (root.querySelectorAll) root.querySelectorAll(selector).forEach(node => found.push(node));
        });
        return [...new Set(found)];
      };
      const getEditorControlLabel = element => normalized(
        element && (element.getAttribute('aria-label') || element.getAttribute('title') || element.innerText || element.textContent)
      );
      const visibleEditorElement = element => {
        if (!element || !element.isConnected) return false;
        const rect = element.getBoundingClientRect();
        if (rect.width < 1 || rect.height < 1) return false;
        const style = window.getComputedStyle(element);
        return style.display !== 'none' && style.visibility !== 'hidden';
      };
      const findNativeSaveSplit = () => queryAllOpenRoots('.sui.split-button').find(group => {
        const rect = group.getBoundingClientRect();
        if (rect.top < -2 || rect.top > 130 || rect.right < window.innerWidth * 0.45) return false;
        const buttons = Array.from(group.querySelectorAll('button'));
        const save = buttons.find(button =>
          !button.classList.contains('menu-button') &&
          /^(?:save|保存|保存更改|saving|保存中|publishing|发布中)$/i.test(getEditorControlLabel(button))
        );
        const menu = buttons.find(button => button.classList.contains('menu-button'));
        return visibleEditorElement(group) && !!save && !!menu;
      }) || null;

      let activePublishGroup = null;
      let activeNativeSaveButton = null;
      let activeNativeMenuButton = null;
      let activePublishButton = null;

      const installEditorPublishButton = () => {
        if (
          activePublishButton && activePublishButton.isConnected &&
          activePublishGroup && activePublishGroup.isConnected &&
          activeNativeSaveButton && activeNativeSaveButton.isConnected &&
          activeNativeMenuButton && activeNativeMenuButton.isConnected &&
          activePublishButton.parentElement === activePublishGroup.parentElement
        ) {
          if (!activePublishButton.dataset.defPublishPending) {
            activePublishButton.disabled = activeNativeSaveButton.disabled ||
              activePublishGroup.getAttribute('aria-disabled') === 'true';
          }
          return;
        }

        if (activePublishButton && activePublishButton.isConnected) activePublishButton.remove();
        activePublishGroup = null;
        activeNativeSaveButton = null;
        activeNativeMenuButton = null;
        activePublishButton = null;

        const group = findNativeSaveSplit();
        if (!group || !group.parentElement) return;
        const buttons = Array.from(group.querySelectorAll('button'));
        const saveButton = buttons.find(button =>
          !button.classList.contains('menu-button') &&
          /^(?:save|保存|保存更改|saving|保存中|publishing|发布中)$/i.test(getEditorControlLabel(button))
        );
        const menuButton = buttons.find(button => button.classList.contains('menu-button'));
        if (!saveButton || !menuButton) return;

        const publishButton = document.createElement('button');
        publishButton.type = 'button';
        publishButton.textContent = '发布';
        publishButton.setAttribute('aria-label', 'Publish');
        publishButton.setAttribute('title', 'Publish this entry to the website');
        publishButton.setAttribute('data-def-explicit-publish', 'true');
        publishButton.style.cssText = [
          'display:inline-flex',
          'align-items:center',
          'justify-content:center',
          'min-height:36px',
          'margin-inline-start:8px',
          'padding:0 16px',
          'border:1px solid #1b66bd',
          'border-radius:6px',
          'background:#1b66bd',
          'color:#fff',
          'font:inherit',
          'font-size:14px',
          'font-weight:600',
          'line-height:1.2',
          'white-space:nowrap',
          'cursor:pointer'
        ].join(';');

        publishButton.addEventListener('click', event => {
          event.preventDefault();
          event.stopPropagation();
          const currentGroup = findNativeSaveSplit();
          if (!currentGroup) {
            publishButton.title = '未找到 CMS 原生发布菜单，请刷新编辑页后重试。';
            return;
          }
          const currentSave = Array.from(currentGroup.querySelectorAll('button')).find(button =>
            !button.classList.contains('menu-button') &&
            /^(?:save|保存|保存更改|saving|保存中|publishing|发布中)$/i.test(getEditorControlLabel(button))
          );
          const currentMenu = Array.from(currentGroup.querySelectorAll('button')).find(button => button.classList.contains('menu-button'));
          if (!currentSave || !currentMenu || currentSave.disabled || currentGroup.getAttribute('aria-disabled') === 'true') return;

          publishButton.disabled = true;
          publishButton.dataset.defPublishPending = 'true';
          currentMenu.click();

          const startedAt = Date.now();
          const triggerNativePublish = () => {
            const option = queryAllOpenRoots('button, [role="menuitem"], [role="option"]').find(candidate =>
              visibleEditorElement(candidate) &&
              !candidate.disabled &&
              /^(?:save and publish|保存并发布)$/i.test(getEditorControlLabel(candidate))
            );
            if (option) {
              option.click();
              publishButton.title = '已将发布操作交给 CMS 处理。';
              window.setTimeout(() => {
                if (!publishButton.isConnected) return;
                delete publishButton.dataset.defPublishPending;
                const nativeGroup = findNativeSaveSplit();
                const nativeSave = nativeGroup && Array.from(nativeGroup.querySelectorAll('button')).find(button =>
                  !button.classList.contains('menu-button') &&
                  /^(?:save|保存|保存更改|saving|保存中|publishing|发布中)$/i.test(getEditorControlLabel(button))
                );
                publishButton.disabled = !nativeSave || nativeSave.disabled;
              }, 5000);
            } else if (Date.now() - startedAt < 3000) {
              window.setTimeout(triggerNativePublish, 60);
            } else {
              delete publishButton.dataset.defPublishPending;
              publishButton.disabled = false;
              publishButton.title = '没有找到“保存并发布”菜单项。请用 Save 旁边的下拉菜单执行发布。';
            }
          };
          window.setTimeout(triggerNativePublish, 0);
        });

        group.insertAdjacentElement('afterend', publishButton);
        activePublishGroup = group;
        activeNativeSaveButton = saveButton;
        activeNativeMenuButton = menuButton;
        activePublishButton = publishButton;
        publishButton.disabled = saveButton.disabled || group.getAttribute('aria-disabled') === 'true';
      };

      const restoreElement = (element) => {
        if (!element || element.getAttribute('data-def-hidden-native-nav') !== 'true') return;
        element.style.removeProperty('display');
        element.removeAttribute('aria-hidden');
        element.removeAttribute('data-def-hidden-native-nav');
      };

      const hideResourceRow = (element) => {
        let target = element;
        if (typeof element.closest === 'function') {
          target = element.closest('a, button, [role="button"], [role="treeitem"], [role="link"], [role="listitem"], li') || element;
        }
        if (!resourceRowPattern.test(normalized(target.innerText || target.textContent))) {
          let parent = target.parentElement;
          for (let step = 0; parent && step < 4; step += 1, parent = parent.parentElement) {
            if (resourceRowPattern.test(normalized(parent.innerText || parent.textContent))) target = parent;
            else break;
          }
        }
        hideElement(target);
      };

      const inspectElement = (element) => {
        if (!element || element.nodeType !== 1) return;
        hideValidationUi(element);
        const control = element.matches && element.matches(navItemSelector)
          ? element
          : (element.closest ? element.closest(navItemSelector) : null);
        if (control) {
          const target = toolbarItemContainer(control);
          if (isPrimaryItem(control) || isPrimaryItem(target)) {
            // Restore both the clickable control and its one-item wrapper. This also
            // handles scan order where a wrapper is visited before its inner link.
            restoreElement(control);
            if (target !== control) restoreElement(target);
          } else if (isTopLeftToolbarIcon(control)) {
            hideElement(target);
          }
        }
        const text = normalized(element.innerText || element.textContent);
        if (resourceRowPattern.test(text)) hideResourceRow(element);
      };

      const scanTree = (root) => {
        if (!root) return;
        if (root.nodeType === 1) inspectElement(root);
        const descendants = root.querySelectorAll ? root.querySelectorAll('*') : [];
        descendants.forEach((element) => {
          inspectElement(element);
          if (element.shadowRoot) observeAndScanRoot(element.shadowRoot);
        });
      };

      const observeAndScanRoot = (root) => {
        if (!root || observedRoots.has(root)) return;
        observedRoots.add(root);
        scanTree(root);
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              if (node.nodeType === 1) {
                inspectElement(node);
                scanTree(node);
                if (node.shadowRoot) observeAndScanRoot(node.shadowRoot);
              }
            });
            if ((mutation.type === 'attributes' || mutation.type === 'characterData') && mutation.target) {
              const target = mutation.target.nodeType === 1 ? mutation.target : mutation.target.parentElement;
              if (target) inspectElement(target);
            }
          });
          installEditorPublishButton();
        });
        observer.observe(root, {
          childList: true,
          subtree: true,
          attributes: true,
          characterData: true,
          attributeFilter: ['aria-label', 'title', 'data-tooltip', 'data-testid', 'aria-description', 'data-label', 'data-page', 'href', 'data-href', 'data-route']
        });
      };

      // Version marker makes it possible to confirm this exact navigation script reached production.
      document.documentElement.setAttribute('data-def-cms-nav-fix', 'two-primary-pages-v5');
      document.documentElement.setAttribute('data-def-cms-validation-ui', 'hidden-v1');
      observeAndScanRoot(document);
      installEditorPublishButton();
      const rootObserver = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => mutation.addedNodes.forEach((node) => {
          if (node.nodeType === 1) {
            inspectElement(node);
            scanTree(node);
            if (node.shadowRoot) observeAndScanRoot(node.shadowRoot);
          }
        }));
        installEditorPublishButton();
      });
      if (document.documentElement) rootObserver.observe(document.documentElement, { childList: true, subtree: true });

      if (!window.location.hash || /^#\/collections\/content-management\/?$/.test(window.location.hash)) window.location.hash = '#/pages/content-navigator';
    })();
  </script>
</body>
</html>
