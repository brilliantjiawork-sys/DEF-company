<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DEF Company 内容管理</title>
  <style>
    :root { color-scheme: light; }
    .def-cms-dashboard { max-width: 980px; margin: 0 auto; padding: 28px 26px 44px; color: #1b2733; font-family: Inter, system-ui, sans-serif; }
    .def-cms-dashboard h1 { margin: 0 0 8px; font-size: 28px; font-weight: 650; }
    .def-cms-dashboard h3 { margin: 22px 0 8px; font-size: 15px; font-weight: 650; }
    .def-cms-dashboard .intro { margin: 0 0 20px; color: #586675; line-height: 1.4; }
    .def-cms-group { border-bottom: 1px solid #dce3e9; padding: 0 0 20px; margin: 0 0 20px; }
    .def-cms-group > h2 { margin: 0 0 10px; padding: 0; font-size: 17px; line-height: 1.4; font-weight: 700; color: #172a3a; }
    .def-cms-items { padding: 0; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
    .def-cms-item { display: flex; align-items: center; gap: 11px; min-height: 50px; padding: 10px 12px; border: 1px solid #e0e7ed; border-radius: 8px; text-decoration: none; color: #1f2d3a; background: #fff; }
    .def-cms-item:hover, .def-cms-item:focus-visible { border-color: #93b7d4; background: #f7fbff; outline: none; }
    .def-cms-item strong { display: block; font-size: 14px; font-weight: 650; }
    .def-cms-icon { display: grid; place-items: center; flex: 0 0 28px; width: 28px; height: 28px; border-radius: 7px; background: #eef4f8; color: #234b68; }
    .def-cms-icon svg { width: 18px; height: 18px; display: block; }
    .def-cms-subgroup { margin: 12px 0; padding: 0 0 4px; }
    .def-cms-subgroup > h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: #43596b; }
    .def-cms-subgroup .def-cms-items { padding-top: 0; }
    .def-cms-group-stacked > .def-cms-items { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
    .def-cms-group-stacked > .def-cms-items > .def-cms-subgroup { width: 100%; box-sizing: border-box; }
    .def-cms-dashboard .def-cms-subgroup + .def-cms-item { margin-top: 8px; }
    .def-cms-section-caption { margin: -3px 0 12px; color: #687887; font-size: 13px; line-height: 1.5; }
    @media (max-width: 720px) { .def-cms-items { grid-template-columns: 1fr; } .def-cms-dashboard { padding: 18px; } }
  </style>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <script>
    (() => {
      if (!window.CMS || typeof CMS.registerCustomPage !== 'function' || !CMS.React) return;
      const h = CMS.React.createElement;
      const iconPaths = {
        plus: h('path', { d: 'M12 5v14M5 12h14', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round' }),
        check: h('path', { d: 'm5 12 4 4L19 6', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }),
        draft: h('path', { d: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M8 13h8 M8 17h6', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round' }),
        settings: h('path', { d: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 3.1-.2-.1a1.7 1.7 0 0 0-1.9.2 1.7 1.7 0 0 0-.8 1.5v.3h-3.6v-.3a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.2l-.2.1-1.8-3.1.2-.2a1.7 1.7 0 0 0 .2-1.8A1.7 1.7 0 0 0 5.5 14h-.3v-3.6h.3a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.2-1.8l-.1-.2 3.1-1.8.2.2a1.7 1.7 0 0 0 1.8.2A1.7 1.7 0 0 0 13 4.3V4h3.6v.3a1.7 1.7 0 0 0 1.1 1.6 1.7 1.7 0 0 0 1.8-.2l.2-.1 1.8 3.1-.2.2a1.7 1.7 0 0 0-.2 1.8 1.7 1.7 0 0 0 1.5.8h.3v3.6h-.3a1.7 1.7 0 0 0-1.2.1z', fill: 'none', stroke: 'currentColor', strokeWidth: 1.1, strokeLinejoin: 'round' }),
        image: h('path', { d: 'M4 5h16v14H4z M8 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z M4 16l5-5 4 4 3-3 4 4', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinejoin: 'round' }),
        home: h('path', { d: 'm3 10 9-7 9 7 M5 9v11h14V9 M9 20v-7h6v7', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinejoin: 'round' }),
        social: h('path', { d: 'M7 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M17 14a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M7 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M9.5 6.5l5 3 M9.5 17.5l5-3', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round' }),
        media: h('path', { d: 'M4 4h16v16H4z M8 9h8 M8 13h8 M8 17h5', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round' })
      };
      const icon = (name) => h('span', { className: 'def-cms-icon', 'aria-hidden': 'true' }, h('svg', { viewBox: '0 0 24 24', fill: 'none' }, iconPaths[name] || iconPaths.draft));
      const link = (title, route, iconName = 'draft') => h('a', { className: 'def-cms-item', href: route }, icon(iconName), h('strong', null, title));
      const group = (title, children, caption = '', stacked = false) => h('section', { className: 'def-cms-group' + (stacked ? ' def-cms-group-stacked' : '') },
        h('h2', null, title),
        caption ? h('p', { className: 'def-cms-section-caption' }, caption) : null,
        h('div', { className: 'def-cms-items' }, ...children)
      );
      const subgroup = (title, children, caption = '') => h('div', { className: 'def-cms-subgroup' },
        h('h3', null, title),
        caption ? h('p', { className: 'def-cms-section-caption' }, caption) : null,
        h('div', { className: 'def-cms-items' }, ...children)
      );

      // Every section and sub-entry is visible at once. There are no accordions here,
      // so high-frequency tasks never require an extra click just to reveal links.
      const contentViewFromHash = () => {
        const hash = String(window.location.hash || '');
        if (!hash.includes('/pages/content-navigator')) return 'dashboard';
        const query = hash.includes('?') ? hash.slice(hash.indexOf('?') + 1) : '';
        const params = new URLSearchParams(query);
        const requested = params.get('view') || 'dashboard';
        return new Set(['draft-stories', 'published-stories', 'draft-trade-show-articles', 'published-trade-show-articles']).has(requested) ? requested : 'dashboard';
      };

      const ContentEntryListing = ({ view, onBack }) => {
        const [entries, setEntries] = CMS.React.useState([]);
        const [query, setQuery] = CMS.React.useState('');
        const [loading, setLoading] = CMS.React.useState(true);
        const [error, setError] = CMS.React.useState('');
        const repo = 'brilliantjiawork-sys/DEF-company';
        const config = {
          'draft-stories': { collection: 'stories', folder: 'data/stories', label: 'Draft Stories', mode: 'draft' },
          'published-stories': { collection: 'stories', folder: 'data/stories', label: 'Published Stories', mode: 'published' },
          'draft-trade-show-articles': { collection: 'trade-show-articles', folder: 'data/trade-show-articles', label: 'Draft Trade Show Articles', mode: 'draft' },
          'published-trade-show-articles': { collection: 'trade-show-articles', folder: 'data/trade-show-articles', label: 'Published Trade Show Articles', mode: 'published' }
        }[view];

        CMS.React.useEffect(() => {
          let cancelled = false;
          const api = (path, params = {}) => {
            const url = new URL(`https://api.github.com/repos/${repo}/${path}`);
            Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
            return fetch(url.toString(), { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
          };
          const jsonFromResponse = async response => {
            if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
            return response.json();
          };
          const fallbackTitle = slug => String(slug || 'Untitled').replace(/[-_]+/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
          const entryUrl = slug => `#/collections/${config.collection}/entries/${encodeURIComponent(slug)}`;
          const loadPublished = async () => {
            const response = await api(`contents/${config.folder}`, { ref: 'main' });
            if (response.status === 404) return [];
            const items = await jsonFromResponse(response);
            const files = (Array.isArray(items) ? items : []).filter(item => item.type === 'file' && /\.json$/i.test(item.name));
            const records = await Promise.all(files.map(async file => {
              try {
                const data = await jsonFromResponse(await fetch(file.download_url, { cache: 'no-store' }));
                const slug = file.name.replace(/\.json$/i, '');
                return { slug, title: data.title || data.name || fallbackTitle(slug), date: data.date || data.publish_date || '', category: data.category || '', status: 'Published', url: entryUrl(slug) };
              } catch (_) {
                const slug = file.name.replace(/\.json$/i, '');
                return { slug, title: fallbackTitle(slug), date: '', category: '', status: 'Published', url: entryUrl(slug) };
              }
            }));
            return records.sort((a, b) => String(b.date).localeCompare(String(a.date)) || a.title.localeCompare(b.title));
          };
          const loadDrafts = async () => {
            const response = await api('pulls', { state: 'open', per_page: '100', sort: 'updated', direction: 'desc' });
            const pulls = await jsonFromResponse(response);
            const prefix = `cms/${config.collection}/`;
            const related = (Array.isArray(pulls) ? pulls : []).filter(pr => String(pr.head?.ref || '').startsWith(prefix));
            const records = await Promise.all(related.map(async pr => {
              const slug = String(pr.head.ref).slice(prefix.length).replace(/\/$/, '');
              let title = pr.title || fallbackTitle(slug);
              let date = '';
              let category = '';
              try {
                const branchResponse = await api(`contents/${config.folder}/${encodeURIComponent(slug)}.json`, { ref: pr.head.ref });
                if (branchResponse.ok) {
                  const file = await branchResponse.json();
                  const bytes = Uint8Array.from(atob(String(file.content || '').replace(/\s/g, '')), char => char.charCodeAt(0));
                  const data = JSON.parse(new TextDecoder('utf-8').decode(bytes));
                  title = data.title || title;
                  date = data.date || data.publish_date || '';
                  category = data.category || '';
                }
              } catch (_) { /* Keep the pull-request title when branch content cannot be read. */ }
              const labels = (pr.labels || []).map(label => label.name).filter(Boolean);
              return { slug, title, date, category, status: labels.find(label => label.startsWith('sveltia-cms/'))?.replace('sveltia-cms/', '') || 'Draft', prNumber: pr.number, url: entryUrl(slug), updatedAt: pr.updated_at || '' };
            }));
            return records.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)) || a.title.localeCompare(b.title));
          };
          (async () => {
            setLoading(true); setError(''); setEntries([]);
            try {
              const data = config.mode === 'published' ? await loadPublished() : await loadDrafts();
              if (!cancelled) setEntries(data);
            } catch (err) {
              if (!cancelled) setError(`无法读取${config.label}。请确认 GitHub 仓库公开可读、API 限额未用尽，然后重试。(${err?.message || 'Unknown error'})`);
            } finally { if (!cancelled) setLoading(false); }
          })();
          return () => { cancelled = true; };
        }, [view]);

        const normalizedQuery = query.trim().toLowerCase();
        const shown = entries.filter(entry => [entry.title, entry.date, entry.category, entry.slug, entry.status].join(' ').toLowerCase().includes(normalizedQuery));
        const smallText = { color: '#657381', fontSize: 12, lineHeight: 1.5 };
        return h('div', { className: 'def-cms-dashboard' },
          h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap', marginBottom: 14 } },
            h('div', null, h('h1', null, config.label), h('p', { className: 'intro', style: { marginBottom: 0 } }, config.mode === 'published' ? 'Only entries already merged into main are listed here. This page does not create new content.' : 'Only unpublished entries from this content type are listed here. Select an entry to continue editing it.')),
            h('a', { href: '#/pages/content-navigator', onClick: onBack, style: { color: '#234b68', textDecoration: 'underline', textUnderlineOffset: 3, fontSize: 13, fontWeight: 600, whiteSpace: 'nowrap' } }, '← Content Management')
          ),
          h('input', { value: query, onChange: event => setQuery(event.target.value), placeholder: 'Search title, date, category…', 'aria-label': `Search ${config.label}`, style: { width: '100%', maxWidth: 620, boxSizing: 'border-box', padding: '10px 12px', border: '1px solid #ccd5dd', borderRadius: 7, font: 'inherit', margin: '0 0 16px' } }),
          loading ? h('p', { style: smallText }, 'Loading entries…') : null,
          error ? h('div', { role: 'alert', style: { border: '1px solid #e5c7c7', background: '#fffafa', padding: 14, borderRadius: 8, color: '#8a3434', lineHeight: 1.5 } }, error,
            h('div', { style: { marginTop: 10 } }, h('a', { href: config.mode === 'draft' ? '#/workflow' : `#/collections/${config.collection}`, style: { color: '#234b68', textDecoration: 'underline' } }, config.mode === 'draft' ? 'Open native Editorial Workflow' : 'Open native collection list'))) : null,
          !loading && !error ? h('p', { style: { ...smallText, margin: '0 0 10px' } }, `${shown.length} entries`) : null,
          !loading && !error && shown.length ? h('div', { style: { border: '1px solid #dce3e9', borderRadius: 8, overflow: 'hidden', background: '#fff' } },
            ...shown.map(entry => h('div', { key: entry.slug, style: { display: 'flex', alignItems: 'center', gap: 12, justifyContent: 'space-between', padding: '14px 16px', borderBottom: '1px solid #edf0f2', flexWrap: 'wrap' } },
              h('div', { style: { minWidth: 0, flex: '1 1 280px' } },
                h('strong', { style: { display: 'block', color: '#1d2d3b', fontSize: 14, lineHeight: 1.45, overflowWrap: 'anywhere' } }, entry.title),
                h('div', { style: { ...smallText, marginTop: 4 } }, [entry.date, entry.category, entry.status].filter(Boolean).join(' · ')),
                entry.prNumber ? h('div', { style: { ...smallText, marginTop: 2 } }, `Draft PR #${entry.prNumber}`) : null
              ),
              h('a', { href: entry.url, style: { color: '#234b68', fontSize: 13, fontWeight: 650, textDecoration: 'underline', textUnderlineOffset: 3, whiteSpace: 'nowrap' } }, 'Edit entry →')
            ))
          ) : null,
          !loading && !error && !shown.length ? h('div', { style: { border: '1px solid #e0e7ed', background: '#fff', padding: 18, borderRadius: 8, color: '#657381', lineHeight: 1.5 } }, config.mode === 'draft' ? `No unpublished ${config.collection === 'stories' ? 'Stories' : 'Trade Show Articles'} found.` : `No published ${config.collection === 'stories' ? 'Stories' : 'Trade Show Articles'} found.`) : null
        );
      };

      const ContentManagement = () => {
        const [view, setView] = CMS.React.useState(contentViewFromHash);
        CMS.React.useEffect(() => {
          const onHashChange = () => setView(contentViewFromHash());
          window.addEventListener('hashchange', onHashChange);
          return () => window.removeEventListener('hashchange', onHashChange);
        }, []);
        const openView = viewName => () => setView(viewName);
        if (view !== 'dashboard') return h(ContentEntryListing, { key: view, view, onBack: openView('dashboard') });
        return h('div', { className: 'def-cms-dashboard' },
          h('h1', null, 'Content Management'),
          h('p', { className: 'intro' }, 'Edit website content and publishing settings. Assets are managed separately in Library.'),
          group('Stories', [
            link('New Story', '#/collections/stories/new', 'plus'),
            link('Draft Stories', '#/pages/content-navigator?view=draft-stories', 'draft'),
            link('Published Stories', '#/pages/content-navigator?view=published-stories', 'check'),
            link('Stories Page Settings', '#/collections/content-management/entries/stories_page_settings', 'settings')
          ]),
          group('Trade Shows', [
            link('Upcoming Shows', '#/collections/content-management/entries/upcoming_shows', 'check'),
            subgroup('Trade Show Articles', [
              link('New Trade Show Article', '#/collections/trade-show-articles/new', 'plus'),
              link('Draft Trade Show Articles', '#/pages/content-navigator?view=draft-trade-show-articles', 'draft'),
              link('Published Trade Show Articles', '#/pages/content-navigator?view=published-trade-show-articles', 'check')
            ]),
            link('Trade Shows Page Settings', '#/collections/content-management/entries/events_page_settings', 'settings')
          ], '', true),
          group('Social Media', [
            link('Social Media Page Content', '#/collections/content-management/entries/social_page', 'social'),
            link('Social Channel Cards', '#/collections/content-management/entries/social_media', 'image')
          ]),
          group('Media', [
            link('Media Page Content', '#/collections/content-management/entries/media_page', 'media'),
            link('Media Contacts', '#/collections/content-management/entries/media_contacts', 'plus')
          ]),
          group('Website Basics', [
            link('Brand Introduction', '#/collections/content-management/entries/home_intro', 'home'),
            link('Newsletter', '#/collections/content-management/entries/home_newsletter', 'plus')
          ])
        );
      };

      // Only Library and Content Management are registered as custom pages.
      // Article management shortcuts live inside Content Management, not as toolbar icons.


      // Library indexes assets already in the public repository and relates them back
      // to the CMS records that reference them. Uploading/replacing files remains in
      // Sveltia's native Asset Library, reached from the action at the top of this page.
      const MediaLibrary = () => {
        const [items, setItems] = CMS.React.useState([]);
        const [query, setQuery] = CMS.React.useState('');
        const [typeFilter, setTypeFilter] = CMS.React.useState('all');
        const [useFilter, setUseFilter] = CMS.React.useState('all');
        const [loading, setLoading] = CMS.React.useState(true);
        const [error, setError] = CMS.React.useState('');
        const repo = 'brilliantjiawork-sys/DEF-company';
        const branch = 'main';
        const pdfExt = /\.pdf$/i;
        const videoExt = /\.(?:mp4|webm|mov|m4v|ogv|avi|mkv)$/i;
        const assetExt = /\.(?:png|jpe?g|webp|gif|svg|avif|pdf|mp4|webm|mov|m4v|ogv|avi|mkv)$/i;
        const assetRoots = ['images/', 'videos/', 'pdf/', 'documents/', 'downloads/', 'whitepapers/', 'catalogs/', 'assets/'];
        const staticData = [
          ['data/events.json', 'shows'],
          ['data/social-media.json', 'socialMedia'],
          ['data/newsroom-social-media.json', 'socialPage'],
          ['data/media-contacts.json', 'mediaContacts'],
          ['data/newsroom-media.json', 'mediaPage'],
          ['data/site-content.json', 'website'],
          ['data/home-intro.json', 'website'],
          ['data/home-newsletter.json', 'website'],
          ['data/stories-page-settings.json', 'website'],
          ['data/trade-shows-page-settings.json', 'website'],
          ['data/contact-content.json', 'website'],
          ['data/cookie-content.json', 'website']
        ];
        const cleanPath = value => {
          let result = String(value || '').split(/[?#]/)[0].trim().replace(/\\/g, '/').replace(/^\.\//, '').replace(/^\/+/, '');
          try { result = decodeURIComponent(result); } catch (_) {}
          return result;
        };
        const baseName = value => cleanPath(value).split('/').pop().toLowerCase();
        const getType = path => pdfExt.test(path) ? 'pdf' : videoExt.test(path) ? 'video' : 'image';
        const typeLabel = type => type === 'pdf' ? 'PDF' : type === 'video' ? 'Video' : 'Image';
        const categoryForKind = kind => ({
          stories: 'Stories', tradeArticles: 'Trade Shows', shows: 'Trade Shows',
          socialMedia: 'Social Media', socialPage: 'Social Media',
          mediaContacts: 'Media Contacts', mediaPage: 'Media Contacts', website: 'Website & Brand'
        }[kind] || 'Website & Brand');
        const titleForRecord = (record, fallback, kind) => String((kind === 'mediaContacts' ? record?.name : '') || record?.title || record?.name || record?.platform || record?.full_name || record?.contact_name || record?.page_title || fallback || 'Untitled').trim();
        const collectRefs = (value, fieldPath = '', out = []) => {
          if (typeof value === 'string') {
            const matches = value.match(/(?:\/?[A-Za-z0-9_ .@()/-]+\.(?:png|jpe?g|webp|gif|svg|avif|pdf|mp4|webm|mov|m4v|ogv|avi|mkv))(?:[?#][^\s"'<>]*)?/gi) || [];
            matches.forEach((match, index) => out.push({ path: cleanPath(match), field: fieldPath, occurrence: index + 1 }));
          } else if (Array.isArray(value)) {
            value.forEach((item, index) => collectRefs(item, fieldPath ? `${fieldPath}[${index}]` : `[${index}]`, out));
          } else if (value && typeof value === 'object') {
            Object.entries(value).forEach(([key, item]) => collectRefs(item, fieldPath ? `${fieldPath}.${key}` : key, out));
          }
          return out;
        };
        const fieldLocationFor = (field, occurrence = 1, kind = '') => {
          const raw = String(field || '').trim();
          const normalizedField = raw.toLowerCase();
          if (!raw) return 'Page content';
          if (/gallery/.test(normalizedField)) {
            const item = raw.match(/\[(\d+)\]/);
            return 'Gallery image ' + (item ? Number(item[1]) + 1 : occurrence);
          }
          if (/cover/.test(normalizedField) || ((kind === 'stories' || kind === 'tradeArticles') && /^(?:image|thumbnail)$/i.test(raw))) return 'Cover image';
          if (/hero/.test(normalizedField)) return 'Hero image';
          if (/avatar|photo|portrait/.test(normalizedField)) return 'Contact photo';
          if (/logo/.test(normalizedField)) return 'Logo';
          if (/^(?:body|content|markdown)$/i.test(raw)) return 'Article body · image ' + occurrence;
          return raw
            .replace(/\[(\d+)\]/g, (_, index) => 'item ' + (Number(index) + 1))
            .replace(/\./g, ' › ')
            .replace(/_/g, ' ')
            .replace(/^./, char => char.toUpperCase());
        };
        const getEditUrl = (kind, slug = '') => {
          const encoded = encodeURIComponent(slug);
          if (kind === 'stories' && slug) return `#/collections/stories/entries/${encoded}`;
          if (kind === 'tradeArticles' && slug) return `#/collections/trade-show-articles/entries/${encoded}`;
          if (kind === 'shows') return '#/collections/content-management/entries/upcoming_shows';
          if (kind === 'socialMedia') return '#/collections/content-management/entries/social_media';
          if (kind === 'socialPage') return '#/collections/content-management/entries/social_page';
          if (kind === 'mediaContacts' || kind === 'mediaPage') return `#/collections/content-management/entries/${kind === 'mediaContacts' ? 'media_contacts' : 'media_page'}`;
          if (kind === 'website') {
            if (slug === 'home-intro') return '#/collections/content-management/entries/home_intro';
            if (slug === 'home-newsletter') return '#/collections/content-management/entries/home_newsletter';
            if (slug === 'stories-page-settings') return '#/collections/content-management/entries/stories_page_settings';
            if (slug === 'trade-shows-page-settings') return '#/collections/content-management/entries/events_page_settings';
          }
          return '';
        };
        const recordsFrom = (data, kind, path, explicitSlug = '') => {
          if (!data) return [];
          const toRecord = (record, slug, fallback) => ({
            record, kind, source: path, slug: slug || String(record?.slug || ''),
            title: titleForRecord(record, fallback, kind), category: categoryForKind(kind),
            editUrl: getEditUrl(kind, slug || String(record?.slug || ''), path)
          });

      let activeExplicitSaveButton = null;
      let activeExplicitMenuButton = null;

      // Add an explicit Publish button next to Save. It delegates to Sveltia’s own
      // “Save and Publish” action so draft isolation and publishing safeguards stay native.
      const installEditorPublishButton = () => {
        if (
          activeExplicitPublishButton && activeExplicitPublishButton.isConnected &&
          activeExplicitSaveButton && activeExplicitSaveButton.isConnected &&
          activeExplicitMenuButton && activeExplicitMenuButton.isConnected &&
          activeExplicitPublishButton.parentElement === activeExplicitMenuButton.parentElement
        ) {
          if (!activeExplicitPublishButton.dataset.defPublishPending) {
            activeExplicitPublishButton.disabled = activeExplicitSaveButton.disabled;
          }
          return;
        }

        if (activeExplicitPublishButton && activeExplicitPublishButton.isConnected) activeExplicitPublishButton.remove();
        activeExplicitPublishButton = null;
        activeExplicitSaveButton = null;
        activeExplicitMenuButton = null;

        const saveButton = findEditorSaveButton();
        const menuButton = findSavePublishMenuButton();
        if (!saveButton || !menuButton || !menuButton.parentElement || !menuButton.parentElement.contains(saveButton)) return;
        const parent = menuButton.parentElement;
        let publishButton = null;
        if (!publishButton) {
          publishButton = document.createElement('button');
          publishButton.type = 'button';
          publishButton.textContent = '发布';
          publishButton.setAttribute('aria-label', 'Publish');
          publishButton.setAttribute('title', 'Publish');
          publishButton.setAttribute('data-def-explicit-publish', 'true');
          publishButton.className = (saveButton.className || '') + ' def-explicit-publish-button';
          publishButton.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;min-height:36px;margin-inline-start:8px;padding:0 14px;border:1px solid #1b66bd;border-radius:6px;background:#1b66bd;color:#fff;font:inherit;font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;cursor:pointer;';

          publishButton.addEventListener('click', event => {
            event.preventDefault();
            event.stopPropagation();
            const currentSave = findEditorSaveButton();
            const currentMenu = findSavePublishMenuButton();
            if (!currentSave || currentSave.disabled || !currentMenu) return;

            publishButton.disabled = true;
            currentMenu.click();
            const openedAt = Date.now();
            const selectPublishOption = () => {
              const item = queryAllDeep('[role="menuitem"], button').find(candidate =>
                uiElementIsVisible(candidate) &&
                /^(?:save and publish|保存并发布)$/i.test(editorButtonLabel(candidate))
              );
              if (item) {
                publishButton.dataset.defPublishPending = 'true';
                item.click();
                window.setTimeout(() => {
                  if (!publishButton.isConnected) return;
                  delete publishButton.dataset.defPublishPending;
                  publishButton.disabled = false;
                }, 8000);
              } else if (Date.now() - openedAt < 2500) {
                window.setTimeout(selectPublishOption, 50);
              } else {
                publishButton.disabled = false;
                publishButton.title = '无法找到“保存并发布”选项，请刷新 CMS 后重试。';
              }
            };
            window.setTimeout(selectPublishOption, 0);
          });
          parent.insertBefore(publishButton, menuButton);
        }
        activeExplicitPublishButton = publishButton;
        activeExplicitSaveButton = saveButton;
        activeExplicitMenuButton = menuButton;
        if (!publishButton.dataset.defPublishPending) publishButton.disabled = saveButton.disabled;
      };

      const restoreElement = (element) => {
        if (!element || element.getAttribute('data-def-hidden-native-nav') !== 'true') return;
        element.style.removeProperty('display');
        element.removeAttribute('aria-hidden');
        element.removeAttribute('data-def-hidden-native-nav');
      };

      const hideResourceRow = (element) => {
        let target = element;
        if (typeof element.closest === 'function') {
          target = element.closest('a, button, [role="button"], [role="treeitem"], [role="link"], [role="listitem"], li') || element;
        }
        if (!resourceRowPattern.test(normalized(target.innerText || target.textContent))) {
          let parent = target.parentElement;
          for (let step = 0; parent && step < 4; step += 1, parent = parent.parentElement) {
            if (resourceRowPattern.test(normalized(parent.innerText || parent.textContent))) target = parent;
            else break;
          }
        }
        hideElement(target);
      };

      const inspectElement = (element) => {
        if (!element || element.nodeType !== 1) return;
        hideValidationUi(element);
        const control = element.matches && element.matches(navItemSelector)
          ? element
          : (element.closest ? element.closest(navItemSelector) : null);
        if (control) {
          const target = toolbarItemContainer(control);
          if (isPrimaryItem(control) || isPrimaryItem(target)) {
            // Restore both the clickable control and its one-item wrapper. This also
            // handles scan order where a wrapper is visited before its inner link.
            restoreElement(control);
            if (target !== control) restoreElement(target);
          } else if (isTopLeftToolbarIcon(control)) {
            hideElement(target);
          }
        }
        const text = normalized(element.innerText || element.textContent);
        if (resourceRowPattern.test(text)) hideResourceRow(element);
      };

      const scanTree = (root) => {
        if (!root) return;
        if (root.nodeType === 1) inspectElement(root);
        const descendants = root.querySelectorAll ? root.querySelectorAll('*') : [];
        descendants.forEach((element) => {
          inspectElement(element);
          if (element.shadowRoot) observeAndScanRoot(element.shadowRoot);
        });
      };

      const observeAndScanRoot = (root) => {
        if (!root || observedRoots.has(root)) return;
        observedRoots.add(root);
        scanTree(root);
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              if (node.nodeType === 1) {
                inspectElement(node);
                scanTree(node);
                if (node.shadowRoot) observeAndScanRoot(node.shadowRoot);
              }
            });
            if ((mutation.type === 'attributes' || mutation.type === 'characterData') && mutation.target) {
              const target = mutation.target.nodeType === 1 ? mutation.target : mutation.target.parentElement;
              if (target) inspectElement(target);
            }
          });
          installEditorPublishButton(); // Reuse cached controls; refresh disabled state after any toolbar/editor update.
        });
        observer.observe(root, {
          childList: true,
          subtree: true,
          attributes: true,
          characterData: true,
          attributeFilter: ['aria-label', 'title', 'data-tooltip', 'data-testid', 'aria-description', 'data-label', 'data-page', 'href', 'data-href', 'data-route']
        });
      };

      // Version marker makes it possible to confirm this exact navigation script reached production.
      document.documentElement.setAttribute('data-def-cms-nav-fix', 'two-primary-pages-v5');
      document.documentElement.setAttribute('data-def-cms-validation-ui', 'hidden-v1');
      observeAndScanRoot(document);
      installEditorPublishButton();
      const rootObserver = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => mutation.addedNodes.forEach((node) => {
          if (node.nodeType === 1) {
            inspectElement(node);
            scanTree(node);
            if (node.shadowRoot) observeAndScanRoot(node.shadowRoot);
          }
        }));
        installEditorPublishButton();
      });
      if (document.documentElement) rootObserver.observe(document.documentElement, { childList: true, subtree: true });

      if (!window.location.hash || /^#\/collections\/content-management\/?$/.test(window.location.hash)) window.location.hash = '#/pages/content-navigator';
    })();
  </script>
</body>
</html>
