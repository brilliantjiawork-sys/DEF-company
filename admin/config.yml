backend:
  name: github
  repo: brilliantjiawork-sys/DEF-company
  branch: main

media_folder: "images"
public_folder: "/images"

# Only use files stored in this repository. Do not add third-party stock libraries.
media_libraries:
  default:
    config:
      slugify_filename: true
  stock_assets:
    providers: []

collections:
  - name: "site-content"
    label: "Website Content — 网站文案与图片"
    description: "维护首页、Newsroom、表单说明和 Cookie 文案，以及首页与栏目卡片图片。一般运营更新内容无需修改 HTML。"
    files:
      - file: "data/site-content.json"
        name: "site_content"
        label: "页面文案与图片"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "品牌信息"
            name: "brand"
            widget: "object"
            fields:
              - { label: "浏览器页面标题", name: "page_title", widget: "string", required: true }
              - { label: "品牌名称", name: "name", widget: "string", required: true }
              - { label: "品牌标语", name: "tagline", widget: "string", required: false }
              - { label: "Logo 图片（Browse 上传本地图片）", name: "logo", widget: "image", choose_url: false, required: false }
              - { label: "Logo 替代文本", name: "logo_alt", widget: "string", required: false }
          - label: "导航栏文字"
            name: "navigation"
            widget: "object"
            fields:
              - { label: "首页", name: "home", widget: "string" }
              - { label: "产品", name: "products", widget: "string" }
              - { label: "解决方案", name: "solutions", widget: "string" }
              - { label: "支持", name: "support", widget: "string" }
              - { label: "Newsroom", name: "newsroom", widget: "string" }
              - { label: "联系销售按钮", name: "contact_sales", widget: "string" }
          - label: "首页 — 主视觉与订阅区"
            name: "home"
            widget: "object"
            fields:
              - { label: "主标题", name: "hero_title", widget: "string", required: true }
              - { label: "主标题下的说明", name: "hero_description", widget: "text", required: true }
              - { label: "主按钮文字", name: "hero_button", widget: "string", required: true }
              - { label: "主视觉图片（Browse 上传本地图片）", name: "hero_image", widget: "image", choose_url: false, required: false }
              - { label: "主视觉图片替代文本", name: "hero_image_alt", widget: "string", required: false }
              - { label: "订阅区图片（Browse 上传本地图片）", name: "newsletter_image", widget: "image", choose_url: false, required: false }
              - { label: "订阅区图片替代文本", name: "newsletter_image_alt", widget: "string", required: false }
              - { label: "订阅区图片说明", name: "newsletter_image_caption", widget: "text", required: false }
              - { label: "订阅区标题", name: "newsletter_title", widget: "string", required: true }
              - { label: "订阅区说明", name: "newsletter_description", widget: "text", required: true }
              - { label: "邮箱输入框提示", name: "newsletter_email_placeholder", widget: "string", required: true }
              - { label: "订阅按钮文字", name: "newsletter_button", widget: "string", required: true }
              - { label: "订阅成功后标题", name: "newsletter_success_title", widget: "string", required: true }
              - { label: "订阅成功后说明", name: "newsletter_success_description", widget: "text", required: true }
          - label: "Newsroom — 栏目与栏目卡片"
            name: "newsroom"
            widget: "object"
            fields:
              - { label: "侧边栏：Overview", name: "sidebar_overview", widget: "string" }
              - { label: "侧边栏：Stories", name: "sidebar_stories", widget: "string" }
              - { label: "侧边栏：Events", name: "sidebar_events", widget: "string" }
              - { label: "侧边栏：Social Media", name: "sidebar_social", widget: "string" }
              - { label: "侧边栏：Media", name: "sidebar_media", widget: "string" }
              - { label: "Newsroom 总标题", name: "overview_title", widget: "string" }
              - label: "Overview 卡片 — Social Media"
                name: "overview_cards"
                widget: "object"
                fields:
                  - label: "Social Media 卡片"
                    name: "social"
                    widget: "object"
                    fields:
                      - { label: "卡片标题", name: "title", widget: "string" }
                      - { label: "卡片图片（Browse 上传本地图片）", name: "image", widget: "image", choose_url: false }
                      - { label: "图片替代文本", name: "image_alt", widget: "string", required: false }
                  - label: "Stories 卡片"
                    name: "stories"
                    widget: "object"
                    fields:
                      - { label: "卡片标题", name: "title", widget: "string" }
                      - { label: "卡片图片（Browse 上传本地图片）", name: "image", widget: "image", choose_url: false }
                      - { label: "图片替代文本", name: "image_alt", widget: "string", required: false }
                  - label: "Events 卡片"
                    name: "events"
                    widget: "object"
                    fields:
                      - { label: "卡片标题", name: "title", widget: "string" }
                      - { label: "卡片图片（Browse 上传本地图片）", name: "image", widget: "image", choose_url: false }
                      - { label: "图片替代文本", name: "image_alt", widget: "string", required: false }
                  - label: "Media 卡片"
                    name: "media"
                    widget: "object"
                    fields:
                      - { label: "卡片标题", name: "title", widget: "string" }
                      - { label: "卡片图片（Browse 上传本地图片）", name: "image", widget: "image", choose_url: false }
                      - { label: "图片替代文本", name: "image_alt", widget: "string", required: false }
              - { label: "Stories 页面标题", name: "stories_title", widget: "string" }
              - { label: "Stories 页面介绍", name: "stories_intro", widget: "text" }
              - { label: "Events 页面标题", name: "events_title", widget: "string" }
              - { label: "Events 页面介绍", name: "events_intro", widget: "text" }
              - { label: "Events：未来展会切换标签", name: "events_upcoming_tab", widget: "string" }
              - { label: "Events：历史展会切换标签", name: "events_past_tab", widget: "string" }
              - { label: "Stories 详情页返回按钮文字", name: "stories_back_button", widget: "string" }
              - { label: "Trade Shows 详情页返回按钮文字", name: "events_back_button", widget: "string" }
              - { label: "Upcoming Trade Shows 区块标题", name: "events_upcoming_heading", widget: "string" }
              - { label: "Past Trade Shows 区块标题", name: "events_past_heading", widget: "string" }
              - { label: "日期待确认区块标题", name: "events_unknown_heading", widget: "string" }
              - { label: "历史展会年份筛选提示", name: "events_year_label", widget: "string" }
              - { label: "展会详情的外链按钮文字", name: "events_visit_link", widget: "string" }
              - { label: "Social Media 页面标题", name: "social_title", widget: "string" }
              - { label: "Social Media 免责声明开头", name: "social_disclaimer_lead", widget: "string" }
              - { label: "Social Media 免责声明正文", name: "social_disclaimer_text", widget: "text" }
              - { label: "Media Contacts 页面标题", name: "media_title", widget: "string" }
              - { label: "Media Contacts 免责声明开头", name: "media_disclaimer_lead", widget: "string" }
              - { label: "Media Contacts 免责声明正文", name: "media_disclaimer_text", widget: "text" }
              - { label: "图片来源名称", name: "image_source_label", widget: "string" }
              - { label: "图片来源网址", name: "image_source_url", widget: "string", hint: "例如 https://unsplash.com/" }
          - label: "Contact Sales — 表单与成功提示文字"
            name: "contact"
            widget: "object"
            fields:
              - { label: "表单标题", name: "title", widget: "string" }
              - { label: "表单说明", name: "description", widget: "text" }
              - { label: "Work Email 标签", name: "email_label", widget: "string" }
              - { label: "First Name 标签", name: "first_name_label", widget: "string" }
              - { label: "Last Name 标签", name: "last_name_label", widget: "string" }
              - { label: "Company 标签", name: "company_label", widget: "string" }
              - { label: "Phone 标签", name: "phone_label", widget: "string" }
              - { label: "Country/Region 标签", name: "country_label", widget: "string" }
              - { label: "Postal / Zip Code 标签", name: "zip_code_label", widget: "string" }
              - { label: "Industry 标签", name: "industry_label", widget: "string" }
              - { label: "Additional Comments 标签", name: "message_label", widget: "string" }
              - { label: "国家下拉框提示", name: "country_placeholder", widget: "string" }
              - { label: "行业下拉框提示", name: "industry_placeholder", widget: "string" }
              - { label: "留言输入提示", name: "message_placeholder", widget: "string" }
              - { label: "提交按钮文字", name: "submit_button", widget: "string" }
              - { label: "提交成功标题", name: "success_title", widget: "string" }
              - { label: "提交成功说明", name: "success_description", widget: "text" }
              - { label: "返回首页按钮文字", name: "return_button", widget: "string" }
          - label: "Cookie 同意提示"
            name: "cookie"
            widget: "object"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - { label: "说明", name: "description", widget: "text" }
              - { label: "Reject all 按钮", name: "reject_button", widget: "string" }
              - { label: "Customize 按钮", name: "customize_button", widget: "string" }
              - { label: "Accept all 按钮", name: "accept_button", widget: "string" }
              - { label: "必要 Cookie 标题", name: "necessary_title", widget: "string" }
              - { label: "必要 Cookie 说明", name: "necessary_description", widget: "string" }
              - { label: "Analytics 标题", name: "analytics_title", widget: "string" }
              - { label: "Analytics 说明", name: "analytics_description", widget: "string" }
              - { label: "Marketing 标题", name: "marketing_title", widget: "string" }
              - { label: "Marketing 说明", name: "marketing_description", widget: "string" }
              - { label: "保存 Cookie 设置按钮", name: "save_button", widget: "string" }
              - { label: "重新打开 Cookie 设置", name: "reopen_button", widget: "string" }

  - name: "social-media"
    label: "Social Media — 社交媒体渠道"
    description: "在这里维护社交平台名称、简介、链接和展示图片。第一个启用的渠道显示为主卡片，其余显示为小卡片。"
    files:
      - file: "data/social-media.json"
        name: "social_media"
        label: "社交媒体渠道列表"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "社交媒体渠道（已填项目默认折叠，点击标题编辑）"
            name: "channels"
            widget: "list"
            label_singular: "添加社交媒体渠道"
            collapsed: auto
            add_to_top: true
            summary: "{{platform}}"
            thumbnail: "image"
            fields:
              - { label: "平台名称", name: "platform", widget: "select", options: ["LinkedIn", "YouTube", "Facebook", "Instagram", "X", "Other"], required: true }
              - { label: "平台简介", name: "description", widget: "text", required: true }
              - { label: "平台主页链接（完整 https:// 地址）", name: "url", widget: "string", required: true }
              - { label: "按钮文字", name: "button_text", widget: "string", required: true }
              - { label: "展示图片（Browse 上传本地图片）", name: "image", widget: "image", choose_url: false, required: true }
              - { label: "图片替代文本", name: "image_alt", widget: "string", required: false }
              - { label: "在网站显示", name: "active", widget: "boolean", default: true }

  - name: "media-contacts"
    label: "Media Contacts — 媒体联系人"
    description: "联系人姓名、职位、邮箱、头像都在这里维护。修改已发布内容后保存即可更新网站，不需要修改 HTML。"
    files:
      - file: "data/media-contacts.json"
        name: "media_contacts"
        label: "媒体联系人列表"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "媒体联系人（已填项目默认折叠，点击标题编辑）"
            name: "contacts"
            widget: "list"
            label_singular: "添加媒体联系人"
            collapsed: auto
            add_to_top: true
            summary: "{{name}} · {{title}}"
            thumbnail: "portrait"
            fields:
              - { label: "姓名（虚构示例）", name: "name", widget: "string", required: true }
              - { label: "职位（虚构示例）", name: "title", widget: "string", required: true }
              - { label: "邮箱（虚构示例）", name: "email", widget: "string", required: true }
              - { label: "头像（Browse 上传本地图片）", name: "portrait", widget: "image", choose_url: false, required: true }
              - { label: "头像替代文本", name: "portrait_alt", widget: "string", required: false }
              - { label: "在网站显示", name: "active", widget: "boolean", default: true }

  - name: "stories"
    label: "Stories — 深度文章"
    description: "用于产品技术、应用场景、客户案例和行业洞察。已发布文章可重新展开编辑；新文章排在最前面。"
    files:
      - file: "data/database.json"
        label: "文章列表"
        name: "stories_list"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "文章（已填文章默认折叠；点击标题展开编辑）"
            name: "articles"
            widget: "list"
            label_singular: "添加一篇深度文章"
            collapsed: auto
            add_to_top: true
            summary: "{{title}} · {{date}}"
            thumbnail: "image"
            fields:
              - { label: "文章标题（必填）", name: "title", widget: "string", required: true }
              - { label: "发布日期（必填）", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true }
              - { label: "文章摘要（可选）", name: "summary", widget: "text", required: false, hint: "1–3 句话概括文章价值。它会显示在文章卡片和正文标题下，留空则不显示。" }
              - { label: "封面图（可选，Browse 上传本地图片）", name: "image", widget: "image", choose_url: false, required: false }
              - label: "文章话题（可多选；不包含展会话题）"
                name: "tags"
                widget: "select"
                multiple: true
                required: false
                options:
                  - "Product & Technology"
                  - "Application & Use Cases"
                  - "Customer Stories"
                  - "Case Study"
                  - "Company News"
                  - "Industry Insights"
                  - "AI Vision"
                  - "Automation"
              - label: "正文（支持标题、段落、列表、链接和多张图片）"
                name: "body"
                widget: "markdown"
                required: true
                linked_images: false
                hint: "用正文编辑器工具栏插入图片；图片的替代文本用于无障碍阅读，不需要另设跳转链接。"

  - name: "events"
    label: "Trade Shows — 展会预告与报道"
    description: "分开管理两类内容：Upcoming Trade Shows 负责预告短卡片；Past Trade Shows Reports 负责完整文章。已发布项目保留在列表中，可随时展开编辑文字、日期、话题和图片。"
    files:
      - file: "data/events.json"
        label: "展会内容"
        name: "events_content"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "Upcoming Trade Shows — 展会预告（短卡片）"
            name: "announcements"
            widget: "list"
            label_singular: "添加展会预告"
            collapsed: auto
            add_to_top: true
            summary: "{{title}} · {{start_date}}"
            thumbnail: "cover"
            hint: "填写确定要参加的未来展会。已有展会显示为折叠的标题行，点击标题即可编辑；需要修改日期、文案、展位或封面时直接打开原项目。"
            fields:
              - { label: "展会名称", name: "title", widget: "string", required: true }
              - { label: "开始日期", name: "start_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true }
              - { label: "结束日期", name: "end_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true }
              - { label: "地点（城市、国家/地区）", name: "loc", widget: "string", required: true }
              - { label: "展位号（未确定可留空）", name: "booth", widget: "string", required: false, hint: "例如 Hall 4, Booth 4A12。未确定时留空，网站显示 To be confirmed。" }
              - { label: "展示主题", name: "theme", widget: "string", required: false }
              - { label: "预告简介（1–3 句话）", name: "desc", widget: "text", required: true, hint: "说明现场展示什么、适合哪些客户到访；只写已确认的信息。" }
              - label: "展会话题（可多选）"
                name: "tags"
                widget: "select"
                multiple: true
                required: false
                options:
                  - "Trade Shows & Exhibitions"
                  - "Product Demonstrations"
                  - "New Product Launch"
                  - "Industry Conference"
                  - "AI Vision"
                  - "Machine Vision"
                  - "Automation"
                  - "Quality Inspection"
              - { label: "封面图片（从电脑 Browse 上传；不自动转换图片格式）", name: "cover", widget: "image", choose_url: false, required: false }
              - { label: "展会官网 / 注册链接（可选）", name: "url", widget: "string", required: false, hint: "完整 https:// 链接；留空则不显示外链按钮。" }
          - label: "Past Trade Shows — 展会完整报道"
            name: "reports"
            widget: "list"
            label_singular: "添加展会报道"
            collapsed: auto
            add_to_top: true
            summary: "{{title}} · {{event_year}}"
            thumbnail: "cover"
            hint: "用于展前/展中/展后深度文章。已有报道可以展开修改标题、摘要、正文、封面和现场图片；不需要新建一篇来修正旧文章。"
            fields:
              - { label: "报道标题", name: "title", widget: "string", required: true }
              - { label: "展会年份（用于年份筛选）", name: "event_year", widget: "string", required: true, hint: "例如 2025。" }
              - { label: "文章发布日期", name: "published_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true }
              - { label: "展会开始日期（可选）", name: "start_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
              - { label: "展会结束日期（可选）", name: "end_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
              - { label: "地点（城市、国家/地区）", name: "loc", widget: "string", required: false }
              - { label: "展位号（可选）", name: "booth", widget: "string", required: false }
              - { label: "展会主题（可选）", name: "theme", widget: "string", required: false }
              - { label: "文章摘要（1–3 句话，可选）", name: "summary", widget: "text", required: false, hint: "概括读者从这篇展会报道中能了解到什么；显示在历史展会卡片和文章标题下。" }
              - label: "展会话题（可多选）"
                name: "tags"
                widget: "select"
                multiple: true
                required: false
                options:
                  - "Trade Shows & Exhibitions"
                  - "Product Demonstrations"
                  - "New Product Launch"
                  - "Industry Conference"
                  - "AI Vision"
                  - "Machine Vision"
                  - "Automation"
                  - "Quality Inspection"
              - { label: "报道封面图（Browse 上传；不自动转换图片格式）", name: "cover", widget: "image", choose_url: false, required: false }
              - label: "完整报道正文（支持多张图片）"
                name: "body"
                widget: "markdown"
                required: true
                linked_images: false
                hint: "像 Stories 一样写标题、小标题、段落、列表、链接和多张正文图片。修改旧文直接编辑这里后保存。"
              - label: "额外现场图片（可选）"
                name: "gallery"
                widget: "list"
                required: false
                label_singular: "添加一张现场图片"
                collapsed: true
                field:
                  label: "现场图片（Browse 上传原图）"
                  name: "image"
                  widget: "image"
                  choose_url: false
              - { label: "展会官网 / 相关链接（可选）", name: "url", widget: "string", required: false, hint: "完整 https:// 链接；留空则不显示外链按钮。" }
