backend:
  name: github
  repo: brilliantjiawork-sys/DEF-company
  branch: main
# A Save operation creates/updates an unpublished draft. Only Publish merges it into main.
publish_mode:
  type: editorial_workflow
  stages:
    - draft
  direct_publish: true
media_folder: images
public_folder: /images
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 88
        svg:
          optimize: true
  stock_assets:
    providers: []
collections:
- name: content-management
  label: 内部内容资源（系统）
  icon: folder_managed
  hide: false
  description: 系统内容存储集合。请从内容管理入口编辑。
  publish_mode:
    type: editorial_workflow
    stages:
      - draft
    direct_publish: true
  files:
  - name: home_intro
    label: Brand Introduction（品牌介绍）
    file: data/home-intro.json
    format: json
    editor:
      preview: false
    fields:
    - label: 浏览器页面标题
      name: page_title
      widget: string
      required: true
    - label: 品牌名称
      name: name
      widget: string
      required: true
    - label: 品牌标语
      name: tagline
      widget: string
    - label: Logo 图片
      name: logo
      widget: image
      required: false
      choose_url: false
    - label: Logo 替代文本
      name: logo_alt
      widget: string
    - label: 首页导航文字 Home
      name: nav_home
      widget: string
      required: true
    - label: 首页导航文字 Newsroom
      name: nav_newsroom
      widget: string
      required: true
    - label: 全局按钮 Contact Sales
      name: nav_contact_sales
      widget: string
      required: true
    - label: 首页主标题
      name: hero_title
      widget: string
      required: true
    - label: 首页品牌介绍文案
      name: hero_description
      widget: text
      required: true
    - label: 首页按钮文字
      name: hero_button
      widget: string
      required: true
    - label: 首页主视觉图片
      name: hero_image
      widget: image
      required: true
      choose_url: false
    - label: 主视觉图片替代文本
      name: hero_image_alt
      widget: string
  - name: home_newsletter
    label: Newsletter（邮件订阅）
    file: data/home-newsletter.json
    format: json
    editor:
      preview: false
    fields:
    - label: 订阅区图片
      name: newsletter_image
      widget: image
      required: true
      choose_url: false
    - label: 图片替代文本
      name: newsletter_image_alt
      widget: string
    - label: 图片说明
      name: newsletter_image_caption
      widget: text
    - label: 订阅区标题
      name: newsletter_title
      widget: string
      required: true
    - label: 订阅区介绍
      name: newsletter_description
      widget: text
      required: true
    - label: 工作邮箱输入提示
      name: newsletter_email_placeholder
      widget: string
      required: true
    - label: 订阅按钮文字
      name: newsletter_button
      widget: string
      required: true
    - label: 提交成功标题
      name: newsletter_success_title
      widget: string
      required: true
    - label: 提交成功说明
      name: newsletter_success_description
      widget: text
      required: true
  - name: stories_page_settings
    label: Stories 页面设置
    file: data/stories-page-settings.json
    format: json
    editor:
      preview: false
    fields:
    - label: Stories 页面标题
      name: page_title
      widget: string
      required: true
    - label: Stories 页面简介
      name: page_intro
      widget: text
      required: true
    - label: 文章详情页返回 Stories 的按钮文字
      name: back_button
      widget: string
      required: true
  - name: events_page_settings
    label: Trade Shows 页面设置
    file: data/trade-shows-page-settings.json
    format: json
    editor:
      preview: false
    fields:
    - label: Trade Shows 页面标题
      name: page_title
      widget: string
      required: true
    - label: Trade Shows 页面简介
      name: page_intro
      widget: text
      required: true
    - label: Trade Show Articles 切换按钮文字
      name: articles_tab_label
      widget: string
      required: true
    - label: 展会文章区域说明
      name: articles_intro
      widget: text
      required: true
    - label: 展会详情页返回按钮文字
      name: back_button
      widget: string
      required: true
  - name: upcoming_shows
    label: Upcoming Shows｜展会资料
    file: data/events.json
    format: json
    editor:
      preview: false
    fields:
    - label: 展会活动
      name: exhibitions
      widget: list
      label_singular: 新增一场展会
      collapsed: true
      minimize_collapsed: false
      add_to_top: true
      summary: '{{title}} · {{start_date}}'
      thumbnail: cover
      fields:
      - label: 展会名称
        name: title
        widget: string
        required: true
      - label: 展会标题字号（px）
        name: detail_title_font_size
        hint: 控制官网展会详情页最上方的展会名称，不影响正文。
        widget: number
        value_type: int
        default: 34
        min: 28
        max: 42
        step: 1
        required: false
      - label: 开始日期
        name: start_date
        widget: datetime
        required: true
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: 结束日期
        name: end_date
        widget: datetime
        required: true
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: 展位号
        name: booth
        widget: string
        required: true
      - label: 地点（城市、地区和国家）
        name: loc
        widget: string
        required: true
      - label: 场馆（可选）
        name: venue
        widget: string
        required: false
      - label: Industry｜行业
        name: industries
        widget: select
        multiple: true
        options: &id001
        - Automotive
        - Electronics
        - Food & Beverage
        - Packaging
        - Semiconductors
        - Logistics
        - Pharmaceuticals
      - label: Content Topic｜内容话题（与 Stories、Trade Show Articles 共用同一套选项）
        name: tags
        widget: select
        multiple: true
        options: &content_topics
        - Machine Vision
        - AI & Deep Learning
        - Defect Detection
        - Quality Control
        - AOI
        - 3D Vision
        - Robotics & Automation
        - Positioning & Measurement
        - Electronics & Semiconductors
        - Food & Beverage Inspection
        - Packaging Inspection
        - Warehouse & Logistics
        - Innovation
        - Sustainability
      - label: 展会封面图（官网卡片图片）
        name: cover
        widget: image
        required: false
        choose_url: false
        hint: "官网会完整展示上传图片，不裁剪、不拉伸、不改变原图比例。为让展会卡片更协调，建议优先上传横向 4:3 图片（建议 1200×900 px）；横图会使用标准图文比例，竖图会自动缩窄图片栏并完整展示。图片原文件不会被修改。"
      - label: 图片替代文本
        name: cover_alt
        widget: string
        required: false
      - label: About This Show｜展会详情描述
        name: summary
        widget: text
        required: false
        hint: 仅显示在展会详情页；建议写 1–3 句说明展会内容，不会显示在 Upcoming 卡片。
      - label: About This Show 描述字号（px）
        name: description_font_size
        hint: 只影响官网 About This Show 描述，不影响展会标题。
        widget: number
        value_type: int
        default: 16
        min: 14
        max: 20
        step: 1
        required: false

      - label: 详情页亮点（可选）
        name: highlights
        widget: text
        required: false
      - label: 详情页正文（可选）
        name: body
        widget: richtext
        format: markdown
        modes:
        - rich_text
        - raw
        buttons:
        - heading-two
        - heading-three
        - bold
        - italic
        - bulleted-list
        - numbered-list
        - link
        - quote
        required: false
      - label: 正文/亮点字号（px）
        name: body_font_size
        hint: 控制详情页正文和亮点内容的字号。
        widget: number
        value_type: int
        default: 16
        min: 14
        max: 20
        step: 1
        required: false

      - label: 详情页图片集（可选）
        name: gallery
        widget: list
        required: false
        collapsed: true
        label_singular: 展会图片
        fields:
        - label: 图片
          name: image
          widget: image
          required: true
          choose_url: false
        - label: 图片说明
          name: caption
          widget: string
          required: false
        - label: 图片替代文本
          name: alt
          widget: string
          required: false
      - label: 官方/报名网址（可选）
        name: url
        widget: string
        required: false
      - label: 显示预约 CTA
        name: cta_enabled
        widget: boolean
        default: true
      - label: 预约按钮文案
        name: cta_label
        widget: select
        default: Book a Meeting at This Show
        options:
        - Book a Meeting at This Show
        - Talk to Our Team
        - Contact Sales
        - Book a Demo
      - label: 虚构示例标记
        name: illustrative_example
        widget: boolean
        default: true
  - name: social_page
    label: Social Media 页面文案
    file: data/newsroom-social-media.json
    format: json
    editor:
      preview: false
    fields:
    - label: 页面标题
      name: social_title
      widget: string
      required: true
    - label: 免责声明开头
      name: social_disclaimer_lead
      widget: string
    - label: 免责声明正文
      name: social_disclaimer_text
      widget: text
    - label: 图片来源名称
      name: image_source_label
      widget: string
    - label: 图片来源网址
      name: image_source_url
      widget: string
  - name: social_media
    label: 社交媒体渠道卡片
    file: data/social-media.json
    format: json
    editor:
      preview: false
    fields:
    - label: 渠道卡片（点开单张卡片进行编辑）
      name: channels
      widget: list
      label_singular: 添加一个渠道
      collapsed: true
      minimize_collapsed: true
      add_to_top: false
      summary: '{{platform}}'
      thumbnail: image
      fields:
      - label: 平台名称
        name: platform
        widget: select
        required: true
        options:
        - LinkedIn
        - YouTube
        - Facebook
        - Instagram
        - X
        - Other
      - label: 平台简介
        name: description
        widget: text
        required: true
      - label: 平台主页链接（https://）
        name: url
        widget: string
        required: true
      - label: 按钮文字
        name: button_text
        widget: string
        required: true
      - label: 图片
        name: image
        widget: image
        required: true
        choose_url: false
      - label: 图片替代文本
        name: image_alt
        widget: string
      - label: 在网站显示
        name: active
        widget: boolean
        default: true
  - name: media_page
    label: Media 页面文案
    file: data/newsroom-media.json
    format: json
    editor:
      preview: false
    fields:
    - label: 页面标题
      name: media_title
      widget: string
      required: true
    - label: 页面简介
      name: media_intro
      widget: text
      required: true
    - label: 免责声明开头
      name: media_disclaimer_lead
      widget: string
    - label: 免责声明正文
      name: media_disclaimer_text
      widget: text
  - name: media_contacts
    label: 媒体联系人列表
    file: data/media-contacts.json
    format: json
    editor:
      preview: false
    fields:
    - label: 媒体联系人（点开单个人进行编辑）
      name: contacts
      widget: list
      label_singular: 添加媒体联系人
      collapsed: true
      minimize_collapsed: true
      add_to_top: true
      summary: '{{name}} · {{title}}'
      thumbnail: portrait
      fields:
      - label: 姓名
        name: name
        widget: string
        required: true
      - label: 职位
        name: title
        widget: string
        required: true
      - label: 联系邮箱
        name: email
        widget: string
        required: true
      - label: 头像（可选）
        name: portrait
        widget: image
        required: false
        choose_url: false
      - label: 头像替代文本
        name: portrait_alt
        widget: string
      - label: 在网站显示
        name: active
        widget: boolean
        default: true
  - name: contact_content
    label: Contact Sales 表单文案
    file: data/contact-content.json
    format: json
    editor:
      preview: false
    fields:
    - label: 表单标题
      name: title
      widget: string
    - label: 表单说明
      name: description
      widget: text
    - label: Work Email 标签
      name: email_label
      widget: string
    - label: First Name 标签
      name: first_name_label
      widget: string
    - label: Last Name 标签
      name: last_name_label
      widget: string
    - label: Company 标签
      name: company_label
      widget: string
    - label: Phone 标签
      name: phone_label
      widget: string
    - label: Country/Region 标签
      name: country_label
      widget: string
    - label: Zip Code 标签
      name: zip_code_label
      widget: string
    - label: Industry 标签
      name: industry_label
      widget: string
    - label: Additional Comments 标签
      name: message_label
      widget: string
    - label: 国家下拉提示
      name: country_placeholder
      widget: string
    - label: 行业下拉提示
      name: industry_placeholder
      widget: string
    - label: 留言输入提示
      name: message_placeholder
      widget: string
    - label: 提交按钮文字
      name: submit_button
      widget: string
    - label: 提交成功标题
      name: success_title
      widget: string
    - label: 提交成功说明
      name: success_description
      widget: text
    - label: 返回首页按钮文字
      name: return_button
      widget: string
  - name: cookie_content
    label: Cookie & Privacy 文案
    file: data/cookie-content.json
    format: json
    editor:
      preview: false
    fields:
    - label: 标题
      name: title
      widget: string
    - label: 说明
      name: description
      widget: text
    - label: Reject all 按钮
      name: reject_button
      widget: string
    - label: Customize 按钮
      name: customize_button
      widget: string
    - label: Accept all 按钮
      name: accept_button
      widget: string
    - label: 必要 Cookie 标题
      name: necessary_title
      widget: string
    - label: 必要 Cookie 说明
      name: necessary_description
      widget: text
    - label: Analytics 标题
      name: analytics_title
      widget: string
    - label: Analytics 说明
      name: analytics_description
      widget: text
    - label: Marketing 标题
      name: marketing_title
      widget: string
    - label: Marketing 说明
      name: marketing_description
      widget: text
    - label: 保存设置按钮
      name: save_button
      widget: string
    - label: 重新打开设置按钮
      name: reopen_button
      widget: string
- name: stories
  label: Stories
  icon: article
  folder: data/stories
  create: true
  extension: json
  format: json
  slug: '{{slug}}'
  publish_mode:
    type: editorial_workflow
    stages:
    - draft
    direct_publish: true
  editor:
    preview: false
  fields:
  - label: 文章标题
    name: title
    widget: string
    required: true
  - label: 标题字号（px）
    name: detail_title_font_size
    hint: 控制官网详情页最上方的文章标题，不影响正文。
    widget: number
    value_type: int
    default: 34
    min: 28
    max: 42
    step: 1
    required: false
  - label: 发布日期
    name: date
    widget: datetime
    required: true
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
  - label: Content Category｜内容类别
    name: category
    widget: select
    required: true
    default: Product & Technology
    options:
    - Product & Technology
    - Industry Applications
    - Industry Insights
    - Company & Culture
    - Brand News & Updates
  - label: Industry｜行业
    name: industries
    widget: select
    multiple: true
    options: *id001
  - label: Content Topic｜内容话题（与 Upcoming Shows、Trade Show Articles 共用同一套选项）
    name: tags
    widget: select
    multiple: true
    options: *content_topics
  - label: 卡片摘要（可调整官网字号）
    name: summary
    widget: text
    required: true
  - label: 摘要字号（px）
    name: summary_font_size
    hint: 控制列表和推荐卡片里的摘要文字大小，不控制详情页标题。
    widget: number
    value_type: int
    default: 16
    min: 14
    max: 18
    step: 1
    required: false
  - label: 封面图片
    name: image
    widget: image
    required: false
    choose_url: false
  - label: 图片替代文本
    name: image_alt
    widget: string
    required: false
  - label: 虚构应用示例
    name: illustrative_example
    widget: boolean
    default: false
  - label: 正文
    name: body
    widget: richtext
    format: markdown
    modes:
    - rich_text
    - raw
    buttons:
    - heading-two
    - heading-three
    - bold
    - italic
    - bulleted-list
    - numbered-list
    - link
    - quote
    required: true
  - label: 正文默认字号（px）
    name: body_font_size
    hint: 控制官网详情页正文段落的基础字号，不影响文章标题。
    widget: number
    value_type: int
    default: 17
    min: 14
    max: 20
    step: 1
    required: false
  - label: 显示销售 CTA
    name: cta_enabled
    widget: boolean
    default: false
  - label: CTA 文案
    name: cta_label
    widget: select
    default: Talk to Our Team
    options:
    - Talk to Our Team
    - Contact Sales
    - Book a Demo
