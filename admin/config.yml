backend:
  name: github
  repo: brilliantjiawork-sys/DEF-company
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  # 1. 文章
  - name: "stories"
    label: "Stories (文章)"
    files:
      - file: "data/database.json"
        label: "文章列表"
        name: "stories_list"
        fields:
          - label: "所有文章"
            name: "articles"
            widget: "list"
            fields:
              - { label: "文章标题", name: "title", widget: "string" }
              - { label: "发布日期", name: "date", widget: "datetime" }
              - { label: "封面图", name: "image", widget: "image" }
              - label: "话题标签"
                name: "tags"
                widget: "select"
                multiple: true
                options: ["AI Vision", "Automation", "Case Study", "Company News"]
              - { label: "正文内容", name: "body", widget: "markdown" }

  # 2. 展会
  - name: "events"
    label: "Events (展会)"
    files:
      - file: "data/events.json"
        label: "展会列表"
        name: "events_list"
        fields:
          - label: "所有展会"
            name: "exhibitions"
            widget: "list"
            fields:
              - { label: "展会名称", name: "title", widget: "string" }
              - { label: "年份", name: "year", widget: "string" }
              - { label: "日期", name: "date", widget: "string" }
              - { label: "地点", name: "loc", widget: "string" }
              - { label: "简介", name: "desc", widget: "text" }
              - { label: "封面图", name: "cover", widget: "image" }

  # 3. 主页专属快捷入口（含Logo）
  - name: "global_settings"
    label: "主页与Logo设置"
    files:
      - file: "data/home_images.json"
        label: "首页与全局配图"
        name: "home_images"
        fields:
          - { label: "网站Logo", name: "logo_img", widget: "image" }
          - { label: "首页大图", name: "hero_img", widget: "image" }
          - { label: "订阅区配图", name: "team_img", widget: "image" }
