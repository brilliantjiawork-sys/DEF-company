    - bulleted-list
    - numbered-list
    - link
    - quote
    required: true
  - label: 正文默认字号（px）
    name: body_font_size
    hint: 控制官网详情页正文段落的基础字号，不影响文章标题。
    widget: number
    value_type: int
    default: 17
    min: 14
    max: 20
    step: 1
    required: false
  - label: 显示销售 CTA
    name: cta_enabled
    widget: boolean
    default: false
  - label: CTA 文案
    name: cta_label
    widget: select
    default: Talk to Our Team
    options:
    - Talk to Our Team
