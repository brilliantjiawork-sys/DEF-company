      - label: 行业（可多选）
        name: industries
        widget: select
        options: *id002
        multiple: true
      - label: 正文内容
        name: body
        widget: markdown
        required: true
        linked_images: false
      - label: 产品 / 方案重点
        name: highlights
        widget: markdown
        required: false
        linked_images: false
      - label: 额外现场图片（可选）
        name: gallery
        widget: list
        required: false
        collapsed: true
        minimize_collapsed: true
        label_singular: 添加一张现场图片
        fields:
        - label: 图片
          name: image
          widget: image
          required: true
          choose_url: false
        - label: 图片替代文本
          name: alt
          widget: string
        - label: 图片说明
          name: caption
          widget: string
      - label: 虚构活动/应用标记
        name: illustrative_example
        widget: boolean
        hint: 模拟项目的展会信息请保持开启。
        default: true
